groups:
  - name: s120-d100-r5m
    interval: 30s
    rules:
      - record: probe:visible_samples
        expr: count_over_time(demo_requests_total{job="s120-d100-r5m"}[5m])
        labels: { combo: s120-d100-r5m }
      - alert: KnownTrue_s120_d100_r5m
        expr: rate(demo_requests_total{job="s120-d100-r5m"}[5m]) >= 0
        for: 3m
        labels: { combo: s120-d100-r5m }
