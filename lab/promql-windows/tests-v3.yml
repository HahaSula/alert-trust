# Prometheus 3.13.5：各 range 函式的最小視窗
# 由 gen_tests.py 產生，不要手改。
rule_files: []
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: "c{job=\"lab\"}"
        values: "0+10x20"
      - series: "g{job=\"lab\"}"
        values: "1+1x20"
      - series: "c_gap{job=\"lab\"}"
        values: "0 10 20 _ 40 50 60 70 80 90"
      - series: "c_inflight{job=\"lab\"}"
        values: "0 10 20 30"
      - series: "s{job=\"lab\"}"
        values: "0 10 20 stale"
    promql_expr_test:
      # [A 左開] R = 2I，邊界上的 sample 不算：只有 2 個
      - expr: "count_over_time(c[1m])"
        eval_time: 2m
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 2
      # [A 左開] R = I：只有 1 個 sample，rate 空
      - expr: "count(rate(c[30s]))"
        eval_time: 1m
        exp_samples: []
      # [A 左開] R = I：count_over_time 是 1
      - expr: "count_over_time(c[30s])"
        eval_time: 1m
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 1
      # [B 2 個 sample] rate：R = 2I − 1s 只剩 1 個
      - expr: "count(rate(c[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] increase：R = 2I − 1s 只剩 1 個
      - expr: "count(increase(c[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] delta：R = 2I − 1s 只剩 1 個
      - expr: "count(delta(g[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] irate：R = 2I − 1s 只剩 1 個
      - expr: "count(irate(c[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] idelta：R = 2I − 1s 只剩 1 個
      - expr: "count(idelta(g[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] deriv：R = 2I − 1s 只剩 1 個
      - expr: "count(deriv(g[59s]))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] predict_linear：R = 2I − 1s 只剩 1 個
      - expr: "count(predict_linear(g[59s], 60))"
        eval_time: 1m59s
        exp_samples: []
      # [B 2 個 sample] rate：R = 2I 有 2 個
      - expr: "count(rate(c[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] increase：R = 2I 有 2 個
      - expr: "count(increase(c[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] delta：R = 2I 有 2 個
      - expr: "count(delta(g[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] irate：R = 2I 有 2 個
      - expr: "count(irate(c[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] idelta：R = 2I 有 2 個
      - expr: "count(idelta(g[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] deriv：R = 2I 有 2 個
      - expr: "count(deriv(g[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [B 2 個 sample] predict_linear：R = 2I 有 2 個
      - expr: "count(predict_linear(g[60s], 60))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] avg_over_time：R = I − 1s 沒有 sample
      - expr: "count(avg_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] min_over_time：R = I − 1s 沒有 sample
      - expr: "count(min_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] max_over_time：R = I − 1s 沒有 sample
      - expr: "count(max_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] sum_over_time：R = I − 1s 沒有 sample
      - expr: "count(sum_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] count_over_time：R = I − 1s 沒有 sample
      - expr: "count(count_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] last_over_time：R = I − 1s 沒有 sample
      - expr: "count(last_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] quantile_over_time：R = I − 1s 沒有 sample
      - expr: "count(quantile_over_time(0.5, g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] stddev_over_time：R = I − 1s 沒有 sample
      - expr: "count(stddev_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] stdvar_over_time：R = I − 1s 沒有 sample
      - expr: "count(stdvar_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] present_over_time：R = I − 1s 沒有 sample
      - expr: "count(present_over_time(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] changes：R = I − 1s 沒有 sample
      - expr: "count(changes(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] resets：R = I − 1s 沒有 sample
      - expr: "count(resets(g[29s]))"
        eval_time: 1m59s
        exp_samples: []
      # [C 1 個 sample] avg_over_time：R = I 有 1 個
      - expr: "count(avg_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] min_over_time：R = I 有 1 個
      - expr: "count(min_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] max_over_time：R = I 有 1 個
      - expr: "count(max_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] sum_over_time：R = I 有 1 個
      - expr: "count(sum_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] count_over_time：R = I 有 1 個
      - expr: "count(count_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] last_over_time：R = I 有 1 個
      - expr: "count(last_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] quantile_over_time：R = I 有 1 個
      - expr: "count(quantile_over_time(0.5, g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] stddev_over_time：R = I 有 1 個
      - expr: "count(stddev_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] stdvar_over_time：R = I 有 1 個
      - expr: "count(stdvar_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] present_over_time：R = I 有 1 個
      - expr: "count(present_over_time(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] changes：R = I 有 1 個
      - expr: "count(changes(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] resets：R = I 有 1 個
      - expr: "count(resets(g[30s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] changes 只有 1 個 sample 時回傳 0（g 其實每次都變）
      - expr: "changes(g[30s])"
        eval_time: 1m59s
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 0
      # [C 1 個 sample] changes 有 2 個 sample 才看得到變化
      - expr: "changes(g[60s])"
        eval_time: 1m59s
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 1
      # [C 1 個 sample] absent_over_time 反過來：視窗內沒有 sample 就回傳 1（假的「消失」）
      - expr: "absent_over_time(c[29s])"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [C 1 個 sample] absent_over_time：有 1 個 sample 就回傳空
      - expr: "absent_over_time(c[30s])"
        eval_time: 1m59s
        exp_samples: []
      # [D 失敗 k=1] rate：R = 2I，缺 1 個只剩 1 個
      - expr: "count(rate(c_gap[1m]))"
        eval_time: 2m
        exp_samples: []
      # [D 失敗 k=1] rate：R = (2+1)I
      - expr: "count(rate(c_gap[90s]))"
        eval_time: 2m
        exp_samples:
          - labels: "{}"
            value: 1
      # [D 失敗 k=1] last_over_time：R = I，唯一的 sample 缺了
      - expr: "count(last_over_time(c_gap[30s]))"
        eval_time: 1m59s
        exp_samples: []
      # [D 失敗 k=1] last_over_time：R = (1+1)I
      - expr: "count(last_over_time(c_gap[60s]))"
        eval_time: 1m59s
        exp_samples:
          - labels: "{}"
            value: 1
      # [E 寫入延遲 d=20s] rate：R = 2I + d − 1s
      - expr: "count(rate(c_inflight[79s]))"
        eval_time: 2m19s
        exp_samples: []
      # [E 寫入延遲 d=20s] rate：R = 2I + d
      - expr: "count(rate(c_inflight[80s]))"
        eval_time: 2m19s
        exp_samples:
          - labels: "{}"
            value: 1
      # [E 寫入延遲 d=20s] rate：offset 20s（O ≥ d），R = 2I − 1s
      - expr: "count(rate(c_inflight[59s] offset 20s))"
        eval_time: 2m19s
        exp_samples: []
      # [E 寫入延遲 d=20s] rate：offset 20s（O ≥ d），R = 2I
      - expr: "count(rate(c_inflight[60s] offset 20s))"
        eval_time: 2m19s
        exp_samples:
          - labels: "{}"
            value: 1
      # [E 寫入延遲 d=20s] last_over_time：R = I + d − 1s
      - expr: "count(last_over_time(c_inflight[49s]))"
        eval_time: 2m19s
        exp_samples: []
      # [E 寫入延遲 d=20s] last_over_time：R = I + d
      - expr: "count(last_over_time(c_inflight[50s]))"
        eval_time: 2m19s
        exp_samples:
          - labels: "{}"
            value: 1
      # [F staleness] marker 之前：instant selector 有值
      - expr: "s"
        eval_time: 1m20s
        exp_samples:
          - labels: "s{job=\"lab\"}"
            value: 20
      # [F staleness] marker 之後：instant selector 立刻變空（不等 5m lookback）
      - expr: "s"
        eval_time: 1m40s
        exp_samples: []
      # [F staleness] range 函式略過 marker：視窗內只剩 1 個 sample
      - expr: "count(rate(s[1m]))"
        eval_time: 1m40s
        exp_samples: []
      # [F staleness] range 函式略過 marker：marker 之前的 3 個 sample 仍算
      - expr: "count_over_time(s[2m])"
        eval_time: 1m40s
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 3
      # [F staleness] last_over_time 回傳 marker 之前的舊值，看不出 series 已經 stale
      - expr: "last_over_time(s[2m])"
        eval_time: 1m40s
        exp_samples:
          - labels: "s{job=\"lab\"}"
            value: 20
      # [G subquery] 內層 rate[30s] 每一步都只有 1 個 sample：整個 subquery 空
      - expr: "max_over_time(rate(c[30s])[2m:30s])"
        eval_time: 2m
        exp_samples: []
      # [G subquery] 內層 rate[1m] 每一步都有 2 個 sample
      - expr: "count(max_over_time(rate(c[1m])[2m:30s]))"
        eval_time: 2m
        exp_samples:
          - labels: "{}"
            value: 1
      # [G subquery] 原始 sample：(0,120] 內 c_gap 只有 3 個
      - expr: "count_over_time(c_gap[2m])"
        eval_time: 2m
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 3
      # [G subquery] subquery 的步點用 lookback 補值：缺的那一步也有值，算成 4 個
      - expr: "count_over_time(c_gap[2m:30s])"
        eval_time: 2m
        exp_samples:
          - labels: "{job=\"lab\"}"
            value: 4
