global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels: { cluster: lab, replica: a }
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: thanos
    static_configs:
      - targets: ["sidecar:10902", "query:10902", "store:10902", "rule:10902", "compact:10902"]
