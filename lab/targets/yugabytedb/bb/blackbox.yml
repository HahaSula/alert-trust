modules:
  http_2xx:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
  # master 的 JSON API 在 follower 上會轉送到 leader；轉送失敗時仍回 200，內容是錯誤訊息。
  # 「body 裡有這個 key」才代表真的拿到 leader 的回應。
  yb_master_health_reachable:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"dead_nodes"']
  # /api/v1/health-check：dead_nodes（超過 tserver_unresponsive_timeout_ms 沒有 heartbeat）或 under_replicated_tablets 非空就失敗
  yb_master_health_clean:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"dead_nodes"']
      fail_if_body_matches_regexp: ['"dead_nodes":\["', '"under_replicated_tablets":\["']
  # /api/v1/tablet-replication：leaderless_tablets 非空就失敗（沒有 valid leader 超過 leaderless_tablet_alert_delay_secs）
  yb_master_no_leaderless:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"leaderless_tablets"']
      fail_if_body_matches_regexp: ['"leaderless_tablets":\[\{']
  # /api/v1/tablet-under-replication：underreplicated_tablets 非空就失敗
  yb_master_no_underreplicated:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"underreplicated_tablets"']
      fail_if_body_matches_regexp: ['"underreplicated_tablets":\[\{']
  # tserver 的 /api/v1/health-check：failed_tablets 非空就失敗
  yb_tserver_health:
    prober: http
    timeout: 4s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"failed_tablets"']
      fail_if_body_matches_regexp: ['"failed_tablets":\["']
  tcp_connect:
    prober: tcp
    timeout: 4s
    tcp:
      preferred_ip_protocol: ip4
