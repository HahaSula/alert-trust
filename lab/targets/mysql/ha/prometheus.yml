global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/mysql.yml]
scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ["ex-mdb1:9104"]
        labels: { instance: mdb1, flavour: mariadb, cluster: mdb, role: primary }
      - targets: ["ex-mdb2:9104"]
        labels: { instance: mdb2, flavour: mariadb, cluster: mdb, role: replica }
      - targets: ["ex-my1:9104"]
        labels: { instance: my1, flavour: mysql, cluster: my, role: primary }
      - targets: ["ex-my2:9104"]
        labels: { instance: my2, flavour: mysql, cluster: my, role: replica }
