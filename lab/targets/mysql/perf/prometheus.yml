global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/mysql.yml]
scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ["ex-mdb:9104"]
        labels: { instance: mdb, flavour: mariadb }
      - targets: ["ex-my:9104"]
        labels: { instance: my, flavour: mysql }
