# scrape_interval 5s（lab 用，比規則檔假設的 15s 短）。job 名稱 pd、tikv、tidb 和 TiUP 產生的相同，官方規則才能直接比較。
# probe job 把 instance 改成和被探測元件的 /metrics target 相同的 host:port，規則才能用 on (instance) 交叉比對。
# #PD_LEADER_ADDR# 由 run.sh 換掉：讓 PD leader 的 scrape 失敗（改去一個沒有在聽的 port），instance label 不變。
global: { scrape_interval: 5s, scrape_timeout: 4s, evaluation_interval: 5s }
rule_files: [/etc/rules/tidb.yml, /etc/official/*.yml]
scrape_configs:
  - job_name: pd
    static_configs: [{ targets: [pd1:2379, pd2:2379, pd3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      
  - job_name: tikv
    static_configs: [{ targets: [tikv1:20180, tikv2:20180, tikv3:20180] }]
  - job_name: tidb
    static_configs: [{ targets: [tidb:10080] }]
  # 同一個 TiDB 再用另一個 job 名稱抓一次（例子：非 TiUP 部署的命名），看官方規則寫死的 job="tidb" 會漏掉什麼
  - job_name: tidb-other-name
    static_configs: [{ targets: [tidb:10080] }]
  - job_name: pd-readyz
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [pd1:2379, pd2:2379, pd3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/readyz" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: pd-ping
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [pd1:2379, pd2:2379, pd3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/pd/api/v1/ping" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: pd-health
    metrics_path: /probe
    params: { module: [pd_health_all] }
    static_configs: [{ targets: [pd1:2379, pd2:2379, pd3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/pd/api/v1/health" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: pd-leader-api
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [pd1:2379, pd2:2379, pd3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/pd/api/v1/leader" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: tikv-status
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [tikv1:20180, tikv2:20180, tikv3:20180] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/status" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: tidb-status
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [tidb:10080] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/status" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: tidb-sql
    metrics_path: /probe
    params: { module: [tidb_sql_handshake] }
    static_configs: [{ targets: [tidb:10080] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { target_label: __param_target, replacement: "tidb:4000" }
      - { target_label: __address__, replacement: blackbox:9115 }
