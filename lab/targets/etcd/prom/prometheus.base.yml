# scrape_interval 5s（lab 用，比規則檔假設的 15s 短）。三個 probe job 把 instance 改成和 job="etcd" 相同的 host:port，
# 規則才能用 on (instance) 交叉比對 up、probe_success 與 etcd_server_has_leader。
global: { scrape_interval: 5s, scrape_timeout: 4s, evaluation_interval: 5s }
rule_files: [/etc/rules/etcd.yml]
scrape_configs:
  - job_name: etcd
    #SAMPLE_LIMIT#
    static_configs: [{ targets: [e1:2379, e2:2379, e3:2379] }]
  - job_name: etcd-readyz
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [e1:2379, e2:2379, e3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/readyz" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: etcd-livez
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [e1:2379, e2:2379, e3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/livez" }
      - { target_label: __address__, replacement: blackbox:9115 }
  - job_name: etcd-health
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs: [{ targets: [e1:2379, e2:2379, e3:2379] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: instance }
      - { source_labels: [__address__], target_label: __param_target, replacement: "http://${1}/health" }
      - { target_label: __address__, replacement: blackbox:9115 }
