# 設定 D：group_wait 10s、group_interval 30s、repeat_interval 105s（lab 專用）
route:
  receiver: hook
  group_by: [alertname, scen]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 105s
receivers:
  - name: hook
    webhook_configs:
      - url: http://recv:8080/hook/d
        send_resolved: true
