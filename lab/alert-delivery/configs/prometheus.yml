# lab 專用：scrape 與 evaluation 都是 5s，送給兩台 Alertmanager（設定 A、B）。
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [am-a:9093, am-b:9093]
scrape_configs:
  - job_name: recv
    static_configs:
      - targets: [recv:8080]
