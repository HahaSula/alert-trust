<svg viewBox="0 0 870 462" role="img" aria-label="Alert 從 ruler 進入 API 與記憶體 store，經 dispatcher 分組，每個 group 定期 flush 進通知流程，再送到接收端。Inhibitor、Silences 與 nflog 提供查詢，後兩者 gossip 給 peer 並快照到磁碟。">
  <defs><marker id="am-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="20" y="36" width="104" height="58" rx="4"/>
    <rect x="170" y="36" width="130" height="58" rx="4"/>
    <rect class="hot" x="350" y="36" width="140" height="58" rx="4"/>
    <rect x="540" y="36" width="130" height="58" rx="4"/>
    <rect x="716" y="36" width="134" height="58" rx="4"/>
    <rect x="20" y="204" width="706" height="80" rx="4" stroke-dasharray="4 3"/>
    <rect x="28" y="236" width="80" height="36" rx="3"/><rect x="116" y="236" width="80" height="36" rx="3"/><rect x="204" y="236" width="80" height="36" rx="3"/><rect x="292" y="236" width="80" height="36" rx="3"/><rect x="380" y="236" width="80" height="36" rx="3"/><rect x="468" y="236" width="80" height="36" rx="3"/><rect x="556" y="236" width="80" height="36" rx="3"/><rect x="644" y="236" width="74" height="36" rx="3"/>
    <rect x="770" y="226" width="84" height="46" rx="4"/>
    <rect x="76" y="334" width="160" height="50" rx="4"/>
    <rect x="256" y="334" width="150" height="50" rx="4"/>
    <rect x="426" y="334" width="300" height="50" rx="4"/>
    <rect x="256" y="414" width="470" height="34" rx="4"/>
    <line x1="124" y1="65" x2="168" y2="65" marker-end="url(#am-ah)"/>
    <line x1="300" y1="65" x2="348" y2="65" marker-end="url(#am-ah)"/>
    <line x1="490" y1="65" x2="538" y2="65" marker-end="url(#am-ah)"/>
    <line x1="670" y1="65" x2="714" y2="65" marker-end="url(#am-ah)"/>
    <polyline points="783,94 783,160 40,160 40,234" marker-end="url(#am-ah)"/>
    <line x1="726" y1="250" x2="768" y2="250" marker-end="url(#am-ah)"/>
    <line x1="156" y1="332" x2="156" y2="274" marker-end="url(#am-ah)" stroke-dasharray="3 3"/>
    <line x1="332" y1="332" x2="332" y2="274" marker-end="url(#am-ah)" stroke-dasharray="3 3"/>
    <line x1="508" y1="332" x2="508" y2="274" marker-end="url(#am-ah)" stroke-dasharray="3 3"/>
    <line x1="681" y1="274" x2="681" y2="332" marker-end="url(#am-ah)"/>
    <line x1="332" y1="384" x2="332" y2="412" marker-end="url(#am-ah)"/>
    <line x1="576" y1="384" x2="576" y2="412" marker-end="url(#am-ah)"/>
  </g>
  <g fill="currentColor" font-size="12" text-anchor="middle" font-family="Noto Sans TC, sans-serif">
    <text x="72" y="62">Prometheus</text><text x="72" y="80" font-size="11" class="dim">vmalert，每台都送</text>
    <text x="235" y="62">API</text><text x="235" y="80" font-size="11" class="dim">POST /api/v2/alerts</text>
    <text x="420" y="62">Alert store</text><text x="420" y="80" font-size="11" class="dim">只在記憶體，一把鎖</text>
    <text x="605" y="62">Dispatcher</text><text x="605" y="80" font-size="11" class="dim">比對路由樹</text>
    <text x="783" y="62">Aggregation groups</text><text x="783" y="80" font-size="11" class="dim">每 group 一條 goroutine</text>
    <text x="514" y="28" font-size="11" class="dim">channel 長度 200</text>
    <text x="400" y="152" font-size="11" class="dim">第一次等 group_wait，之後每 group_interval flush 一次</text>
    <text x="68" y="258">settle</text><text x="156" y="258">inhibit</text><text x="244" y="258">時間區間</text><text x="332" y="258">silence</text><text x="420" y="258">wait</text><text x="508" y="258">dedup</text><text x="596" y="258">retry</text><text x="681" y="258">寫 nflog</text>
    <text x="812" y="254">接收端</text>
    <text x="156" y="355">Inhibitor</text><text x="156" y="373" font-size="11" class="dim">也訂閱 alert store</text>
    <text x="331" y="355">Silences</text><text x="331" y="373" font-size="11" class="dim">會落盤</text>
    <text x="576" y="355">Notification log（nflog）</text><text x="576" y="373" font-size="11" class="dim">會落盤，記錄送過什麼</text>
    <text x="491" y="436" font-size="11">gossip 同步給 peer，預設每 15 分鐘快照到磁碟</text>
  </g>
  <g fill="currentColor" font-size="11" class="dim" font-family="Noto Sans TC, sans-serif">
    <text x="56" y="226">每個 receiver 一份</text>
    <text x="380" y="226">receiver 內每個 integration 各跑一份，彼此並行</text>
  </g>
</svg>
