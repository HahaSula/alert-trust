<svg viewBox="0 0 900 330" role="img" aria-label="Coverage of rate extrapolation and irate interval within the same window">
      <line x1="60" y1="290" x2="860" y2="290" class="ax"/>
      <g class="tk">
        <text x="160" y="308" text-anchor="middle">60</text>
        <text x="260" y="308" text-anchor="middle">120</text>
        <text x="360" y="308" text-anchor="middle">180</text>
        <text x="460" y="308" text-anchor="middle">240</text>
        <text x="560" y="308" text-anchor="middle">300</text>
        <text x="660" y="308" text-anchor="middle">360</text>
        <text x="760" y="308" text-anchor="middle">420</text>
      </g>
      <line x1="726.7" y1="30" x2="726.7" y2="290" class="ts"/>
      <text x="726.7" y="24" text-anchor="middle" class="tk">ts=400</text>
      <text x="20" y="56" class="lbl-s">窗口</text>
      <rect x="226.7" y="42" width="500" height="22" rx="3" class="b-node"/>
      <text x="476.7" y="58" text-anchor="middle" class="lbl-s">(100, 400]，300 秒</text>
      <text x="20" y="100" class="lbl-s">sample</text>
      <circle cx="260" cy="96" r="6" class="dot-vis"/>
      <circle cx="460" cy="96" r="6" class="dot-vis"/>
      <circle cx="660" cy="96" r="6" class="dot-inv"/>
      <text x="670" y="100" class="lbl-s">未 commit</text>
      <text x="20" y="146" class="lbl-s">rate</text>
      <rect x="226.7" y="132" width="333.3" height="22" rx="3" class="win-ok"/>
      <rect x="560" y="132" width="166.7" height="22" rx="3" class="win-bad"/>
      <text x="393" y="148" text-anchor="middle" class="lbl-s">外推覆蓋 20 + 120 + 60 = 200 秒</text>
      <text x="643" y="148" text-anchor="middle" class="t-bad">100 秒未覆蓋</text>
      <text x="226.7" y="176" class="t-bad">rate = 增量 × 200/120 ÷ 300 = 真實值的 67%</text>
      <text x="20" y="216" class="lbl-s">irate</text>
      <rect x="260" y="202" width="200" height="22" rx="3" class="win-ok"/>
      <text x="360" y="218" text-anchor="middle" class="lbl-s">120 → 240</text>
      <text x="226.7" y="246" class="t-ok">irate = 增量 ÷ 120 秒 = 真實值的 100%（但只代表這 120 秒）</text>
      <text x="226.7" y="272" class="lbl-s">ts=430 時窗口只剩 240 一點：rate 和 irate 都回傳空。</text>
    </svg>
