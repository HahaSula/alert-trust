<svg viewBox="0 0 940 460" role="img" aria-label="Prometheus 單一行程內，資料從 target 經 scrape、WAL、Head 到 rule、查詢引擎、alert 狀態與 notifier，再到 Alertmanager；標出八個會出問題的元件，外部 meta Prometheus 獨立於這個行程之外"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="currentColor"/></marker></defs><rect x="165" y="14" width="765" height="340" rx="6" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 3"/><text class="tl" x="175" y="345">同一個 Prometheus 行程、同一組 CPU、記憶體與磁碟</text><rect class="box" x="20" y="35" width="115" height="60" rx="4"/><text class="t1" x="77.5" y="62.0" text-anchor="middle">Target</text><text class="t2" x="77.5" y="79.0" text-anchor="middle">/metrics</text><rect class="box-hot" x="190" y="35" width="230" height="60" rx="4"/><text class="t1" x="305.0" y="62.0" text-anchor="middle">Scrape loop</text><text class="t2" x="305.0" y="79.0" text-anchor="middle">每個 target 一條 goroutine</text><circle class="mk" cx="192" cy="37" r="10"/><text class="mkt" x="192" y="41" text-anchor="middle">1</text><rect class="box" x="480" y="35" width="180" height="60" rx="4"/><text class="t1" x="570.0" y="62.0" text-anchor="middle">WAL</text><text class="t2" x="570.0" y="79.0" text-anchor="middle">所有 commit 依序寫入</text><circle class="mk" cx="482" cy="37" r="10"/><text class="mkt" x="482" y="41" text-anchor="middle">2</text><rect class="box" x="725" y="35" width="190" height="60" rx="4"/><text class="t1" x="820.0" y="62.0" text-anchor="middle">Head（記憶體）</text><text class="t2" x="820.0" y="79.0" text-anchor="middle">最新資料與 series</text><circle class="mk" cx="727" cy="37" r="10"/><text class="mkt" x="727" y="41" text-anchor="middle">8</text><path class="ln" d="M135 65H189" marker-end="url(#a)"/><text class="tl" x="162" y="57" text-anchor="middle">HTTP</text><path class="ln" d="M420 65H479" marker-end="url(#a)"/><text class="tl" x="450" y="57" text-anchor="middle">commit</text><path class=