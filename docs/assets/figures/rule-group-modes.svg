<svg viewBox="0 0 900 362" role="img" aria-label="Three execution modes: one group runs eight rules one after another; with concurrent rule evaluation five rules run at once and then three; three groups each run in their own goroutine at different phases and overlap">
      <text x="20" y="20" class="lbl-b">A · 單一 group，預設</text>
      <text x="20" y="47" class="lbl-s">group goroutine</text>
      <g class="tk" text-anchor="middle">
        <rect x="150" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="189" y="47">r1</text>
        <rect x="230" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="269" y="47">r2</text>
        <rect x="310" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="349" y="47">r3</text>
        <rect x="390" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="429" y="47">r4</text>
