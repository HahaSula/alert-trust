        <rect x="150" y="252" width="58" height="20" rx="3" class="b-node-acc"/><rect x="210" y="252" width="58" height="20" rx="3" class="b-node-acc"/><rect x="270" y="252" width="58" height="20" rx="3" class="b-node-acc"/><rect x="330" y="252" width="58" height="20" rx="3" class="b-node-acc"/>
