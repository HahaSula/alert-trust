        <rect x="630" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="669" y="47">r7</text>
        <rect x="710" y="32" width="78" height="22" rx="3" class="b-node-acc"/><text x="749" y="47">r8</text>
      </g>
      <text x="798" y="47" class="lbl-s">804 ms，峰值 1</text>
      <text x="20" y="84" class="lbl-b">B · 單一 group，開 concurrent-rule-eval，K = 4</text>
      <text x="20" y="109" class="lbl-s">group goroutine</text>
      <text x="20" y="157" class="lbl-s">另開 goroutine</text>
      <g class="tk" text-anchor="middle">
        <rect x="150" y="94" width="78" height="20" rx="3" class="b-node-acc"/><text x="189" y="108">r5</text>
        <rect x="150" y="118" width="78" height="20" rx="3" class="b-node-ok"/><text x="189" y="132">r1</text>
        <rect x="150" y="142" width="78" height="20" rx="3" class="b-node-ok"/><text x="189" y="156">r2</text>
        <rect x="150" y="166" width="78" height="20" rx="3" class="b-node-ok"/><text x="189" y="180">r3</text>
        <rect x="150" y="190" width="78" height="20" rx="3" class="b-node-ok"/><text x="189" y="204">r4</text>
        <rect x="230" y="118" width="78" height="20" rx="3" class="b-node-ok"/><text x="269" y="132">r6</text>
        <rect x="230" y="142" width="78" height="20" rx="3" class="b-node-ok"/><text x="269" y="156">r7</text>
        <rect x="230" y="166" width="78" height="20" rx="3" class="b-node-ok"/><text x="269" y="180">r8</text>
      </g>
      <text x="330" y="132" class="lbl-s">201 ms，峰值 5（K + 1）</text>
      <text x="330" y="156" class="lbl-s">r1–r4 搶到 slot，r5 搶不到也不等，直接在 group goroutine 裡跑。</text>
      <text x="330" y="180" class="lbl-s">所以 K 不是硬上限。</text>
      <text x="20" y="238" class="lbl-b">C · 三個 group，預設：各跑各的，起跑點由 hash(file, name) % E 決定</text>
      <text x="20" y="267" class="lbl-s">g0 的 goroutine</text>
      <text x="20" y="295" class="lbl-s">g1 的 goroutine</text>
      <text x="20" y="323" class="lbl-s">g2 的 goroutine</text>
