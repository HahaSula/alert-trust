<svg viewBox="0 0 900 330" role="img" aria-label="Notifier queue structure in v2.55 and v3.15">
      <defs>
        <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
        <marker id="ah2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-bad"/></marker>
      </defs>
      <text x="20" y="24" class="lbl-b">v2.55.1：單一 queue，每批同時送給所有 AM，等最慢的回來</text>
      <rect x="20" y="44" width="120" height="56" rx="6" class="b-node"/>
      <text x="80" y="68" text-anchor="middle" class="lbl-b">sendAlerts</text>
      <text x="80" y="86" text-anchor="middle" class="lbl-s">每個 rule</text>
      <path d="M140 72 H176" class="arrow" marker-end="url(#ah2)"/>
      <rect x="180" y="44" width="200" height="56" rx="6" class="b-node-acc"/>
      <text x="280" y="68" text-anchor="middle" class="lbl-b">queue（cap 10000）</text>
      <text x="280" y="86" text-anchor="middle" class="lbl-s">滿了丟最舊的</text>
      <path d="M380 72 H416" class="arrow" marker-end="url(#ah2)"/>
      <rect x="420" y="44" width="150" height="56" rx="6" class="b-node"/>
      <text x="495" y="68" text-anchor="middle" class="lbl-b">batch 64</text>
      <text x="495" y="86" text-anchor="middle" class="lbl-s">wg.Wait() 全部</text>
      <path d="M570 60 C620 60 620 50 676 50" class="arrow" marker-end="url(#ah2)"/>
      <path d="M570 84 C620 84 620 100 676 100" class="arrow-bad" marker-end="url(#ah2b)"/>
      <rect x="680" y="34" width="110" height="32" rx="6" class="b-node-ok"/>
      <text x="735" y="55" text-anchor="middle" class="lbl">AM-0 · 50ms</text>
      <rect x="680" y="84" width="110" height="32" rx="6" class="b-node-bad"/>
      <text x="735" y="105" text-anchor="middle" class="lbl">AM-1 · 10s 逾時</text>
      <text x="20" y="140" class="lbl-s">一台 AM 逾時，整條 queue 每批都要等 10 秒 → queue 堆積。只要有一台成功就不算 dropped。errors_total 以「請求數」計。</text>
      <line x1="20" y1="162" x2="880" y2="162" class="ax"/>
      <text x="20" y="190" class="lbl-b">v3.15.1：每台 AM 一條獨立 queue 與 send loop</text>
      <rect x="20" y="214" width="120" height="56" rx="6" class="b-node"/>
      <text x="80" y="238" text-anchor="middle" class="lbl-b">sendAlerts</text>
      <text x="80" y="256" text-anchor="middle" class="lbl-s">每個 rule</text>
      <path d="M140 230 C200 230 200 220 256 220" class="arrow" marker-end="url(#ah2)"/>
      <path d="M140 254 C200 254 200 272 256 272" class="arrow" marker-end="url(#ah2)"/>
      <rect x="260" y="202" width="260" height="36" rx="6" class="b-node-acc"/>
      <text x="390" y="225" text-anchor="middle" class="lbl">queue[AM-0] · cap 10000 · batch 256</text>
      <rect x="260" y="254" width="260" height="36" rx="6" class="b-node-acc"/>
      <text x="390" y="277" text-anchor="middle" class="lbl">queue[AM-1] · cap 10000 · batch 256</text>
      <path d="M520 220 H676" class="arrow" marker-end="url(#ah2)"/>
      <path d="M520 272 H676" class="arrow-bad" marker-end="url(#ah2b)"/>
      <rect x="680" y="204" width="110" height="32" rx="6" class="b-node-ok"/>
      <text x="735" y="225" text-anchor="middle" class="lbl">AM-0 · 正常</text>
      <rect x="680" y="256" width="110" height="32" rx="6" class="b-node-bad"/>
      <text x="735" y="277" text-anchor="middle" class="lbl">AM-1 · 逾時</text>
      <text x="20" y="318" class="lbl-s">慢的 AM 只會拖住自己那條 queue。queue_length、dropped_total 都帶 alertmanager label，dropped 依各 AM 分別計算。</text>
    </svg>
