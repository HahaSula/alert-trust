site_name: alert-trust
site_description: Monitor of monitor 元件目錄與 rule 信任契約
site_url: https://hahasula.github.io/alert-trust/
repo_url: https://github.com/HahaSula/alert-trust
repo_name: HahaSula/alert-trust
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: zh-TW
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: 切換成深色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: 切換成淺色 }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap
  - assets/extra.css
extra_javascript:
  - assets/calculator.js

hooks:
  - hooks/refs.py

markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首頁: index.md
  - 開始使用:
      - 從哪裡開始: tools/start.md
      - 共同模型與檢查流程: model.md
      - 檢查 rule 檔: tools/rule-review.md
      - scrape 與 evaluation 的基準值: tools/baseline.md
      - 契約計算器: tools/calculator.md
      - 參與與擴充: contributing.md
  - 監控鏈:
      - 總覽: components/index.md
      - Prometheus: components/prometheus.md
      - Thanos: components/thanos.md
      - vmagent: components/vmagent.md
      - VictoriaMetrics: components/victoriametrics.md
      - VictoriaLogs: components/victorialogs.md
      - vmalert: components/vmalert.md
      - Grafana Alerting: components/grafana_alerting.md
      - Alertmanager: components/alertmanager.md
      - 外部觀察者: components/observer.md
      - 主機與容器: components/host.md
  - 資料庫:
      - 總覽: targets/index.md
      - 監控模型: targets/models.md
      - MySQL／MariaDB:
          - 怎麼監控: targets/mysql.md
          - 監控訊號: components/mysqld_exporter.md
          - 查詢與 session 分析: targets/mariadb-ash.md
          - 原始碼到 metric: targets/mysql-appendix.md
      - PostgreSQL:
          - 怎麼監控: targets/postgres.md
          - 監控訊號: components/postgres_exporter.md
          - 原始碼到 metric: targets/postgres-appendix.md
      - Valkey／Redis:
          - 怎麼監控: targets/valkey.md
          - 監控訊號: components/redis_exporter.md
          - 原始碼到 metric: targets/valkey-appendix.md
      - etcd:
          - 怎麼監控: targets/etcd.md
          - 監控訊號: components/etcd.md
          - 原始碼到 metric: targets/etcd-appendix.md
      - TiDB:
          - 怎麼監控: targets/tidb.md
          - 監控訊號: components/tidb.md
          - 原始碼到 metric: targets/tidb-appendix.md
      - YugabyteDB:
          - 怎麼監控: targets/yugabytedb.md
          - 監控訊號: components/yugabytedb.md
          - 原始碼到 metric: targets/yugabytedb-appendix.md
      - ClickHouse:
          - 怎麼監控: targets/clickhouse.md
          - 監控訊號: components/clickhouse.md
          - 原始碼到 metric: targets/clickhouse-appendix.md
      - MongoDB:
          - 怎麼監控: targets/mongodb.md
          - 監控訊號: components/mongodb_exporter.md
          - 原始碼到 metric: targets/mongodb-appendix.md
  - 原理:
      - 信任契約: contracts.md
      - 名詞：設定與 metric: reference/terms.md
      - 內部架構:
          - 總覽：單序點對照: architecture/index.md
          - Prometheus: architecture/prometheus.md
          - Thanos: architecture/thanos.md
          - vmagent: architecture/vmagent.md
          - VictoriaMetrics: architecture/victoriametrics.md
          - VictoriaLogs: architecture/victorialogs.md
          - vmalert: architecture/vmalert.md
          - Grafana Alerting: architecture/grafana-alerting.md
          - Alertmanager: architecture/alertmanager.md
          - 資料庫 exporter: architecture/exporters.md
      - 資料庫架構:
          - 關聯式: architecture/db-relational.md
          - 記憶體 KV: architecture/db-kv.md
          - 共識（Raft）: architecture/db-raft.md
          - 分散式 SQL: architecture/db-distsql.md
          - 分析型: architecture/db-olap.md
          - 文件型: architecture/db-doc.md
          - 資源：池、執行緒與主機: architecture/db-resources.md
      - 來源: reference/sources.md
  - 實驗報告:
      - 總覽: reports/index.md
      - Prometheus Rule 信任邊際: reports/prometheus-trust.md
      - Alert Pending 抖動分析: reports/pending-jitter.md
      - VictoriaMetrics Rule 信任邊際: reports/victoriametrics-trust.md
      - Alertmanager 監控指南: reports/alertmanager.md
