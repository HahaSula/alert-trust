site_name: alert-trust
site_description: Monitor of monitor 元件目錄與 rule 信任契約
site_url: https://hahasula.github.io/alert-trust/
repo_url: https://github.com/HahaSula/alert-trust
repo_name: HahaSula/alert-trust
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: zh-TW
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: 切換成深色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: 切換成淺色 }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap
  - assets/extra.css
extra_javascript:
  - assets/calculator.js

hooks:
  - hooks/refs.py

markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首頁: index.md
  - 開始使用:
      - 共同模型與檢查流程: model.md
      - 檢查 rule 檔的流程: tools/rule-review.md
      - 參與與擴充: contributing.md
  - 監控元件:
      - 元件卡總覽: components/index.md
      - 架構總覽：單序點對照: architecture/index.md
      - Prometheus:
          - 元件卡: components/prometheus.md
          - 內部架構: architecture/prometheus.md
      - VictoriaMetrics 體系:
          - vmagent 元件卡: components/vmagent.md
          - vmagent 內部架構: architecture/vmagent.md
          - VictoriaMetrics 元件卡: components/victoriametrics.md
          - VictoriaMetrics 內部架構: architecture/victoriametrics.md
          - VictoriaLogs 元件卡: components/victorialogs.md
          - VictoriaLogs 內部架構: architecture/victorialogs.md
          - vmalert 元件卡: components/vmalert.md
          - vmalert 內部架構: architecture/vmalert.md
      - Alertmanager:
          - 元件卡: components/alertmanager.md
          - 內部架構: architecture/alertmanager.md
      - 外部觀察者: components/observer.md
  - 資料庫 Target:
      - Exporter 共通架構: architecture/exporters.md
      - MySQL／MariaDB:
          - 怎麼監控: targets/mysql.md
          - 查詢與 session 分析（ASH）: targets/mariadb-ash.md
          - 元件卡: components/mysqld_exporter.md
          - 附錄：原始碼到 metric: targets/mysql-appendix.md
      - PostgreSQL:
          - 怎麼監控: targets/postgres.md
          - 元件卡: components/postgres_exporter.md
          - 附錄：原始碼到 metric: targets/postgres-appendix.md
  - 寫 rule:
      - 信任契約: contracts.md
      - 契約計算器: tools/calculator.md
      - 名詞：設定與 metric: reference/terms.md
  - 實驗報告:
      - 總覽: reports/index.md
      - Prometheus Rule 信任邊際: reports/prometheus-trust.md
      - Alert Pending 抖動分析: reports/pending-jitter.md
      - VictoriaMetrics Rule 信任邊際: reports/victoriametrics-trust.md
      - Alertmanager 監控指南: reports/alertmanager.md
  - 來源: reference/sources.md
