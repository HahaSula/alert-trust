site_name: alert-trust
site_description: Monitor of monitor 元件目錄與 rule 信任契約
site_url: https://hahasula.github.io/alert-trust/
repo_url: https://github.com/HahaSula/alert-trust
repo_name: HahaSula/alert-trust
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: zh-TW
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: 切換成深色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: 切換成淺色 }
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight

extra_css:
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap
  - assets/extra.css
extra_javascript:
  - assets/calculator.js

hooks:
  - hooks/refs.py

markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首頁: index.md
  - 共同模型與檢查流程: model.md
  - 元件卡:
      - 總覽: components/index.md
      - Prometheus 體系:
          - Prometheus: components/prometheus.md
      - VictoriaMetrics 體系:
          - vmagent: components/vmagent.md
          - VictoriaMetrics: components/victoriametrics.md
          - VictoriaLogs: components/victorialogs.md
          - vmalert: components/vmalert.md
      - 共用：通知與外部觀察:
          - Alertmanager: components/alertmanager.md
          - 外部觀察者: components/observer.md
      - Target：資料庫:
          - MySQL／MariaDB: components/mysqld_exporter.md
          - PostgreSQL: components/postgres_exporter.md
  - Target 怎麼監控:
      - MySQL／MariaDB: targets/mysql.md
  - 內部架構:
      - 總覽：單序點對照: architecture/index.md
      - Prometheus: architecture/prometheus.md
      - vmagent: architecture/vmagent.md
      - VictoriaMetrics: architecture/victoriametrics.md
      - VictoriaLogs: architecture/victorialogs.md
      - vmalert: architecture/vmalert.md
      - Alertmanager: architecture/alertmanager.md
      - 資料庫 exporter: architecture/exporters.md
  - 寫 rule:
      - 信任契約: contracts.md
      - 契約計算器: tools/calculator.md
      - 名詞：設定與 metric: reference/terms.md
  - 實驗報告:
      - 總覽: reports/index.md
      - Prometheus Rule 信任邊際: reports/prometheus-trust.md
      - Alert Pending 抖動分析: reports/pending-jitter.md
      - VictoriaMetrics Rule 信任邊際: reports/victoriametrics-trust.md
      - Alertmanager 監控指南: reports/alertmanager.md
  - 來源: reference/sources.md
