# 虛構的 config：job 名稱是 mysqld；db-a 有靜態 cluster label。
global: { scrape_interval: 30s, scrape_timeout: 10s }
scrape_configs:
  - job_name: mysqld
    static_configs:
      - targets: [db-a:9104, db-b:9104]
        labels: { cluster: c1 }
  - job_name: files
    file_sd_configs: [{ files: [targets/*.json] }]
