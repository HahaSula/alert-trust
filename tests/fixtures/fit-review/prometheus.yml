global: { scrape_interval: 30s, scrape_timeout: 10s, evaluation_interval: 30s }
scrape_configs:
  - job_name: mysqld
    static_configs: [{ targets: [db:9104] }]
  - job_name: redis
    static_configs: [{ targets: [cache:9121] }]
  - job_name: kube-etcd
    static_configs: [{ targets: [etcd-1:2379] }]
  - job_name: etcd-probe
    scrape_interval: 1m
    scrape_timeout: 20s
    metrics_path: /probe
    static_configs: [{ targets: [etcd-1:2379] }]
