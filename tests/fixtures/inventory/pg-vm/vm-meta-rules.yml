groups:
- name: vm-meta
  interval: 15s
  rules:
  - alert: MetaTargetDown
    expr: up == 0
    for: 30s
    labels:
      severity: critical
      tier: '1'
    annotations:
      summary: 元件停止回應；官方 ServiceDown 依 job 名稱比對，名稱不符時不會響
      runbook_url: https://hahasula.github.io/alert-trust/components/victoriametrics/#components-up
  - alert: MetaRuleErrors
    expr: sum by (job, group) (rate(vmalert_alerting_rules_errors_total[2m])) > 0
    for: 30s
    labels:
      severity: critical
      component: vmalert
      tier: '1'
    annotations:
      summary: Rule 查詢失敗；查詢失敗期間 alert 會在約 2 分鐘後被標成 resolved
      runbook_url: https://hahasula.github.io/alert-trust/components/vmalert/#rule-errors
  - alert: MetaPartialResponses
    expr: sum(rate(vm_partial_results_total[2m])) > 0
    for: 30s
    labels:
      severity: critical
      component: victoriametrics
      tier: '1'
    annotations:
      summary: VM cluster 回傳不完整結果，聚合 alert 可能假觸發或假恢復
      runbook_url: https://hahasula.github.io/alert-trust/components/victoriametrics/#partial-results
  - alert: MetaStorageUnreachable
    expr: min(vm_rpc_vmstorage_is_reachable) == 0
    for: 30s
    labels:
      severity: critical
      component: victoriametrics
      tier: '1'
    annotations:
      summary: 有 vmstorage 連不到
      runbook_url: https://hahasula.github.io/alert-trust/components/victoriametrics/#storage-reachable
  - alert: MetaVLStorageUnreachable
    expr: 'sum by (job, instance, addr) (increase(vl_select_remote_send_errors_total[2m])) > 0

      or min by (job, instance, addr) (vl_insert_remote_is_reachable) == 0

      '
    for: 30s
    labels:
      severity: critical
      component: victorialogs
      tier: '1'
    annotations:
      summary: vlselect 查 vlstorage 失敗，或 vlinsert 寫不進去；VL cluster 預設回 502，log rule 會全部 ERR。vl_insert_remote_is_reachable 只在有資料要寫到那台時才會變 0（lab 實測），不能單獨使用
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#storage-reachable
  - alert: MetaStorageReadOnly
    expr: max(vm_storage_is_read_only) == 1
    for: 15s
    labels:
      severity: critical
      component: victoriametrics
      tier: '1'
    annotations:
      summary: vmstorage 唯讀；rule 不會報錯，官方規則也沒有對應告警
      runbook_url: https://hahasula.github.io/alert-trust/components/victoriametrics/#read-only
  - alert: MetaVLReadOnly
    expr: max(vl_storage_is_read_only) == 1
    for: 15s
    labels:
      severity: critical
      component: victorialogs
      tier: '1'
    annotations:
      summary: vlstorage 唯讀；ingestion 仍回 200，新 log 查不到
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#read-only
  - alert: MetaNotifierErrors
    expr: sum(rate(vmalert_alerts_send_errors_total[2m])) > 0
    for: 30s
    labels:
      severity: critical
      component: vmalert
      tier: '1'
    annotations:
      summary: vmalert 送往 Alertmanager 失敗
      runbook_url: https://hahasula.github.io/alert-trust/components/vmalert/#notifier-errors
  - alert: MetaNoRuleWrites
    expr: sum(rate(vmalert_remotewrite_errors_total[2m])) > 0
    for: 30s
    labels:
      severity: critical
      component: vmalert
      tier: '1'
    annotations:
      summary: vmalert 狀態或 recording 結果寫不回去；重啟後 for 會從頭算
      runbook_url: https://hahasula.github.io/alert-trust/components/vmalert/#state-write
  - alert: MetaGroupSlow
    expr: max(vmalert_iteration_duration_seconds{quantile="0.9"}) > 24
    for: 30s
    labels:
      severity: warning
      component: vmalert
      tier: '2'
    annotations:
      summary: Group 耗時超過 interval 的 80%（這裡 interval 是 30s）
      runbook_url: https://hahasula.github.io/alert-trust/components/vmalert/#group-ratio
  - alert: MetaVLAgentBacklog
    expr: sum(vlagent_remotewrite_pending_data_bytes) > 1000
    for: 30s
    labels:
      severity: warning
      component: victorialogs
      tier: '2'
    annotations:
      summary: vlagent 有資料堆積，下游可能寫不進去
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#vlagent-backlog
  - alert: MetaVLRowsNotIngested
    expr: 'sum by (job, instance) (rate(vl_http_requests_total{path=~"/insert/.*"}[5m])) > 0

      unless sum by (job, instance) (rate(vl_rows_ingested_total[5m])) > 0

      '
    for: 10m
    labels:
      severity: critical
      component: victorialogs
      tier: '1'
    annotations:
      summary: 有寫入請求、HTTP 也回 200，但沒有任何一行被收進去（例如 Content-Type 是 x-www-form-urlencoded，lab 實測）
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#ingested
  - alert: MetaVLDiskRunsOutOfSpace
    expr: "sum by (job, instance) (vl_data_size_bytes)\n  / (sum by (job, instance) (vl_free_disk_space_bytes) + sum by (job, instance) (vl_data_size_bytes)) > 0.8\n"
    for: 30m
    labels:
      severity: warning
      component: victorialogs
      tier: '2'
    annotations:
      summary: VL 資料已用掉 80% 的可用空間（官方 DiskRunsOutOfSpace）；剩餘低於 -storage.minFreeDiskSpaceBytes 時切成唯讀
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#disk-space
  - alert: MetaVLQueryTimeouts
    expr: increase(vl_concurrent_select_limit_timeout_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
      component: victorialogs
      tier: '2'
    annotations:
      summary: vlselect 查詢排隊逾時（官方 TooHighQueryLoad）；log rule 會走查詢失敗路徑
      runbook_url: https://hahasula.github.io/alert-trust/components/victorialogs/#query-load
