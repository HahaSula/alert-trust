global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["db-01:9100", "db-02:9100"] }]
  - job_name: mysqld
    static_configs: [{ targets: ["db-01:9104", "db-02:9104"] }]
    metric_relabel_configs:
      - { source_labels: [__name__], regex: "mysql_info_schema_.*", action: drop }
