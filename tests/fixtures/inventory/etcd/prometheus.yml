global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
scrape_configs:
  - job_name: kube-etcd
    scheme: https
    tls_config: { ca_file: /etc/etcd/ca.crt, cert_file: /etc/etcd/client.crt, key_file: /etc/etcd/client.key }
    static_configs: [{ targets: ["10.0.0.11:2379", "10.0.0.12:2379", "10.0.0.13:2379"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
