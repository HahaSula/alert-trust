# 虛構的環境：relabel、honor_labels、external_labels、沒有抓 Alertmanager
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: { region: east }
rule_files: ["rules/*.yml"]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["am-1:9093", "am-2:9093"] }] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: shop
    static_configs: [{ targets: ["shop-1:8080"], labels: { team: shop, env: prod } }]
    relabel_configs:
      - { source_labels: [__address__], regex: "([^:]+):.*", target_label: host, replacement: "$1" }
  - job_name: federate
    honor_labels: true
    metrics_path: /federate
    params: { "match[]": ['{job="edge"}'] }
    static_configs: [{ targets: ["edge-prom:9090"] }]
  - job_name: mysqld
    scrape_interval: 1m
    scrape_timeout: 2m
    static_configs: [{ targets: ["db-1:9104"] }]
    metric_relabel_configs:
      - { source_labels: [__name__], regex: "mysql_info_schema_.*", action: drop }
