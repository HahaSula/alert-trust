# 例子：每台主機各一個 mysqld_exporter（per-host），沒有抓 vmalert
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files: [rules.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: mysqld
    static_configs: [{ targets: ["db-1:9104", "db-2:9104"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
