# 驗證用的環境描述（虛構）。
name: coverage-lab
components:
  - { id: prom-a, type: prometheus, version: "3.13.5", url: "http://localhost:19301", failure_domain: node-a, job: prom-a-self }
  - { id: alertmanager, type: alertmanager, version: "0.27.0", url: "http://localhost:19303", replicas: 1, failure_domain: node-a }
observers:
  - { id: meta, type: prometheus, url: "http://localhost:19302", failure_domain: node-b, notify_via: external-webhook, scrapes: [prom-a, alertmanager], deadman: external-webhook }
deadman: { receiver: external-webhook, max_silence: 10m }
