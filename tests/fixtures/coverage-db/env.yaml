# 驗證用的環境描述（虛構）：只有 DB 規則的 Prometheus。
name: coverage-db
components:
  - { id: prom, type: prometheus, version: "3.13.5" }
  - { id: am, type: alertmanager, version: "0.28.1", replicas: 1 }
observers: []
targets:
  - { id: db-ok, type: mysqld_exporter, scraped_by: prom, job: mysqld, features: [replication-primary] }
  - { id: db-replica, type: mysqld_exporter, scraped_by: prom, job: mysqld, features: [replication-replica] }
  - { id: db-generic, type: mysqld_exporter, scraped_by: prom, job: mysqld, features: [replication] }
  - { id: db-wrong, type: mysqld_exporter, scraped_by: prom, job: mysql-prod }
