# postgres_exporter＋PostgreSQL 的建議規則。
# job="postgres" 是佔位用的 selector，請換成實際抓 exporter 的 job；multi-target（/probe）模式另外假設
# exporter 自己的 /metrics 有一個 job="postgres-exporter"。
# 門檻以 scrape_interval 15s、scrape_timeout 10s 為基準，請依環境調整：8 秒、5 秒、300 秒、1e9 等。
# 在抓 PostgreSQL 的 Prometheus 上評估即可；postgres-liveness 這組最好在外部觀察者上也評估一份，
# 因為抓 exporter 的 Prometheus 自己壞掉時，這些規則一起停。
# 有些規則依賴預設關閉的 collector（stat_wal_receiver、database_wraparound、postmaster），
# 規則故意在「該有的 metric 不存在」時也響，提醒你把 collector 打開。
# runbook_url 指向 alert-trust 網站上對應訊號的段落。
groups:
  - name: postgres-liveness
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "抓不到 postgres_exporter 或 scrape 超時；這時 pg_up 不存在，只看 pg_up 的規則不會響。DB 主機不回應也會落在這裡"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#exporter-up
      - alert: PostgresExporterMissing
        expr: absent(up{job="postgres"})
        for: 5m
        labels: { severity: critical, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "完全沒有 postgres 的 target，服務發現或 job 名稱可能錯了"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#exporter-up
      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "exporter 連不上 PostgreSQL（連線被拒、認證失敗、連線額滿）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#db-up
          absence_covered_by: "PostgresExporterDown, PostgresExporterMissing"
      - alert: PostgresCollectorsMissing
        expr: |
          up{job="postgres"} == 1
            unless on (job, instance) pg_scrape_collector_success{job="postgres"}
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "exporter 有回應卻沒有任何 collector 結果；新連線建不起來，pg_up 可能還是 1"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#collectors-present
      - alert: PostgresCollectorFailed
        expr: pg_scrape_collector_success{job="postgres"} == 0
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "collector {{ $labels.collector }} 查詢失敗，它負責的 metric 已經消失"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#collector-success
          absence_covered_by: "PostgresCollectorsMissing"
      - alert: PostgresExporterScrapeError
        expr: pg_exporter_last_scrape_error{job="postgres"} == 1
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "舊架構的查詢（含 queries.yaml 自訂查詢）有失敗；失敗的那組 metric 已經消失"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#legacy-scrape-error
      - alert: PostgresUserQueriesLoadError
        expr: pg_exporter_user_queries_load_error{job="postgres"} == 1
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "queries.yaml 讀不到或解析失敗，所有自訂 metric 都不存在"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#legacy-scrape-error
      - alert: PostgresExporterLacksPgMonitor
        expr: pg_scrape_collector_success{job="postgres", collector="wal"} == 0
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "wal collector 失敗，exporter 帳號很可能沒有 pg_monitor；這時 stat_activity 看不到別人的 session，卻回報成功"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#monitor-privilege
          absence_covered_by: "PostgresCollectorsMissing"

  - name: postgres-exporter-budget
    rules:
      - alert: PostgresScrapeNearTimeout
        expr: scrape_duration_seconds{job="postgres"} > 8
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "scrape 接近 scrape_timeout（10s 的 80%）；超過就整批資料丟掉、up 變 0"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#scrape-budget
      - alert: PostgresSlowCollector
        expr: pg_scrape_collector_duration_seconds{job="postgres"} > 5
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "collector {{ $labels.collector }} 單次超過 5 秒，大型資料庫的 catalog 查詢會吃掉 scrape 預算"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#scrape-budget
      - alert: PostgresSamplesDropped
        expr: |
          scrape_samples_scraped{job="postgres"}
            < 0.5 * (scrape_samples_scraped{job="postgres"} offset 1h)
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "每次 scrape 的樣本數比一小時前少一半以上，有一批 metric 安靜地消失了"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#series-volume
      - alert: PostgresProbeExporterDown
        expr: up{job="postgres-exporter"} == 0 or absent(up{job="postgres-exporter"})
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "multi-target exporter 本身抓不到，它代理的所有資料庫一起失去監控"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#probe-blast-radius

  - name: postgres-semantics
    rules:
      - alert: PostgresCheckpointMetricsMissing
        expr: |
          pg_up{job="postgres"} == 1
            unless on (job, instance)
          (pg_stat_bgwriter_checkpoints_timed_total{job="postgres"} or pg_stat_checkpointer_num_timed_total{job="postgres"})
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "沒有任何 checkpoint metric；PostgreSQL 17 以上要打開 --collector.stat_checkpointer，否則 checkpoint 規則永遠回傳空"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#version-semantics
      - alert: PostgresStandbyWalReceiverMissing
        expr: |
          pg_replication_is_replica{job="postgres"} == 1
            unless on (job, instance) pg_stat_wal_receiver_last_msg_receipt_time{job="postgres"}
        for: 5m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "複本沒有 WAL receiver（斷線或 collector 沒開）；這時 pg_replication_lag_seconds 是 0。v0.20.1 對沒有用 replication slot 的複本不輸出這組 metric，這類複本要用 label 排除"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wal-receiver
      - alert: PostgresWalReceiverStale
        expr: time() - pg_stat_wal_receiver_last_msg_receipt_time{job="postgres"} > 120
        for: 2m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "複本超過 2 分鐘沒有收到主庫的任何訊息"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wal-receiver
      - alert: PostgresPrimaryWithoutStandby
        expr: |
          pg_replication_is_replica{job="postgres"} == 0
            unless on (job, instance) pg_stat_replication_pg_wal_lsn_diff{job="postgres"}
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "主庫上看不到任何複本連線；只對應該有複本的主庫啟用（用 label 限定）。exporter 沒有 pg_monitor 時也會響（看不到 LSN）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#standby-streaming
      - alert: PostgresReplicationLagBytes
        expr: pg_stat_replication_pg_wal_lsn_diff{job="postgres"} > 1e9
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "複本 {{ $labels.application_name }} 的 replay 落後主庫超過 1GB WAL"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#replication-lag
      - alert: PostgresReplicationSlotInactive
        expr: pg_replication_slots_active{job="postgres"} == 0
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "replication slot {{ $labels.slot_name }} 沒有人用，主庫的 WAL 會一直累積"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#replication-slots
          absence_covered_by: "PostgresCollectorsMissing"
      - alert: PostgresReplicationSlotRetainingWal
        expr: |
          pg_replication_slots_pg_wal_lsn_diff{job="postgres"} > 10e9
            or pg_replication_slots_safe_wal_size_bytes{job="postgres"} < 1e9
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "replication slot {{ $labels.slot_name }} 保留超過 10GB WAL，或離 max_slot_wal_keep_size 不到 1GB"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#replication-slots
      - alert: PostgresReplicationSlotLost
        expr: pg_replication_slots_wal_status{job="postgres", wal_status=~"unreserved|lost"} == 1
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "replication slot {{ $labels.slot_name }} 的 WAL 狀態是 {{ $labels.wal_status }}；lost 之後用這個 slot 的複本永遠追不上，要重建"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#replication-slots
      - alert: PostgresXidWraparoundRisk
        expr: pg_database_wraparound_age_datfrozenxid_seconds{job="postgres"} > 1e9
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 的 XID age 超過 10 億（名稱寫 seconds，實際是交易數）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wraparound
      - alert: PostgresWraparoundNotCollected
        expr: |
          pg_up{job="postgres"} == 1
            unless on (job, instance) pg_database_wraparound_age_datfrozenxid_seconds{job="postgres"}
        for: 30m
        labels: { severity: info, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "沒有收集 XID age（--collector.database_wraparound 預設關閉）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wraparound
      - alert: PostgresConnectionsNearLimit
        expr: |
          sum by (job, instance) (pg_stat_activity_count{job="postgres"})
            > 0.8 * (
              min by (job, instance) (pg_settings_max_connections{job="postgres"})
              - min by (job, instance) (pg_settings_superuser_reserved_connections{job="postgres"})
              - (
                  min by (job, instance) (pg_settings_reserved_connections{job="postgres"})
                  or 0 * min by (job, instance) (pg_settings_max_connections{job="postgres"})
                )
            )
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "連線數超過一般使用者可用上限的 80%（已扣 superuser_reserved_connections 與 16 起的 reserved_connections）；額滿時沒有保留位子的 exporter 也連不進去"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#connection-headroom

  - name: postgres-service
    rules:
      - alert: PostgresLongRunningTransaction
        expr: max by (job, instance, datname) (pg_stat_activity_max_tx_duration{job="postgres", datname!~"template.*"}) > 300
        for: 2m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 有交易超過 5 分鐘，會擋住 vacuum；exporter 沒有 pg_monitor 時這條看不到"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#xmin-horizon
      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgres", datname!~"template.*"}[5m]) > 5
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 5 分鐘內 deadlock 超過 5 次"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#deadlocks-rollbacks
      - alert: PostgresHighRollbackRatio
        expr: |
          sum by (job, instance, datname) (rate(pg_stat_database_xact_rollback{job="postgres", datname!~"template.*"}[5m]))
            / sum by (job, instance, datname) (
                rate(pg_stat_database_xact_rollback{job="postgres", datname!~"template.*"}[5m])
                + rate(pg_stat_database_xact_commit{job="postgres", datname!~"template.*"}[5m])
              ) > 0.1
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} rollback 比例超過 10%"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#deadlocks-rollbacks
      - alert: PostgresTooManyDeadTuples
        expr: |
          pg_stat_user_tables_n_dead_tup{job="postgres"} > 10000
            and pg_stat_user_tables_n_dead_tup{job="postgres"}
              > 0.1 * (pg_stat_user_tables_n_live_tup{job="postgres"} + pg_stat_user_tables_n_dead_tup{job="postgres"})
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料表 {{ $labels.relname }} dead tuple 超過 10%，autovacuum 可能跟不上或被長交易擋住"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#autovacuum
      - alert: PostgresRestarted
        expr: changes(pg_postmaster_start_time_seconds{job="postgres"}[15m]) > 0
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "PostgreSQL 15 分鐘內重啟過（需要 --collector.postmaster）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#restart-and-crash
      - alert: PostgresRoleChanged
        expr: changes(pg_replication_is_replica{job="postgres"}[5m]) > 0
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "主從角色改變（failover）；依 is_replica 分流的複製規則要重新對位"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#promotion

  # ---------- PostgreSQL 本體：穩定 ----------
  - name: postgres-target-stability
    rules:
      - alert: PostgresCrashRecovery
        expr: |
          resets(pg_stat_database_xact_commit{job="postgres", datname="postgres"}[10m]) > 0
            unless on (job, instance) changes(pg_postmaster_start_time_seconds{job="postgres"}[10m]) > 0
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "交易 counter 被歸零但 postmaster 沒有重啟：很可能是 backend 當掉後的 crash recovery（crash recovery 會丟棄累積統計）；手動 pg_stat_reset() 也會觸發"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#restart-and-crash
      - alert: PostgresWalRetained
        expr: |
          pg_wal_size_bytes{job="postgres"}
            > on (job, instance) (2 * pg_settings_max_wal_size_bytes{job="postgres"})
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "pg_wal 超過 max_wal_size 的兩倍，有東西擋住 WAL 回收（inactive slot、archive 失敗）；磁碟剩餘空間要看 node_exporter"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wal-disk
      - alert: PostgresIdleInTransaction
        expr: |
          max by (job, instance, datname) (
            pg_stat_activity_max_tx_duration{job="postgres", state=~"idle in transaction.*"}
          ) > 300
        for: 2m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 有 idle in transaction 超過 5 分鐘，它持有的 XID 讓 vacuum 無法清掉 dead tuple；可設 idle_in_transaction_session_timeout"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#xmin-horizon
      - alert: PostgresXidWraparoundCritical
        expr: pg_database_wraparound_age_datfrozenxid_seconds{job="postgres"} > 1.5e9
        for: 5m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 的 XID age 超過 15 億；約 2^31 − 4000 萬時開始警告，− 300 萬時拒絕新的 XID"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wraparound
      - alert: PostgresMultixactWraparoundRisk
        expr: pg_database_wraparound_age_datminmxid_seconds{job="postgres"} > 1e9
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 的 multixact age 超過 10 億（SELECT ... FOR SHARE、外鍵檢查會消耗 multixact）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wraparound
      - alert: PostgresCheckpointsMostlyRequested
        expr: |
          (
            rate(pg_stat_bgwriter_checkpoints_req_total{job="postgres"}[30m])
              / (rate(pg_stat_bgwriter_checkpoints_req_total{job="postgres"}[30m]) + rate(pg_stat_bgwriter_checkpoints_timed_total{job="postgres"}[30m]))
            or
            rate(pg_stat_checkpointer_num_requested_total{job="postgres"}[30m])
              / (rate(pg_stat_checkpointer_num_requested_total{job="postgres"}[30m]) + rate(pg_stat_checkpointer_num_timed_total{job="postgres"}[30m]))
          ) > 0.5
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "半數以上的 checkpoint 是被 WAL 量逼出來的，max_wal_size 可能太小；17 以上需要 --collector.stat_checkpointer"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#checkpoint-pressure
      - alert: PostgresAutovacuumWorkersFull
        expr: |
          avg_over_time(sum by (job, instance) (pg_stat_activity_count{job="postgres", backend_type="autovacuum worker"})[1h:1m])
            >= on (job, instance) 0.9 * max by (job, instance) (pg_settings_autovacuum_max_workers{job="postgres"})
        labels: { severity: warning, component: postgres_exporter, tier: "3", aspect: saturation }
        annotations:
          summary: "{{ $labels.instance }} 的 autovacuum worker 過去 1 小時平均 {{ $value }} 個，接近 autovacuum_max_workers（90%，例子）；其他表在排隊，dead tuple 與 XID age 會接著上升"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#autovacuum-workers-full
      - alert: PostgresBackendFsync
        expr: increase(pg_stat_bgwriter_buffers_backend_fsync_total{job="postgres"}[10m]) > 0
        labels: { severity: warning, component: postgres_exporter, tier: "3", aspect: saturation }
        annotations:
          summary: "{{ $labels.instance }} 10 分鐘內有 {{ $value }} 次 backend 自己做 fsync（checkpointer 的 fsync request 佇列滿）；只有 PostgreSQL 16 以下有這個 metric"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#backend-fsync
      - alert: PostgresCheckpointSyncSlow
        expr: |
          (
            rate(pg_stat_bgwriter_checkpoint_sync_time_total{job="postgres"}[30m])
            or rate(pg_stat_checkpointer_sync_time_total{job="postgres"}[30m])
          ) / 1000 > 0.1
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "3", aspect: saturation }
        annotations:
          summary: "{{ $labels.instance }} 的 checkpoint sync 階段佔掉 {{ $value | humanizePercentage }} 的時間（例子：10%）；fsync 慢，對照主機層的磁碟延遲。17 以上要 --collector.stat_checkpointer"
          absence_covered_by: PostgresCheckpointMetricsMissing
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#backend-fsync

  # ---------- PostgreSQL 本體：使用 ----------
  - name: postgres-target-usage
    rules:
      - alert: PostgresLockWaits
        expr: sum by (job, instance, datname) (pg_stat_activity_count{job="postgres", wait_event_type="Lock"}) > 5
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 有超過 5 個 session 在等鎖；ACCESS EXCLUSIVE 鎖會讓沒設 lock_timeout 的 exporter 整個卡住，這時看到的是 PostgresExporterDown"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#sessions-and-locks

  # ---------- PostgreSQL 本體：HA ----------
  # 需要在 target 上加 cluster label（同一組主從共用一個值）；沒有 cluster label 的 target 不納入角色計數。
  - name: postgres-target-ha
    rules:
      - alert: PostgresStandbyCountDropped
        expr: |
          count by (job, instance) (pg_stat_replication_pg_wal_lsn_diff{job="postgres", state="streaming"})
            < max_over_time(count by (job, instance) (pg_stat_replication_pg_wal_lsn_diff{job="postgres", state="streaming"})[1d:5m])
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "主庫上 streaming 的複本比過去一天的最大值少；全部消失時由 PostgresPrimaryWithoutStandby 接手"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#standby-streaming
      - alert: PostgresMultiplePrimaries
        expr: count by (cluster) (pg_replication_is_replica{job="postgres", cluster!=""} == 0) > 1
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "cluster {{ $labels.cluster }} 有 {{ $value }} 台不在 recovery 的 PostgreSQL（split brain，或舊主庫沒有被隔離）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#promotion
          absence_covered_by: "PostgresCollectorsMissing, PostgresExporterDown"
      - alert: PostgresNoPrimary
        expr: |
          count by (cluster) (pg_replication_is_replica{job="postgres", cluster!=""})
            unless count by (cluster) (pg_replication_is_replica{job="postgres", cluster!=""} == 0)
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "cluster {{ $labels.cluster }} 看得到的 PostgreSQL 全都在 recovery，沒有主庫（主庫停機時也可能是 exporter 抓不到，先看 PostgresExporterDown）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#promotion
      - alert: PostgresArchiveFailing
        expr: |
          increase(pg_stat_archiver_failed_count{job="postgres"}[15m]) > 0
            and on (job, instance) increase(pg_stat_archiver_archived_count{job="postgres"}[15m]) == 0
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "archive_command 15 分鐘內只有失敗沒有成功；WAL 會一直留在 pg_wal，接著是磁碟寫滿"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archiver
      - alert: PostgresStandbyQueryConflicts
        expr: increase(pg_stat_database_conflicts{job="postgres", datname!~"template.*"}[10m]) > 0
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "複本上資料庫 {{ $labels.datname }} 有查詢被 recovery 取消（max_standby_streaming_delay 到期）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#standby-conflicts

  # ---------- PostgreSQL 本體：效能與故障情境（lab/targets/postgres/perf） ----------
  - name: postgres-target-perf
    rules:
      - alert: PostgresThroughputDrop
        expr: |
          sum by (job, instance, datname) (rate(pg_stat_database_xact_commit{job="postgres", datname!~"template.*"}[5m]))
            < 0.5 * sum by (job, instance, datname) (rate(pg_stat_database_xact_commit{job="postgres", datname!~"template.*"}[5m] offset 1d))
          and on (job, instance, datname)
          sum by (job, instance, datname) (rate(pg_stat_database_xact_commit{job="postgres", datname!~"template.*"}[5m] offset 1d)) > 10
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 的 commit 速率不到昨天同一時間的一半。可能是流量本身變少，也可能是鎖、CPU、連線額滿；先看 pg_stat_activity 的 wait_event_type"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#throughput-drop
          absence_covered_by: "PostgresExporterDown, PostgresCollectorsMissing"
      - alert: PostgresLockQueuePileUp
        expr: |
          sum by (job, instance, datname) (pg_stat_activity_count{job="postgres", wait_event_type="Lock"}) >= 5
            and on (job, instance, datname)
          sum by (job, instance, datname) (pg_locks_count{job="postgres", mode="accessexclusivelock"}) > 0
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 有 ACCESS EXCLUSIVE 鎖（ALTER TABLE、VACUUM FULL、TRUNCATE）且至少 5 個 session 在等鎖：DDL 排在長交易後面，之後所有讀寫都排在 DDL 後面。exporter 沒設 lock_timeout 時這條看不到，會變成 PostgresExporterDown"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#lock-queue
          absence_covered_by: "PostgresExporterDown, PostgresCollectorsMissing"
      - alert: PostgresLockWaitLong
        expr: |
          max by (job, instance, datname) (
            pg_stat_activity_max_tx_duration{job="postgres", wait_event_type="Lock"}
          ) > 60
        for: 1m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 有正在等鎖的 session，所在交易已開了超過 60 秒（值是交易年齡，不是等鎖時間）；擋住它的通常是 idle in transaction 或長交易，用 pg_blocking_pids() 找"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#lock-queue
          absence_covered_by: "PostgresExporterDown, PostgresCollectorsMissing"
      - alert: PostgresSlowStatement
        expr: |
          (
            rate(pg_stat_statements_seconds_total{job="postgres"}[10m])
              / rate(pg_stat_statements_calls_total{job="postgres"}[10m])
          ) > 1
          and rate(pg_stat_statements_calls_total{job="postgres"}[10m]) > 0.01
        for: 15m
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "queryid {{ $labels.queryid }}（{{ $labels.datname }}、{{ $labels.user }}）平均執行時間超過 1 秒；只算總耗時前 100 名，查詢文字要用 queryid 到 pg_stat_statements 查"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#slow-sql
      - alert: PostgresStatStatementsMissing
        expr: |
          pg_up{job="postgres"} == 1
            unless on (job, instance) group by (job, instance) (pg_stat_statements_calls_total{job="postgres"})
        for: 30m
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "沒有 pg_stat_statements metric：--collector.stat_statements 沒開、extension 沒建在 DSN 的資料庫，或 shared_preload_libraries 沒載入；這時沒有任何 per-query 延遲可看"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#slow-sql

  # ---------- PostgreSQL 本體：資料保護（protection）。lab/targets/postgres/aspects ----------
  # 備份工具的規則假設 pgbackrest_exporter（woblerr）在 job="pgbackrest"；WAL-G、Barman 請改成自己輸出的「最後成功時間」metric。
  - name: postgres-protection
    rules:
      - alert: PostgresArchiveStale
        expr: |
          pg_stat_archiver_last_archive_age{job="postgres"}
            > on (job, instance) 3 * (pg_settings_archive_timeout_seconds{job="postgres"} > 0)
          and on (job, instance) pg_replication_is_replica{job="postgres"} == 0
          and on (job, instance) sum by (job, instance) (
                increase(pg_stat_database_tup_inserted{job="postgres"}[15m])
              + increase(pg_stat_database_tup_updated{job="postgres"}[15m])
              + increase(pg_stat_database_tup_deleted{job="postgres"}[15m])
          ) > 0
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "主庫最後一次 archive 成功已超過 3 × archive_timeout，而這段時間有寫入：PITR 能回到的時間點停在 {{ $value | humanizeDuration }} 前。只在設了 archive_timeout 的主庫上會響；archive_mode 是 enum，exporter 不輸出，要在盤點時確認"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-freshness
          absence_covered_by: "PostgresCollectorsMissing, PostgresCollectorFailed, PostgresArchiveNeverSucceeded"
      - alert: PostgresArchiveNeverSucceeded
        expr: |
          pg_stat_archiver_failed_count{job="postgres"} > 0
            unless on (job, instance) pg_stat_archiver_last_archive_age{job="postgres"}
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "archive_command 有失敗紀錄，卻從來沒有成功過（last_archived_time 是 NULL，exporter 不輸出 last_archive_age）；PostgresArchiveStale 在這種情況回傳空"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-freshness
      - alert: PostgresBackupTooOld
        expr: |
          min by (stanza) (pgbackrest_backup_since_last_completion_seconds{job="pgbackrest"}) > 26 * 3600
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "stanza {{ $labels.stanza }} 超過 26 小時沒有完成任何備份（例子：每日備份）。門檻依備份排程調整；full 備份另看 backup_type=\"full\""
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#backup-freshness
          absence_covered_by: "PostgresBackupExporterFailing"
      - alert: PostgresBackupExporterFailing
        expr: |
          pgbackrest_exporter_status{job="pgbackrest"} == 0
            or absent(pgbackrest_exporter_status{job="pgbackrest"})
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "pgbackrest_exporter 讀不到 pgbackrest info，或整個不存在；這時備份新鮮度規則回傳空"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#backup-freshness

  # ---------- PostgreSQL 本體：容量（capacity） ----------
  # 磁碟規則假設 node_exporter 在 job="node"、資料目錄掛在 /var/lib/postgresql；請換成實際的 job 與 mountpoint。
  - name: postgres-capacity
    rules:
      - alert: PostgresDatabaseSizeDoubled
        expr: |
          pg_database_size_bytes{job="postgres"} > 1e9
            and pg_database_size_bytes{job="postgres"} > 2 * (pg_database_size_bytes{job="postgres"} offset 7d)
        for: 1h
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 一週內大小翻倍（目前 {{ $value | humanize1024 }}B）；確認是預期的成長，還是 bloat、暫存表或批次寫錯"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#database-growth
          absence_covered_by: "PostgresCollectorsMissing, PostgresCollectorFailed"
      - alert: PostgresDataDiskFullSoon
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"}[6h], 4 * 86400) < 0
            and node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"}
              < 0.2 * node_filesystem_size_bytes{job="node", mountpoint="/var/lib/postgresql"}
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.instance }} 的 PostgreSQL 資料目錄剩不到 20%，依過去 6 小時的速度 4 天內寫滿；寫滿時 PostgreSQL PANIC，exporter 跟著失聯"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#disk-forecast
          absence_covered_by: "PostgresDataDiskNotMonitored"
      - alert: PostgresDataDiskNotMonitored
        expr: absent(node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/postgresql"})
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "找不到 PostgreSQL 資料目錄所在檔案系統的 node_exporter metric（job 或 mountpoint 不對）；postgres_exporter 本身看不到磁碟剩餘空間"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#disk-forecast

  # ---------- 叢集與共識（cluster）：只在用 Patroni 時適用 ----------
  # 核心 PostgreSQL 沒有共識與自動選主；Patroni 把 leader lock 放在 DCS（etcd、Consul、ZooKeeper、Kubernetes）。
  # 假設 Patroni REST API 的 /metrics 在 job="patroni"，每個 series 有 scope（叢集名）與 name（節點名）label。
  - name: patroni-cluster
    rules:
      - alert: PatroniDown
        expr: up{job="patroni"} == 0
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "抓不到 {{ $labels.instance }} 的 Patroni REST API；這台的 leader／replica 狀態與 DCS 聯絡時間都看不到"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-up
      - alert: PatroniMissing
        expr: absent(up{job="patroni"})
        for: 5m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "完全沒有 Patroni 的 target，叢集規則全部回傳空；不用 Patroni 的環境請刪掉這一組"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-up
      - alert: PatroniClusterUnlocked
        expr: max by (scope) (patroni_cluster_unlocked{job="patroni"}) == 1
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "Patroni 叢集 {{ $labels.scope }} 在 DCS 裡沒有 leader lock：正在選主，或沒有節點能拿到 lock（DCS 不通、所有節點都不健康）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-leader
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniMultiplePrimaries
        expr: count by (scope) (patroni_primary{job="patroni"} == 1) > 1
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "Patroni 叢集 {{ $labels.scope }} 有 {{ $value }} 台 PostgreSQL 不在 recovery（patroni_primary 看的是 pg_is_in_recovery()，不是 leader lock）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-leader
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniNoPrimary
        expr: |
          sum by (scope) (patroni_primary{job="patroni"}) == 0
            and on (scope) sum by (scope) (patroni_standby_leader{job="patroni"}) == 0
        for: 2m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "Patroni 叢集 {{ $labels.scope }} 抓得到的節點都不是主庫，也不是 standby leader；主庫那台抓不到時同時會有 PatroniDown"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-leader
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniDcsUnreachable
        expr: time() - patroni_dcs_last_seen{job="patroni"} > 60
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.scope }}/{{ $labels.name }} 超過 60 秒（2 × 預設 ttl）沒有成功讀到 DCS；主庫在這種情況會自己降級（除非 failsafe_mode 生效）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-dcs
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniFailsafeActive
        expr: patroni_failsafe_mode_is_active{job="patroni"} == 1
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.scope }} 的主庫因為 failsafe_mode 在 DCS 不通時繼續當主庫；DCS 恢復前不會有自動 failover"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-dcs
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniPaused
        expr: max by (scope) (patroni_is_paused{job="patroni"}) == 1
        for: 1h
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "Patroni 叢集 {{ $labels.scope }} 在維護模式（pause）超過 1 小時：主庫掛掉時不會自動 failover"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-paused
          absence_covered_by: "PatroniDown, PatroniMissing"
      - alert: PatroniTimelineDiverged
        expr: |
          max by (scope) (patroni_postgres_timeline{job="patroni"} > 0)
            > min by (scope) (patroni_postgres_timeline{job="patroni"} > 0)
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "Patroni 叢集 {{ $labels.scope }} 的節點 timeline 不一致超過 10 分鐘：failover 後有複本沒有跟上新主庫（常見是需要 pg_rewind 或重建）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#patroni-timeline
          absence_covered_by: "PatroniDown, PatroniMissing"

  # ---------- 用自訂查詢補上的盲點（query-exporter 5.2.2） ----------
  # 設定：queries/query-exporter/postgres.yaml。假設 query-exporter 在 job="query-exporter"，
  # metric 的 database label 是設定裡的資料庫名稱（primary、primary_app、standby），請依實際命名調整。
  # query-exporter 查詢失敗時保留舊值，所以每條值規則都靠 PostgresCustomQueryStale 判斷資料是否還在更新。
  - name: postgres-custom-queries
    rules:
      - alert: PostgresQueryExporterDown
        expr: up{job="query-exporter"} == 0 or absent(up{job="query-exporter"})
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "抓不到 query-exporter；這組規則補的盲點（同步 standby、XID age、archive 設定等）全部回傳空"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#custom-queries
      - alert: PostgresCustomQueryStale
        expr: |
          time() - query_timestamp{job="query-exporter"} > 900
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "1" }
        annotations:
          summary: "{{ $labels.database }} 的查詢 {{ $labels.query }} 超過 15 分鐘沒有成功；query-exporter 保留舊值，依賴這個查詢的 metric 都是舊的。15 分鐘是最長 interval（5m）的 3 倍"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#custom-queries
          absence_covered_by: "PostgresCustomQueryFailing, PostgresQueryExporterDown"
      - alert: PostgresCustomQueryFailing
        expr: |
          sum by (job, instance, database, query, status) (increase(queries_total{job="query-exporter", status!="success"}[15m])) > 0
            or sum by (job, instance, database) (increase(database_errors_total{job="query-exporter"}[15m])) > 0
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 的自訂查詢失敗（{{ $labels.query }} {{ $labels.status }}），或連不上資料庫；常見原因是少了 pg_monitor、版本不支援（pg_stat_io 16 起）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#custom-queries
      - alert: PostgresSyncStandbyMissing
        expr: |
          pgq_replication_sync_standbys{job="query-exporter"}
            < on (job, instance, database) pgq_replication_sync_required{job="query-exporter"}
        for: 1m
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 的同步 standby 只有 {{ $value }} 台，少於 synchronous_standby_names 要求的數量；synchronous_commit 為 on 以上時 commit 會一直等"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#sync-replication
          absence_covered_by: "PostgresCustomQueryStale, PostgresQueryExporterDown"
      - alert: PostgresReplicationReplayLagHigh
        expr: pgq_replication_replay_lag_seconds{job="query-exporter"} > 300
        for: 5m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "複本 {{ $labels.application_name }} 的 replay_lag 超過 5 分鐘。閒置時 replay_lag 是 NULL、這裡是 0；複本斷線時這條 series 在 expiration 後消失，由 PostgresSyncStandbyMissing 或 PostgresPrimaryWithoutStandby 接手"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#replication-lag
          absence_covered_by: "PostgresSyncStandbyMissing, PostgresPrimaryWithoutStandby"
      - alert: PostgresXminHorizonHeld
        expr: |
          label_replace(
            {job="query-exporter", __name__=~"pgq_oldest_(backend_xid|backend_xmin|slot_xmin|slot_catalog_xmin|prepared_xact)_age"} > 1e8,
            "holder", "$1", "__name__", "pgq_oldest_(.*)_age")
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 的 {{ $labels.holder }} 擋住 vacuum，age 已超過 1 億個 XID（autovacuum_freeze_max_age 預設 2 億）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#xmin-horizon
          absence_covered_by: "PostgresCustomQueryStale"
      - alert: PostgresPreparedXactLingering
        expr: pgq_prepared_xacts{job="query-exporter"} > 0
        for: 30m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 有 {{ $value }} 個 prepared transaction 超過 30 分鐘沒有 COMMIT／ROLLBACK PREPARED；它們不屬於任何 session，重啟也不會消失，會一直擋住 vacuum"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#xmin-horizon
      - alert: PostgresArchiveModeOff
        expr: pgq_archive_mode{job="query-exporter", database="primary"} == 0
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "主庫 archive_mode=off：沒有 WAL archive 就沒有 PITR，而 pg_stat_archiver 看起來和剛啟動一樣。只對應該 archive 的實例啟用"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-config
          absence_covered_by: "PostgresCustomQueryStale, PostgresQueryExporterDown"
      - alert: PostgresArchiveCommandEmpty
        expr: |
          pgq_archive_command_set{job="query-exporter"} == 0
            and on (job, instance, database) pgq_archive_mode{job="query-exporter"} > 0
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 的 archive_mode 開著，但 archive_command 與 archive_library 都是空的：WAL segment 一直留在 pg_wal 等 archive"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-config
          absence_covered_by: "PostgresCustomQueryStale, PostgresQueryExporterDown"
      - alert: PostgresArchiveLastAttemptFailed
        expr: pgq_archive_failing{job="query-exporter"} == 1 and on (job, instance, database) pgq_archive_ready_files{job="query-exporter"} > 0
        for: 10m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 最近一次 archive 失敗晚於最後一次成功，且還有 segment 在等；last_failed_wal 用 SELECT * FROM pg_stat_archiver 查"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-config
      - alert: PostgresArchiveBacklog
        expr: pgq_archive_ready_files{job="query-exporter"} > 20
        for: 15m
        labels: { severity: warning, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 有 {{ $value }} 個 WAL segment 等待 archive（.ready）；archive 跟不上寫入或一直失敗，pg_wal 會成長。門檻是例子：20 × 16MB"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#archive-config
      - alert: PostgresInvalidIndex
        expr: pgq_invalid_indexes{job="query-exporter"} > 0
        for: 1h
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫連線 {{ $labels.database }} 有 {{ $value }} 個 indisvalid=false 的索引（CREATE INDEX CONCURRENTLY 失敗留下的）；查詢不會用它，寫入仍要維護它。建立中的索引也是 invalid，所以 for 1h"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#invalid-indexes
      - alert: PostgresChecksumFailure
        expr: increase(pgq_checksum_failures_total{job="query-exporter"}[1h]) > 0
        labels: { severity: critical, component: postgres_exporter, tier: "2" }
        annotations:
          summary: "{{ $labels.database }} 讀到 checksum 不符的資料頁：儲存層損毀。data_checksums 沒開時這個值永遠是 0（見 PostgresDataChecksumsOff）"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#invalid-indexes
      - alert: PostgresDataChecksumsOff
        expr: pgq_data_checksums_enabled{job="query-exporter"} == 0
        for: 1h
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "{{ $labels.database }} 沒有開 data_checksums，checksum_failures 是 NULL（query-exporter 輸出 0），資料頁損毀不會被計數"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#invalid-indexes
          absence_covered_by: "PostgresCustomQueryStale, PostgresQueryExporterDown"
      - alert: PostgresTimelineChanged
        expr: changes(pgq_checkpoint_timeline_id{job="query-exporter"}[1h]) > 0
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "{{ $labels.database }} 的 timeline 在過去 1 小時變了（提升或 PITR）。pg_control_checkpoint 的 timeline 要等提升後第一次 checkpoint 才變"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#promotion
      - alert: PostgresBackendsWritingBuffers
        expr: |
          sum by (job, instance, database) (rate(pgq_io_writes_total{job="query-exporter", backend_type="client backend"}[15m]))
            > 0.5 * sum by (job, instance, database) (rate(pgq_io_writes_total{job="query-exporter"}[15m]))
          and sum by (job, instance, database) (rate(pgq_io_writes_total{job="query-exporter"}[15m])) > 100
        for: 30m
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "{{ $labels.database }} 一半以上的資料頁寫出是 client backend 自己做的（不是 checkpointer 或 bgwriter）：shared_buffers 或 bgwriter 設定跟不上。pg_stat_io 16 起才有"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wal-io-sources
      - alert: PostgresWalBuffersFull
        expr: rate(pgq_wal_buffers_full_total{job="query-exporter"}[15m]) > 1
        for: 30m
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "{{ $labels.database }} 每秒超過 1 次因 wal_buffers 滿了而必須寫出 WAL；考慮調大 wal_buffers"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#wal-io-sources
      - alert: PostgresSessionsKilledOrFatal
        expr: |
          increase(pgq_db_sessions_killed_total{job="query-exporter"}[15m])
            + increase(pgq_db_sessions_fatal_total{job="query-exporter"}[15m]) > 10
        for: 5m
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫 {{ $labels.datname }} 15 分鐘內有超過 10 個 session 被 terminate 或以 FATAL 結束；連不存在的資料庫、認證失敗不算在任何資料庫裡"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#session-errors
      - alert: PostgresTablesNeedVacuum
        expr: pgq_tables_over_vacuum_threshold{job="query-exporter"} > 0
        for: 6h
        labels: { severity: info, component: postgres_exporter, tier: "3" }
        annotations:
          summary: "資料庫連線 {{ $labels.database }} 有 {{ $value }} 張表的 dead tuple 超過預設 autovacuum 門檻 6 小時；pgq_table_dead_tuples 列出前 5 張。postgres_exporter 的 stat_user_tables 只看 DSN 那一個資料庫，這條涵蓋每個設定的 DSN"
          runbook_url: https://hahasula.github.io/alert-trust/components/postgres_exporter/#autovacuum
