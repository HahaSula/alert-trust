# 從觸發到通知（docs/architecture/alert-delivery.md）用到的參考。
# 原始碼行號都在對應 tag 的檔案上手動核對過（gh api 取檔、逐行比對）；Alertmanager 釘在 v0.28.1，lab 用 v0.29.0（dispatch、notify 的計時邏輯相同）。
refs:
  exp-ad-group-wait:
    kind: experiment
    title: "alert-delivery 實驗：新 group 的第一次通知（group_wait 10s）（Prometheus 3.13.5、Alertmanager 0.29.0）"
    url: "https://github.com/HahaSula/alert-trust/blob/main/lab/alert-delivery/results/summary.md#group-wait"
  exp-ad-group-interval:
    kind: experiment
    title: "alert-delivery 實驗：加入已在響的 group、resolved 等下一個 group_interval tick（Prometheus 3.13.5、Alertmanager 0.29.0）"
    url: "https://github.com/HahaSula/alert-trust/blob/main/lab/alert-delivery/results/summary.md#group-interval"
  exp-ad-repeat:
    kind: experiment
    title: "alert-delivery 實驗：repeat_interval 只在 group_interval tick 判斷（45s、1m、75s、105s）（Prometheus 3.13.5、Alertmanager 0.29.0）"
    url: "https://github.com/HahaSula/alert-trust/blob/main/lab/alert-delivery/results/summary.md#repeat"
  exp-ad-endsat:
    kind: experiment
    title: "alert-delivery 實驗：Prometheus 停掉後 EndsAt 到期、下一個 tick 送 resolved（Prometheus 3.13.5、Alertmanager 0.29.0）"
    url: "https://github.com/HahaSula/alert-trust/blob/main/lab/alert-delivery/results/summary.md#endsat"
  exp-ad-clock:
    kind: experiment
    title: "alert-delivery 實驗：Docker Desktop VM 的單調時鐘比牆鐘慢，tick 間隔以牆鐘看會變長（Prometheus 3.13.5、Alertmanager 0.29.0）"
