id: victoriametrics
name: VictoriaMetrics single／cluster
kind: infra
family: victoriametrics
status: draft
stages: [store, query]
versions_checked: ["v1.155.0"]
architecture: architecture/victoriametrics.md
role: >-
  儲存與查詢。Cluster 版多了「部分節點故障」這種狀態，預設回傳不完整的答案、HTTP 200。

silent_failures:
  - text: Cluster RF=1 時一台 vmstorage 掛掉會 partial response，increase 類的「數量太低」規則假觸發（lab 中 4 分鐘的故障裡持續 66 秒）。
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults, vms-partial]
  - text: vmstorage 唯讀時 rule 不報錯；官方規則沒有引用 vm_storage_is_read_only。
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults, vst-readonly]
  - text: 官方文件寫的 denyPartialResponse 參數名稱沒有作用，vmselect 只認 deny_partial_response。
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults, vms-denypartial]
  - text: 磁碟突然 0 byte 時先切唯讀，之後可能因 flush 失敗而 panic（lab 未重測）。
    evidence: inferred
    source: art-vm

contracts: []

usage:
  - id: replication-factor
    text: >-
      Cluster 用 `-replicationFactor=2`、vmstorage 至少 3 台。RF=1 時一台 vmstorage 掛掉就 partial response，
      increase 類的「數量太低」規則假觸發；RF=2 實測不受影響
    evidence: tested
    refs: [exp-vm-faults, vmi-rf]
  - id: deny-partial-response
    text: >-
      需要完整資料的 rule 在 vmalert group 的 `params` 加 `deny_partial_response=1`；官方文件寫的 `denyPartialResponse` 沒有作用。
      全域 `-search.denyPartialResponse` 會讓 dashboard 一起報錯
    evidence: tested
    refs: [vms-denypartial, vms-partial, exp-vm-faults]
  - id: skip-slow-replicas
    text: "`-search.skipSlowReplicas` 保持關閉；開了會跳過較慢的副本，RF=2 的保護打折"
    evidence: code
    refs: [vms-skipslow]
  - id: drop-on-overload
    text: vminsert 的 `-dropSamplesOnOverload` 保持關閉；開了之後節點過載就丟資料，而且發生在複製之前
    evidence: code
    refs: [vmi-drop]
  - id: latency-offset
    text: >-
      vmselect 的 `-search.latencyOffset`（預設 30s）把比它新的查詢時間改成 now − 30s；只調小 vmalert 的 eval_delay 拿不到更新的資料，要一起調
    evidence: code
    refs: [vms-latency]
  - id: select-concurrency
    text: >-
      `-search.maxConcurrentRequests`（cluster 預設 2 × CPU）與 `-search.maxQueueDuration`（10s，逾時回 429）由 rule 與 dashboard 共用；
      dashboard 的重查詢會讓 vmalert 收到 429。考慮給 rule 獨立的 vmselect
    evidence: code
    refs: [vms-maxconc, vms-queue]
  - id: min-free-disk
    text: 可用空間低於 `-storage.minFreeDiskSpaceBytes`（預設 100MB）時 vmstorage 切唯讀；全部唯讀時 rule 不報錯，只會看到資料變舊
    evidence: tested
    refs: [vst-minfree, vst-readonly, exp-vm-faults]

signals:
  - id: components-up
    section: observe
    tier: 1
    question: 每個元件活著嗎
    signal: vminsert、vmselect、vmstorage（或 single）的 up
    metrics: [up]
    evaluate_on: observer
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults]
    upstream: { status: partial, note: "lab 的 job 名稱是 vm，官方 ServiceDown 的選擇器對到 0 條（只查選擇器，沒有讓 VM 停機）" }
    rules: [rules/victoriametrics/meta.yml#MetaTargetDown]

  - id: read-only
    section: misuse
    tier: 1
    question: 還能寫入嗎
    signal: max(vm_storage_is_read_only) == 1
    metrics: [vm_storage_is_read_only]
    evaluate_on: observer
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults, vst-readonly]
    upstream: { status: no, note: "只有 3 天預測" }
    rules: [rules/victoriametrics/meta.yml#MetaStorageReadOnly]

  - id: partial-results
    section: observe
    tier: 1
    question: 查詢結果完整嗎
    signal: sum(rate(vm_partial_results_total[2m])) > 0
    metrics: [vm_partial_results_total]
    evaluate_on: observer
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults]
    upstream: { status: no }
    applies_when: cluster
    rules: [rules/victoriametrics/meta.yml#MetaPartialResponses]

  - id: storage-reachable
    section: observe
    tier: 1
    question: vmstorage 連得到嗎
    signal: min(vm_rpc_vmstorage_is_reachable) == 0
    metrics: [vm_rpc_vmstorage_is_reachable]
    evaluate_on: observer
    evidence: tested
    source: art-vm
    refs: [exp-vm-faults]
    upstream: { status: partial, note: "RPCErrors 看錯誤數" }
    applies_when: cluster
    rules: [rules/victoriametrics/meta.yml#MetaStorageUnreachable]

  - id: disk-space
    section: misuse
    tier: 1
    question: 磁碟夠嗎
    signal: DiskRunsOutOfSpace
    metrics: [vm_free_disk_space_bytes, vm_data_size_bytes]
    evaluate_on: observer
    evidence: upstream
    source: vm-rules
    upstream: { status: yes }
    rules: []

  - id: query-saturation
    section: misuse
    tier: 2
    question: 查詢飽和了嗎
    signal: vm_concurrent_select_limit_timeout_total 增加
    metrics: [vm_concurrent_select_limit_timeout_total]
    evaluate_on: observer
    evidence: code
    source: art-vm
    refs: [vms-queue]
    upstream: { status: yes }
    rules: []

  - id: rows-dropped
    section: misuse
    tier: 2
    question: 資料被丟掉了嗎
    signal: vm_rows_ignored_total、vm_rpc_rows_dropped_on_overload_total、series limit 丟棄數
    metrics: [vm_rows_ignored_total, vm_rpc_rows_dropped_on_overload_total]
    evaluate_on: observer
    evidence: code
    source: art-vm
    refs: [vmi-drop]
    upstream: { status: partial }
    rules: []

  - id: restarts
    section: observe
    tier: 2
    question: 一直重啟或上次沒有正常關閉嗎
    signal: "changes(vm_app_start_timestamp[15m]) > 2；vm_app_prev_shutdown_unclean == 1（啟動 10 分鐘內）"
    metrics: [vm_app_start_timestamp, vm_app_prev_shutdown_unclean]
    evaluate_on: observer
    evidence: upstream
    source: vm-rules
    refs: [vm-rule-restarts, vm-rule-unclean, vm-app-unclean]
    upstream: { status: partial, note: "TooManyRestarts 依 job 名稱比對；UncleanShutdown 不依 job" }
    rules:
      - rules/victoriametrics/meta.yml#MetaVMTooManyRestarts
      - rules/victoriametrics/meta.yml#MetaVMUncleanShutdown

# 寫得不好的 MetricsQL：每一種壞用法對應到哪些訊號、看得到什麼、/metrics 看不到什麼。
bad_queries:
  - case: 昂貴的查詢（高基數、長時間範圍）佔滿 vmselect 的併發
    signals: [query-saturation]
    visible: vm_concurrent_select_limit_timeout_total 增加（排隊超過上限時間的查詢數）
    not_visible: >-
      是哪一條查詢；-search.maxQueryDuration、-search.maxUniqueTimeseries、-search.maxSamplesPerQuery 超限時有沒有 metric 沒有讀碼確認（見 blind_spots）
    refs: [vms-queue, vms-maxconc]

blind_spots:
  - what: 哪一條查詢佔滿 vmselect 的併發、或觸發 -search.max* 上限
    category: exporter
    why: >-
      本 repo 只核對到總數 `vm_concurrent_select_limit_timeout_total`；`-search.maxQueryDuration`、`-search.maxUniqueTimeseries`、
      `-search.maxSamplesPerQuery` 超限時有沒有對應的 metric 沒有讀碼確認，rule 端只看到查詢失敗
    workaround: 看 vmalert /api/v1/rules 的 lastError
    options: "建議：開 vmselect 的 slow query log（-search.logSlowQueryDuration，預設 5s），對照 vmalert 的錯誤時間"
    section: architecture/victoriametrics.md#vmselect
  - what: Partial response 少的是哪些 series
    category: exporter
    why: "`vm_partial_results_total` 只計次數，結果裡沒有標記少了哪一台 vmstorage 的資料"
    workaround: 對照 `vm_rpc_vmstorage_is_reachable` 找出失聯的節點
    options: "建議：關鍵 rule 用 deny_partial_response=1，讓不完整變成查詢失敗"
