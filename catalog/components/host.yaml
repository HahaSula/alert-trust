id: host
name: 主機與容器資源
kind: infra
family: shared
status: draft
stages: [source]
versions_checked: ["node_exporter v1.12.1（含 docs/node-mixin）", "cAdvisor v0.60.6", "kubelet v1.37.2 /metrics/cadvisor", "kube-state-metrics v2.20.0", "kubernetes-mixin version-1.5.6", "process-exporter v0.8.7（選用）"]
architecture: architecture/db-resources.md#host-layer
role: >-
  每個資料庫 target 都跑在一台主機或一個容器上。資料庫自己的 metric 只看得到它管的池（buffer pool、連線上限、cache 配額），
  看不到 CPU 排隊、page cache、swap、磁碟延遲、檔案系統唯讀、cgroup 記憶體上限與 OOM kill。這張卡把這一層的訊號集中在一處，
  target 卡的 blind_spots 用 covered_by 指過來。資料來源是 node_exporter（主機）、cAdvisor 或 kubelet 的 /metrics/cadvisor（容器）、
  kube-state-metrics（OOMKilled 原因），process-exporter 選用（沒有 process_* metric 的 mysqld、postgres 的 fd 與 thread）。
  container-memory-limit、oom-kills（主機部分）、filesystem-readonly 在 lab/host 觸發過（WSL2、Docker Desktop、獨立 cAdvisor），其餘只讀碼；門檻是例子。資料庫內部資源和這一層的對照見[資料庫的資源](../architecture/db-resources.md)。

silent_failures:
  - text: "node-mixin 的 NodeFilesystemSpaceFillingUp／AlmostOutOfSpace 只算 `node_filesystem_readonly == 0` 的檔案系統。ext4 因錯誤 remount 成唯讀時，空間規則反而排除它，mixin 也沒有唯讀規則。"
    evidence: code
    source: res-node-mixin
    refs: [res-nm-fs-filling, res-nm-fs-readonly, res-ne-fs-readonly]
  - text: "node-mixin 的預設 selector 是 `job=\"node\"`；job 名稱不同時每一條 mixin 規則都回傳空，不會報錯。mixin 也沒有 node_exporter 本身停掉的規則。"
    evidence: code
    source: res-node-mixin
    refs: [res-nm-selector]
  - text: "node-mixin 的磁碟規則只有 NodeDiskIOSaturation（`node_disk_io_time_weighted_seconds_total` 的速率 > 10，也就是平均佇列長度，for 30m）。單次 IO 延遲（fsync 慢）在佇列不長時看不到；也沒有 swap、PSI、OOM kill 的規則。CPU 規則 NodeCPUHighUsage 的 severity 是 info。"
    evidence: code
    source: res-node-mixin
    refs: [res-nm-diskio, res-nm-cpu, res-ne-disk-weighted]
  - text: "容器的 `container_memory_working_set_bytes` 是 usage 減 inactive_file。cgroup 的記憶體也算 page cache 的 active 部分，資料庫大量讀檔時 working set 會接近 limit，但不一定會 OOM；反過來，看主機的 MemAvailable 不會知道某個容器快碰到自己的 limit。"
    evidence: code
    source: res-cadvisor
    refs: [res-cadv-wss-calc, res-cadv-wss, res-cadv-memlimit]
  - text: "kubernetes-mixin version-1.5.6 有 CPUThrottlingHigh（25%），但沒有容器記憶體接近 limit、也沒有 OOMKilled 的告警；OOM 之後只會看到 KubePodCrashLooping（反覆重啟才響）。"
    evidence: code
    source: res-k8s-mixin
    refs: [res-km-throttling, res-km-throttling-pct]
  - text: "獨立執行的 cAdvisor 預設停用 process 類 metric（`container_file_descriptors`、`container_threads`）；kubelet 的 /metrics/cadvisor 有開。PSI（`container_pressure_*`）在 kubelet 要 KubeletPSI feature gate。"
    evidence: code
    source: res-cadvisor
    refs: [res-cadv-ignore-process, res-kubelet-included, res-kubelet-psi]

  - text: "獨立執行的 cAdvisor 沒有 `container` label，只有 `id`、`name`（第一個 alias）、`image`；`container` 是 kubelet 的 /metrics/cadvisor 才有。用 `container!=\"\"` 過濾的容器規則在獨立 cAdvisor 上回傳空，不會報錯（lab/host：working set／limit 0.90 時原式仍是 inactive）。"
    evidence: tested
    source: res-cadvisor
    refs: [exp-host-memlimit, res-cadv-labels]
  - text: "cAdvisor 的 `container_oom_events_total` 以核心 OOM 訊息裡的 cgroup 路徑累加，再用 cAdvisor 自己看到的容器名稱查；兩者不同時 counter 永遠是 0。lab/host（WSL2 上的 Docker Desktop）核心寫 `/wsl-user/distro-…/docker/<id>`，cAdvisor 看到 `/docker/<id>`，事件 API 收到 3 次 oomKill，counter 仍是 0。被 OOM kill 後沒有重啟的容器，series 也會跟著消失。"
    evidence: tested
    source: res-cadvisor
    refs: [exp-host-oom, res-cadv-oom-parse, res-cadv-oom-key]

contracts: []

usage:
  - id: node-mixin-selector
    text: node-mixin 的預設 selector 是 `job="node"`，job 名稱不同時每一條規則都回空、不報錯；套用前改 selector，並另加 exporter 停掉的規則
    evidence: code
    refs: [res-nm-selector]
  - id: cadvisor-labels
    text: >-
      獨立執行的 cAdvisor 沒有 `container` label，只有 id、name、image；`container!=""` 的容器規則在它上面回空，要改用 id 或 name 選
    evidence: tested
    refs: [exp-host-memlimit, res-cadv-labels]
  - id: cadvisor-process-metrics
    text: 獨立 cAdvisor 預設停用 process 類 metric（container_file_descriptors、container_threads），要用時自己打開；kubelet 的 /metrics/cadvisor 有開
    evidence: code
    refs: [res-cadv-ignore-process, res-kubelet-included]
  - id: psi-sources
    text: 容器的 PSI（container_pressure_*）在 kubelet 要開 KubeletPSI feature gate；node_exporter 的 pressure collector 在沒有 PSI 的核心上會失敗
    evidence: code
    refs: [res-kubelet-psi, res-ne-pressure-default]
  - id: memory-limit-source
    text: kube-prometheus-stack 預設丟棄 `container_spec_memory_limit_bytes`；記憶體比值改用 kube-state-metrics 的 `kube_pod_container_resource_limits`
    evidence: tested
    refs: [exp-prom-k8s]
  - id: readonly-rule
    text: node-mixin 的空間規則只算 `node_filesystem_readonly == 0` 的檔案系統，mixin 也沒有唯讀規則；要另加唯讀與 device_error 規則
    evidence: code
    refs: [res-nm-fs-readonly, res-ne-fs-readonly, res-ne-fs-deverr]
  - id: memory-limit-threshold
    text: >-
      Page cache 會把容器用量推到 limit，working set 在 0.9 附近上下；記憶體比值的門檻離 limit 太近會反覆 pending，要搭配 `for`
    evidence: tested
    refs: [exp-host-memlimit, res-cadv-wss-calc]

signals:
  - id: exporter-up
    section: observe
    tier: 1
    aspect: exporter
    question: 每台資料庫主機都有 node_exporter，而且抓得到嗎
    signal: '`up{job=~".*node.*"} == 0`，加上 `absent(up{job=~".*node.*"})`；每個資料庫 instance 都要對得到一台主機'
    metrics: [up]
    evaluate_on: observer
    silent_failure: 沒有 node_exporter 時，這張卡所有規則回傳空，target 卡的「磁碟滿」「OOM」照樣是盲點
    evidence: code
    source: res-node-mixin
    refs: [res-nm-selector]
    upstream: { status: no, note: "node-mixin 沒有 exporter 停掉的規則" }
    rules: [rules/host/meta.yml#HostExporterDown, rules/host/meta.yml#HostExporterMissing]

  - id: collector-success
    section: observe
    tier: 2
    aspect: exporter
    question: node_exporter 的 collector 都成功嗎
    signal: '`node_scrape_collector_success == 0`（例如 filesystem 的 statfs 卡住、pressure 在沒有 PSI 的核心上）'
    metrics: [node_scrape_collector_success]
    evaluate_on: observer
    evidence: code
    source: res-node-exporter
    refs: [res-ne-collector-success, res-ne-pressure-default]
    upstream: { status: no }
    rules: [rules/host/meta.yml#HostCollectorFailed]

  - id: disk-space
    section: misuse
    tier: 1
    aspect: capacity
    question: 資料目錄所在的檔案系統快滿了嗎
    signal: 剩餘 < 10%，或照 6 小時趨勢 24 小時內寫滿；另看 inode
    metrics: [node_filesystem_avail_bytes, node_filesystem_size_bytes, node_filesystem_files_free, node_filesystem_files]
    evaluate_on: observer
    evidence: code
    source: res-node-mixin
    refs: [res-nm-fs-filling, res-nm-fs-almost, res-nm-files, pg-asp-ne-avail, pg-asp-ne-size]
    upstream: { status: yes, note: "node-mixin NodeFilesystemSpaceFillingUp、AlmostOutOfSpace、AlmostOutOfFiles；但排除唯讀檔案系統" }
    rules: [rules/host/meta.yml#HostFilesystemAlmostFull, rules/host/meta.yml#HostFilesystemFillingUp, rules/host/meta.yml#HostInodesAlmostFull]

  - id: filesystem-readonly
    section: misuse
    tier: 1
    aspect: availability
    question: 資料目錄的檔案系統變成唯讀或讀不到了嗎
    signal: '`node_filesystem_readonly == 1` 或 `node_filesystem_device_error == 1`（限 ext4／xfs／btrfs／zfs）。lab 實測：以唯讀掛載的 ext4 為 1、讀寫的為 0，HostFilesystemReadOnly firing；錯誤後 remount 唯讀與 device_error 沒有測（要 privileged），仍是讀碼'
    metrics: [node_filesystem_readonly, node_filesystem_device_error]
    evaluate_on: observer
    silent_failure: 唯讀時 node-mixin 的空間規則排除這個檔案系統；資料庫寫入失敗，但空間看起來正常
    evidence: tested
    source: res-node-exporter
    refs: [exp-host-readonly, res-ne-fs-readonly, res-ne-fs-deverr, res-nm-fs-readonly]
    upstream: { status: no }
    rules: [rules/host/meta.yml#HostFilesystemReadOnly, rules/host/meta.yml#HostFilesystemDeviceError]

  - id: oom-kills
    section: misuse
    tier: 1
    aspect: availability
    question: 資料庫行程被 OOM kill 了嗎
    signal: 主機 `node_vmstat_oom_kill` 增加；容器 `container_oom_events_total` 增加；K8s 上次結束原因 OOMKilled 且剛重啟。lab 實測只有主機這條（cgroup OOM kill 3 次，25 → 28，HostOOMKill firing）；容器 counter 在 WSL2 上維持 0（見 silent_failures），K8s 沒測
    metrics: [node_vmstat_oom_kill, container_oom_events_total, kube_pod_container_status_last_terminated_reason, kube_pod_container_status_restarts_total]
    evaluate_on: observer
    silent_failure: 資料庫卡片只看得到 uptime 歸零或 up 掉一下，分不出是 OOM、crash 還是人為重啟
    evidence: tested
    source: res-node-exporter
    refs: [exp-host-oom, res-ne-vmstat-fields, res-cadv-oom, res-cadv-oom-parse, res-cadv-oom-key, res-ksm-terminated, res-ksm-restarts]
    upstream: { status: no, note: "node-mixin 與 kubernetes-mixin 都沒有 OOM kill 規則" }
    rules: [rules/host/meta.yml#HostOOMKill, rules/host/meta.yml#ContainerOOMEvent, rules/host/meta.yml#ContainerOOMKilled]

  - id: container-memory-limit
    section: misuse
    tier: 1
    aspect: saturation
    question: 容器的記憶體快碰到 cgroup limit 了嗎
    signal: '`container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.9`（limit 為 0 表示沒設，排除）。kubelet 用 `container` label 選，獨立 cAdvisor 沒有這個 label，要用 `id`（或 `name`）選。lab 實測 64 MiB limit：0.83、0.90、0.97；page cache 會把用量推到 limit，working set 在 0.9 附近上下，門檻離 limit 太近會反覆 pending'
    metrics: [container_memory_working_set_bytes, container_spec_memory_limit_bytes]
    evaluate_on: observer
    applies_when: 資料庫跑在容器裡（Kubernetes、Docker）
    silent_failure: 主機 MemAvailable 還很多時，容器照樣被自己的 limit OOM kill
    evidence: tested
    source: res-cadvisor
    refs: [exp-host-memlimit, res-cadv-wss, res-cadv-wss-calc, res-cadv-memlimit, res-cadv-labels, res-kubelet-included]
    upstream: { status: no, note: "kubernetes-mixin 沒有這條" }
    rules: [rules/host/meta.yml#ContainerMemoryNearLimit]

  - id: memory-available
    section: misuse
    tier: 2
    aspect: saturation
    question: 主機的可用記憶體與記憶體壓力
    signal: MemAvailable／MemTotal < 10%，或 PSI memory full 超過 10% 的時間
    metrics: [node_memory_MemAvailable_bytes, node_memory_MemTotal_bytes, node_pressure_memory_stalled_seconds_total, node_vmstat_pgmajfault]
    evaluate_on: observer
    evidence: code
    source: res-node-exporter
    refs: [res-ne-mem-avail, res-ne-psi-mem, res-nm-mem, res-nm-mem-th, res-nm-majfault]
    upstream: { status: partial, note: "node-mixin NodeMemoryHighUtilization（90%）、NodeMemoryMajorPagesFaults；沒有 PSI" }
    rules: [rules/host/meta.yml#HostMemoryLow, rules/host/meta.yml#HostMemoryPressure]

  - id: swap-activity
    section: misuse
    tier: 2
    aspect: saturation
    question: 主機在換頁（swap in／out）嗎
    signal: '`rate(node_vmstat_pswpin) + rate(node_vmstat_pswpout)` 每秒 > 100 頁；SwapFree 下降'
    metrics: [node_vmstat_pswpin, node_vmstat_pswpout, node_memory_SwapFree_bytes, node_memory_SwapTotal_bytes]
    evaluate_on: observer
    silent_failure: buffer pool、shared_buffers、Valkey 的資料被換出時，資料庫的 hit ratio 不變，延遲卻上升
    evidence: code
    source: res-node-exporter
    refs: [res-ne-vmstat-fields, res-ne-swap-free]
    upstream: { status: no }
    rules: [rules/host/meta.yml#HostSwapping]

  - id: cpu-saturation
    section: misuse
    tier: 2
    aspect: saturation
    question: 主機的 CPU 夠嗎
    signal: PSI cpu some 超過 50% 的時間；輔助看非 idle 使用率與 load per core
    metrics: [node_pressure_cpu_waiting_seconds_total, node_cpu_seconds_total, node_load1]
    evaluate_on: observer
    evidence: code
    source: res-node-exporter
    refs: [res-ne-psi-cpu, res-ne-cpu, res-nm-cpu, res-nm-cpu-th, res-nm-load]
    upstream: { status: partial, note: "node-mixin NodeCPUHighUsage（info）、NodeSystemSaturation（load per core > 2）" }
    rules: [rules/host/meta.yml#HostCPUPressure]

  - id: container-cpu-throttling
    section: misuse
    tier: 2
    aspect: saturation
    question: 容器被 CPU quota 節流嗎
    signal: 被節流的 CFS 週期比例 > 25%，for 15m
    metrics: [container_cpu_cfs_throttled_periods_total, container_cpu_cfs_periods_total, container_cpu_usage_seconds_total]
    evaluate_on: observer
    applies_when: 資料庫跑在有 CPU limit 的容器裡
    silent_failure: 平均 CPU 使用率遠低於 limit 時，短時間的尖峰照樣被節流；單執行緒的 Valkey 主執行緒、etcd 的 apply 最明顯
    evidence: code
    source: res-cadvisor
    refs: [res-cadv-throttled, res-cadv-periods, res-cadv-cpu, res-km-throttling, res-km-throttling-pct]
    upstream: { status: yes, note: "kubernetes-mixin CPUThrottlingHigh（25%，for 15m）" }
    rules: [rules/host/meta.yml#ContainerCPUThrottled]

  - id: disk-latency
    section: misuse
    tier: 2
    aspect: saturation
    question: 資料磁碟每次 IO 要多久
    signal: 平均寫入／讀取時間 > 50ms（有 IO 時才算）；PSI io full 超過 10% 的時間
    metrics: [node_disk_write_time_seconds_total, node_disk_writes_completed_total, node_disk_read_time_seconds_total, node_disk_reads_completed_total, node_pressure_io_stalled_seconds_total]
    evaluate_on: observer
    silent_failure: 資料庫的 fsync 直方圖（etcd、YugabyteDB）會變慢，但 MySQL、PostgreSQL、MongoDB 的卡片沒有 fsync 延遲訊號，只有這一層看得到
    evidence: code
    source: res-node-exporter
    refs: [res-ne-disk-writetime, res-ne-disk-writes, res-ne-disk-readtime, res-ne-disk-reads, res-ne-psi-io]
    upstream: { status: partial, note: "node-mixin 只有 NodeDiskIOSaturation（佇列長度 > 10，for 30m）" }
    rules: [rules/host/meta.yml#HostDiskWriteLatencyHigh, rules/host/meta.yml#HostDiskReadLatencyHigh, rules/host/meta.yml#HostIOPressure]

  - id: disk-busy
    section: misuse
    tier: 3
    aspect: saturation
    question: 磁碟忙碌時間與佇列
    signal: '`rate(node_disk_io_time_seconds_total)` 接近 1、`rate(node_disk_io_time_weighted_seconds_total)` 偏高；SSD／NVMe 可平行處理，忙碌 100% 不代表飽和，只當輔助'
    metrics: [node_disk_io_time_seconds_total, node_disk_io_time_weighted_seconds_total]
    evaluate_on: observer
    evidence: code
    source: res-node-mixin
    refs: [res-ne-disk-iotime, res-ne-disk-weighted, res-nm-diskio]
    upstream: { status: yes, note: "node-mixin NodeDiskIOSaturation" }
    rules: []

  - id: fd-headroom
    section: misuse
    tier: 2
    aspect: saturation
    question: 整機與資料庫行程的 file descriptor 還夠嗎
    signal: 整機 `node_filefd_allocated / node_filefd_maximum > 0.8`；行程 `process_open_fds / process_max_fds`（Go／Rust 的 etcd、TiKV、TiDB、PD 與 exporter 自己）或 process-exporter 的 worst_fd_ratio（mysqld、postgres）
    metrics: [node_filefd_allocated, node_filefd_maximum, process_open_fds, process_max_fds, namedprocess_namegroup_worst_fd_ratio, container_file_descriptors]
    evaluate_on: observer
    silent_failure: 打滿的是行程的 ulimit（RLIMIT_NOFILE），整機的 fs.file-max 通常遠大於它；node-mixin 只看整機
    evidence: code
    source: res-node-exporter
    refs: [res-ne-filefd, res-nm-fd, res-cg-process, res-px-fd-ratio, res-cadv-fds]
    upstream: { status: partial, note: "node-mixin NodeFileDescriptorLimit 只看整機（70%／90%）" }
    rules: [rules/host/meta.yml#HostFdNearLimit, rules/host/meta.yml#ProcessFdNearLimit]

  - id: clock-sync
    section: misuse
    tier: 2
    aspect: availability
    question: 主機時鐘有同步、偏移多大
    signal: '`node_timex_sync_status` 為 0 且 maxerror ≥ 16s；或 `|node_timex_offset_seconds| > 50ms`'
    metrics: [node_timex_sync_status, node_timex_maxerror_seconds, node_timex_offset_seconds]
    evaluate_on: observer
    applies_when: 依賴時鐘的資料庫（YugabyteDB 的 hybrid clock、TiDB 的 TSO、MongoDB 的 wall time lag）
    evidence: code
    source: res-node-exporter
    refs: [res-ne-timex-sync, res-ne-timex-offset, res-nm-clock]
    upstream: { status: yes, note: "node-mixin NodeClockNotSynchronising、NodeClockSkewDetected" }
    rules: [rules/host/meta.yml#HostClockNotSynchronised, rules/host/meta.yml#HostClockOffsetHigh]

  - id: network-errors
    section: misuse
    tier: 3
    aspect: saturation
    question: 網卡有丟包或錯誤嗎
    signal: '`rate(node_network_receive_drop_total)`、`node_network_receive_errs_total` 持續增加；複寫與 Raft 心跳延遲的旁證'
    metrics: [node_network_receive_drop_total, node_network_receive_errs_total, node_network_transmit_errs_total]
    evaluate_on: observer
    evidence: code
    source: res-node-mixin
    refs: [res-ne-net-drop, res-nm-netrx]
    upstream: { status: yes, note: "node-mixin NodeNetworkReceiveErrs、NodeNetworkTransmitErrs" }
    rules: []

  - id: process-threads-cpu
    section: misuse
    tier: 3
    aspect: saturation
    question: 資料庫行程內哪一類 thread 在吃 CPU
    signal: process-exporter 依 thread 名稱分的 CPU 時間（mysqld 的 connection 與 InnoDB 背景 thread、TiKV 的 raftstore／apply 已有原生 metric）
    metrics: [namedprocess_namegroup_thread_cpu_seconds_total, namedprocess_namegroup_memory_bytes, namedprocess_namegroup_num_threads]
    evaluate_on: observer
    applies_when: 有裝 process-exporter
    evidence: code
    source: res-process-exporter
    refs: [res-px-thread-cpu, res-px-memory, res-px-threads-flag]
    upstream: { status: no }
    rules: []

blind_spots:
  - what: 容器的 OOM kill 次數（cgroup 路徑不一致時）
    category: exporter
    why: cAdvisor 用核心 OOM 訊息裡的 cgroup 路徑查容器，和自己看到的名稱不同時 container_oom_events_total 永遠是 0（WSL2 上實測）
    workaround: 主機的 node_vmstat_oom_kill；K8s 上看 kube-state-metrics 的上次結束原因
    options: "建議：容器 OOM 規則同時看 node_vmstat_oom_kill 與 KSM 的 OOMKilled，不要只靠 cAdvisor counter"
    section: architecture/db-resources.md#memory
  - what: 被 OOM kill 後沒有重啟的容器
    category: exporter
    why: 容器消失後它的 series 一起消失，counter 的增加量看不到
    workaround: 主機的 node_vmstat_oom_kill
    options: "建議：對資料庫容器加 absent 類規則，或看 KSM 的 terminated reason"
  - what: 單次 IO 的延遲尖峰（fsync 慢）
    category: exporter
    why: node_exporter 只輸出累計時間與次數，只能算平均；佇列不長時尖峰被平均掉
    workaround: 有 fsync 直方圖的資料庫（etcd、YugabyteDB）看資料庫自己的 metric
    options: "建議：其他資料庫靠 log 的慢 fsync 訊息；本卡不往核心追蹤工具延伸"
    section: architecture/db-resources.md#io
  - what: 哪個行程在用 IO 或 page cache
    category: exporter
    why: node_exporter 只有裝置層級與整機的數字；cAdvisor 只到容器
    workaround: 依容器拆分（cAdvisor）
