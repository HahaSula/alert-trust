id: observer
name: 外部觀察者與 dead man's switch
kind: architecture
family: shared
status: draft
stages: [meta]
versions_checked: []
role: >-
  這張卡檢查架構性質，不是 metric。其他卡標「observer」的訊號都在這裡評估，
  所以這裡的條件不成立，前面的卡就都不算數。

silent_failures:
  - text: Prometheus 停機後 Alertmanager 仍重送 Watchdog 到 EndsAt，停機 3 分鐘內外部還收得到。
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]
  - text: 存活探測（/-/healthy、/-/ready）在 8 種故障裡只明確抓到 2 種。
    evidence: tested
    source: selfcheck
    refs: [exp-prom-blackbox]

contracts: [deadman-wait]

usage:
  - id: federate-series
    text: >-
      `up`、`scrape_duration_seconds`、`ALERTS_FOR_STATE` 不在 Prometheus 的 /metrics；用到它們的規則要在受測 Prometheus 評估，或用 /federate 送到 meta
    evidence: code
    refs: [p-scrape-report]
  - id: deadman-wait
    text: >-
      DMS 的等待依契約 deadman-wait。Prometheus 停機後 Alertmanager 仍重送 Watchdog 到 EndsAt，停機 3 分鐘內外部還收得到，太短的等待會誤報
    evidence: tested
    refs: [exp-prom-heartbeat]
  - id: probe-content
    text: >-
      外部探測要驗證回應內容（實際查詢、Alertmanager 的 /api/v2/status），不能只看 HTTP 200：/-/healthy、/-/ready 在 8 種故障裡只明確抓到 2 種
    evidence: tested
    refs: [exp-prom-blackbox]
  - id: k8s-from-outside
    text: OOMKilled 與重啟次數由外部 Prometheus 抓 kube-state-metrics；受測 Prometheus 在重啟期間沒有在抓資料，自己查不到原因
    evidence: tested
    refs: [exp-prom-k8s]

signals:
  - id: failure-domain
    section: observe
    tier: 1
    question: 跟被監控對象在不同故障域嗎
    signal: 不同節點、儲存、叢集；不寫入被監控的 VM 或 VL
    metrics: []
    evaluate_on: interview
    evidence: code
    source: vm-multiregional
    upstream: { status: no }
    rules: []

  - id: separate-alert-path
    section: observe
    tier: 1
    question: 告警是否不經過被監控的 Alertmanager
    signal: meta 的 alerting 設定指向另一台 Alertmanager 或直接送外部
    metrics: []
    evaluate_on: interview
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]
    upstream: { status: no }
    rules: []

  - id: own-deadman
    section: observe
    tier: 1
    question: Meta 自己也有 dead man's switch 嗎
    signal: meta 的 Watchdog 送到外部接收端
    metrics: []
    evaluate_on: interview
    evidence: inferred
    source: art-vm
    upstream: { status: no }
    rules: []

  - id: scrapes-all-infra
    section: observe
    tier: 1
    question: 抓得到每個 infra 元件的 /metrics 嗎
    signal: 每個元件在 meta 上都有 up series
    metrics: [up]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-blackbox]
    upstream: { status: no }
    rules: []

  - id: deadman-wait
    section: observe
    tier: 1
    question: DMS 的等待時間算過嗎
    signal: 等待 > 4 × max(resend, E) + repeat_interval + group_interval；要更快就靠外部 up
    metrics: []
    evaluate_on: interview
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat, p-alert-validuntil]
    upstream: { status: no }
    rules: []
    contract: deadman-wait

  - id: federation
    section: observe
    tier: 2
    question: Prometheus 的 up、scrape_duration、ALERTS_FOR_STATE 有 federate 過來嗎
    signal: meta 上查得到這些 series（它們不在 /metrics）
    metrics: [up, scrape_duration_seconds, ALERTS_FOR_STATE]
    evaluate_on: observer
    evidence: code
    source: art-prom
    refs: [p-scrape-report]
    upstream: { status: no }
    applies_when: prometheus in env
    rules: []

  - id: k8s-sources
    section: observe
    tier: 2
    question: K8s 有 cAdvisor、kube-state-metrics、PVC 用量嗎
    signal: meta 上查得到 container_*、kube_pod_*、kubelet_volume_stats_*
    metrics: [container_memory_working_set_bytes, kube_pod_container_resource_limits, kubelet_volume_stats_available_bytes]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-k8s]
    upstream: { status: no }
    applies_when: kubernetes
    rules: []

blind_spots:
  - what: Meta 與被監控對象是否真的在不同故障域
    category: other
    why: 節點、儲存、叢集的擺放沒有 metric，只能盤點
    workaround: 訪談與部署設定盤點（failure-domain）
    options: "建議：把 meta 與受測對象的 node、PV、叢集寫進環境設定檔，rule review 時比對"
  - what: 外部 dead man's switch 服務本身停機
    category: other
    why: DMS 是監控鏈的最後一段，沒有更外層的觀察者
    workaround: DMS 服務自己的狀態頁或通知
    options: "建議：兩套 DMS（不同供應商），或兩台 meta 互相監控"
