id: prometheus
name: Prometheus
kind: infra
family: prometheus
status: stable
stages: [collect, store, query, evaluate, notify]
versions_checked: ["2.51.2", "2.55.1", "3.13.5", "3.15.1"]
role: >-
  採集、儲存、查詢、評估、送出通知都在同一個行程，共用 CPU、記憶體與磁碟。
  一個資源出問題，負責偵測的部分會一起受影響，所以它不能只監控自己。
architecture: architecture/prometheus.md

silent_failures:
  - text: "Scrape 耗時（`scrape_duration_seconds`）超過 `scrape_interval` 時 tick 被丟掉，實際間隔拉長，`for` 反覆重置、alert 永遠不 firing；這時 `prometheus_rule_evaluation_failures_total` 是 0，`up` 是 1。"
    evidence: tested
    source: art-prom
    refs: [exp-prom-silent, p-alert-delete]
  - text: "Rule group 耗時（`prometheus_rule_group_last_duration_seconds`）超過這個 group 的 `evaluation_interval` 時跳過 evaluation，`/api/v1/rules` 的 `health` 仍是 `ok`。"
    evidence: tested
    source: art-prom
    refs: [exp-prom-cpu, p-group-missed]
  - text: 磁碟寫滿再釋放空間後，寫入看似恢復，WAL 已留下半筆紀錄，要到下一次 checkpoint 才失敗。
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage]
  - text: 可用空間被 compaction 用完時 reload 停止，retention 不再執行。
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage, p-db-run]
  - text: "Crash loop 時 `vector(1)` 與不帶 `for` 的 heartbeat 每次啟動都立刻恢復。"
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]

contracts:
  - scrape-within-interval
  - range-window
  - group-within-interval
  - lookback
  - resend-endsat

signals:
  - id: prometheus-down
    tier: 1
    question: 行程活著嗎
    signal: 'up{job="prometheus"} == 0，加上 absent(up{job="prometheus"})'
    metrics: [up]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]
    upstream: { status: no, note: "mixin 預設由外部負責，沒有提供規則" }
    rules: [rules/prometheus/meta.yml#PrometheusDown, rules/prometheus/meta.yml#PrometheusMissing]

  - id: watchdog
    tier: 1
    question: 評估 → 通知 → 接收端整條活著嗎
    signal: Watchdog（vector(1)）走專屬短週期路由送到外部 dead man's switch
    metrics: []
    evaluate_on: self
    judged_by: external
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat, p-alert-validuntil]
    upstream: { status: partial, note: "kps 有 Watchdog；路由與外部接收端要自己確認" }
    rules: [rules/prometheus/canary.yml#Watchdog]

  - id: job-freshness
    tier: 1
    question: 每個關鍵 job 都有新資料嗎
    signal: >-
      每個關鍵 job（包括 mysql、postgres 這類 target job）都要有 up{job="X"} == 0 加上 absent(up{job="X"})，
      再加一條 time() - max(timestamp(M{job="X"})) 的資料 heartbeat。不能只靠 exporter 自己的 *_up：
      exporter 停機時它會整條消失
    metrics: [up]
    evaluate_on: self
    judged_by: external
    silent_failure: mysqld_exporter 與 postgres_exporter 停機時，mysql_up == 0、pg_up == 0 都回傳空
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat, exp-mysql, exp-pg]
    upstream: { status: no, note: "awesome 只有 Prometheus 自己的 job missing；DB mixin 只看 *_up" }
    rules:
      - rules/prometheus/canary.yml#DataHeartbeatMyJob
      - rules/prometheus/targets.yml#TargetJobDown
      - rules/prometheus/targets.yml#TargetJobMissing

  - id: known-true-canary
    tier: 1
    question: 依賴真實資料的判斷會成立嗎
    signal: 已知成立、帶 for 的 canary，放在和真實 rule 相同負載的 group
    metrics: []
    evaluate_on: self
    judged_by: external
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]
    upstream: { status: no }
    rules: [rules/prometheus/canary.yml#KnownTrueCanary]

  - id: rule-group-ratio
    tier: 1
    question: Rule group 跑得完嗎
    signal: "`prometheus_rule_group_last_duration_seconds` ÷ `prometheus_rule_group_interval_seconds` > 0.8；已經跳過的次數看 `prometheus_rule_group_iterations_missed_total`"
    metrics:
      - prometheus_rule_group_last_duration_seconds
      - prometheus_rule_group_interval_seconds
      - prometheus_rule_group_iterations_missed_total
      - prometheus_rule_group_last_evaluation_timestamp_seconds
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-cpu, p-group-missed]
    upstream: { status: partial, note: "mixin 只有 missed；awesome 比值超過 1 才響，這時已經開始跳過" }
    rules:
      - rules/prometheus/meta.yml#RuleGroupNearInterval
      - rules/prometheus/meta.yml#RuleGroupMissingEvaluations
      - rules/prometheus/meta.yml#RuleGroupStale
    contract: group-within-interval

  - id: rule-failures
    tier: 1
    question: Rule 有沒有評估失敗
    signal: prometheus_rule_evaluation_failures_total 增加
    metrics: [prometheus_rule_evaluation_failures_total]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage]
    upstream: { status: yes }
    rules: [rules/prometheus/meta.yml#RuleEvaluationFailures]

  - id: notify-to-alertmanager
    tier: 1
    question: 送得到 Alertmanager 嗎
    signal: notifications_errors_total、dropped_total 增加，或 alertmanagers_discovered < 1
    metrics:
      - prometheus_notifications_errors_total
      - prometheus_notifications_dropped_total
      - prometheus_notifications_alertmanagers_discovered
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat, p-notifier-sendall]
    upstream: { status: yes }
    rules:
      - rules/prometheus/meta.yml#NotificationsFailing
      - rules/prometheus/meta.yml#NotificationsDropped
      - rules/prometheus/meta.yml#NoAlertmanagerDiscovered

  - id: notify-early-warning
    tier: 2
    question: 通知在丟之前有沒有先變慢、堆積
    signal: "queue_length ÷ queue_capacity > 0.5、errors ÷ sent > 1%、latency p99 > 5s；丟棄看 dropped_total（第 1 級）"
    metrics:
      - prometheus_notifications_queue_length
      - prometheus_notifications_queue_capacity
      - prometheus_notifications_errors_total
      - prometheus_notifications_sent_total
      - prometheus_notifications_latency_seconds
      - prometheus_notifications_dropped_total
    evaluate_on: observer
    evidence: code
    source: art-prom
    refs: [p3-mixin-queue-full, p3-mixin-errors-some, p3-notifier-metrics, p3-notifier-capacity, p3-notifier-latency, p3-notifier-drop, p251-notifier-drop, p-notifier-sendall]
    upstream: { status: partial, note: "mixin 有 queue 快滿與部分 Alertmanager 錯誤率，沒有延遲" }
    rules:
      - rules/prometheus/meta.yml#NotificationQueueFilling
      - rules/prometheus/meta.yml#NotificationErrorRatio
      - rules/prometheus/meta.yml#NotificationLatencyHigh
    contract: resend-endsat

  - id: wal-write-failed
    tier: 1
    question: 資料和 rule 結果寫得進去嗎
    signal: prometheus_tsdb_wal_writes_failed_total 增加
    metrics: [prometheus_tsdb_wal_writes_failed_total]
    evaluate_on: observer
    silent_failure: 磁碟寫滿時 Watchdog 不受影響
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage, p-wal-log]
    upstream: { status: no, note: "mixin 與 awesome 都沒有" }
    rules: [rules/prometheus/meta.yml#WALWriteFailed]

  - id: crash-loop
    tier: 1
    question: 有沒有反覆重啟
    signal: changes(process_start_time_seconds[15m]) > 2
    metrics: [process_start_time_seconds]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat, exp-prom-mem]
    upstream: { status: partial, note: "mixin 只有 HA group 版；awesome 有" }
    rules: [rules/prometheus/meta.yml#PrometheusCrashLooping]

  - id: for-reset
    tier: 2
    question: Alert 的 for 有沒有反覆重置
    signal: changes(ALERTS_FOR_STATE[1h])
    metrics: [ALERTS_FOR_STATE]
    evaluate_on: federate
    silent_failure: Rule 沒報錯但永遠無法 firing 時，只有這個訊號會動
    evidence: tested
    source: art-prom
    refs: [exp-prom-silent, p-alert-delete]
    upstream: { status: no }
    rules: [rules/prometheus/meta.yml#AlertForTimerResetting]
    contract: range-window

  - id: scrape-ratio
    tier: 2
    question: Scrape 耗時接近 scrape_interval 了嗎
    signal: "`scrape_duration_seconds` ÷ `scrape_interval`（`/api/v1/targets` 的 `scrapeInterval`）；實際間隔看 `prometheus_target_interval_length_seconds`"
    metrics: [scrape_duration_seconds, prometheus_target_interval_length_seconds]
    evaluate_on: federate
    evidence: tested
    source: art-prom
    refs: [exp-prom-silent, p-scrape-run]
    upstream: { status: partial, note: "awesome 用 interval_length 的 p90/p50 比值" }
    rules:
      - rules/prometheus/meta.yml#ScrapeSlowerThanInterval
      - rules/prometheus/meta.yml#ScrapeIntervalStretched
    contract: scrape-within-interval

  - id: query-slots
    tier: 2
    question: 查詢 slot 滿了嗎
    signal: prometheus_engine_queries / prometheus_engine_queries_concurrent_max；queue_time
    metrics:
      - prometheus_engine_queries
      - prometheus_engine_queries_concurrent_max
      - prometheus_engine_query_duration_seconds
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-query, p-engine-queue]
    upstream: { status: yes, note: "mixin PrometheusHighQueryLoad" }
    rules: [rules/prometheus/meta.yml#QueryQueueing]

  - id: tsdb-maintenance
    tier: 2
    question: TSDB 維護停了嗎
    signal: compaction 或 checkpoint 失敗、reloads_total 停止增加、Head 未落成 block
    metrics:
      - prometheus_tsdb_compactions_failed_total
      - prometheus_tsdb_checkpoint_creations_failed_total
      - prometheus_tsdb_reloads_total
      - prometheus_tsdb_reloads_failures_total
      - prometheus_tsdb_wal_truncations_total
      - prometheus_tsdb_wal_truncations_failed_total
      - prometheus_tsdb_head_truncations_total
      - prometheus_tsdb_head_max_time_seconds
      - prometheus_tsdb_head_min_time_seconds
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage, p-db-run, p3-mixin-reloads-failing, p3-db-run, p3-compact-failed, p3-reload-failed, p3-reload-corrupted, p3-checkpoint-fail, p3-wal-truncate-call, p3-wal-truncate-metrics, p3-head-truncations, p3-blocks-bytes]
    upstream: { status: partial, note: "mixin 有 reload 與 compaction 失敗（PrometheusTSDBReloadsFailing），沒有「停止」與 WAL 截斷" }
    rules:
      - rules/prometheus/meta.yml#WALCheckpointFailing
      - rules/prometheus/meta.yml#CompactionFailing
      - rules/prometheus/meta.yml#BlockReloadStalled
      - rules/prometheus/meta.yml#HeadNotCompacting
      - rules/prometheus/meta.yml#BlockReloadFailing
      - rules/prometheus/meta.yml#RetentionBlockedByCompaction
      - rules/prometheus/meta.yml#WALNotTruncated
      - rules/prometheus/meta.yml#WALTruncationFailing

  - id: size-retention
    tier: 2
    question: Size retention 有在作用、而且沒有刪太多嗎
    signal: "blocks＋WAL＋Head chunk 用量超過 `prometheus_tsdb_retention_limit_bytes`（retention 沒在作用）；`size_retentions_total` 增加（保留期比 time retention 短）"
    metrics:
      - prometheus_tsdb_storage_blocks_bytes
      - prometheus_tsdb_wal_storage_size_bytes
      - prometheus_tsdb_head_chunks_storage_size_bytes
      - prometheus_tsdb_retention_limit_bytes
      - prometheus_tsdb_size_retentions_total
    evaluate_on: observer
    evidence: code
    source: art-prom
    refs: [p3-size-retention-wal, p3-head-size, p3-size-retention-count, p3-retention-limit-bytes, p3-blocks-bytes, p3-retention-size-flag]
    upstream: { status: no }
    applies_when: "有設 storage.tsdb.retention.size"
    rules:
      - rules/prometheus/meta.yml#PrometheusStorageOverSizeLimit
      - rules/prometheus/meta.yml#PrometheusSizeRetentionDeleting

  - id: disk-free
    tier: 2
    question: 資料目錄還有空間嗎
    signal: "node_exporter 的 `node_filesystem_avail_bytes`（K8s 用 `kubelet_volume_stats_available_bytes`）低於 15% 或 24 小時內用完；Prometheus 自己的 metric 沒有磁碟剩餘空間"
    metrics: [node_filesystem_avail_bytes, node_filesystem_size_bytes, kubelet_volume_stats_available_bytes, kubelet_volume_stats_capacity_bytes]
    evaluate_on: observer
    evidence: inferred
    source: art-prom
    refs: [exp-prom-storage]
    upstream: { status: partial, note: "node_exporter mixin 有通用的磁碟規則，沒有綁 Prometheus 資料目錄" }
    rules:
      - rules/prometheus/meta.yml#PrometheusDiskLow
      - rules/prometheus/meta.yml#PrometheusPVCLow

  - id: memory-limit
    tier: 2
    question: 記憶體接近 limit 了嗎
    signal: container working set ÷ memory limit > 0.8（cAdvisor 加 kube-state-metrics）
    metrics: [container_memory_working_set_bytes, kube_pod_container_resource_limits]
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-mem, exp-prom-k8s]
    upstream: { status: no }
    rules: [rules/prometheus/meta.yml#PrometheusMemoryNearLimit]

  - id: root-cause
    tier: 3
    question: 根因與容量
    signal: Retention 落後、WAL fsync、WAL 啟動修復、CPU throttling、設定 reload
    metrics:
      - prometheus_tsdb_lowest_timestamp_seconds
      - prometheus_tsdb_retention_limit_seconds
      - prometheus_tsdb_wal_fsync_duration_seconds
      - prometheus_tsdb_wal_corruptions_total
      - prometheus_config_last_reload_successful
    evaluate_on: observer
    evidence: tested
    source: art-prom
    refs: [exp-prom-storage, exp-prom-cpu]
    upstream: { status: partial }
    rules:
      - rules/prometheus/meta.yml#RetentionBehind
      - rules/prometheus/meta.yml#WALFsyncSlow
      - rules/prometheus/meta.yml#WALRepairedAtStartup
      - rules/prometheus/meta.yml#PrometheusCPUThrottled
      - rules/prometheus/meta.yml#PrometheusConfigReloadFailed
