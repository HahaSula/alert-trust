# postgres_exporter 卡引用的來源。key 一律以 pg- 開頭，避免和其他 target 衝突。
sources:
  pg-lab:
    title: postgres_exporter 信任實驗（lab/targets/postgres）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/postgres
    checked: "2026-11-08, exporter v0.20.1, PostgreSQL 16, Prometheus v3.13.5"
    note: results/summary.txt 是摘要，run.txt 與 run2.txt 是原始輸出
  pg-exporter-collector:
    title: postgres_exporter collector/collector.go（pg_scrape_collector_*、每次 scrape 開新連線）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/collector/collector.go
    checked: "2026-11-08, v0.20.1"
  pg-exporter-legacy:
    title: postgres_exporter exporter/（pg_up、pg_exporter_*、queries.yaml、auto-discover）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/exporter/postgres_exporter.go
    checked: "2026-11-08, v0.20.1"
    note: pg_up 的判斷在 scrape()，連線重用在 server.go 的 GetServer，自訂查詢失敗在 namespace.go
  pg-exporter-probe:
    title: postgres_exporter /probe（multi-target）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/cmd/postgres_exporter/probe.go
    checked: "2026-11-08, v0.20.1"
    note: 程式內註明 TODO Timeout；collector/probe.go 用 context.TODO()，沒有收集逾時
  pg-exporter-replication:
    title: postgres_exporter collector/pg_replication.go
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/collector/pg_replication.go
    checked: "2026-11-08, v0.20.1"
    note: receive_lsn 等於 replay_lsn 時 lag 直接回 0
  pg-exporter-collectors:
    title: postgres_exporter collector 目錄（預設開關、版本分支）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/tree/v0.20.1/collector
    checked: "2026-11-08, v0.20.1"
    note: pg_stat_bgwriter.go 在 17 以上不再輸出 checkpoint 欄位；pg_stat_checkpointer、database_wraparound、stat_wal_receiver、postmaster、stat_statements 預設關閉
  pg-exporter-readme:
    title: postgres_exporter README
    kind: upstream-doc
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/README.md
    checked: "2026-11-08, v0.20.1"
  pg-mixin:
    title: postgres_mixin alerts
    kind: upstream-rules
    visibility: public
    url: https://github.com/prometheus-community/postgres_exporter/blob/v0.20.1/postgres_mixin/alerts/postgres.libsonnet
    checked: "2026-11-08, v0.20.1"
  pg-awesome:
    title: awesome-prometheus-alerts PostgreSQL（postgres-exporter）
    kind: community-rules
    visibility: public
    url: https://github.com/samber/awesome-prometheus-alerts/blob/master/_data/rules.yml
    checked: "2026-11-08, master dff32bd"
  pg-docs-roles:
    title: PostgreSQL 文件：Predefined Roles（pg_monitor、pg_use_reserved_connections）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/current/predefined-roles.html
  pg-docs-wraparound:
    title: PostgreSQL 文件：Preventing Transaction ID Wraparound Failures
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-WRAPAROUND
  pg-target-lab:
    title: PostgreSQL 本體監控實驗（lab/targets/postgres/target：主從、slot、archive、連線、crash、promote、WAL 寫滿）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/postgres/target
    checked: "2026-11-08, exporter v0.20.1, PostgreSQL 16.15 與 17.11, Prometheus v3.13.5"
    note: "results/summary.txt 是摘要；run-20261108.txt、run2-20261108.txt、run3-20261108.txt 是原始輸出"
  pg-docs-monitoring:
    title: PostgreSQL 文件：The Cumulative Statistics System（pg_stat_replication、pg_stat_wal_receiver、pg_stat_archiver、pg_stat_checkpointer）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/monitoring-stats.html
  pg-docs-replication:
    title: PostgreSQL 文件：Replication 設定（synchronous_standby_names、max_slot_wal_keep_size）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/runtime-config-replication.html
  pg-docs-archiving:
    title: PostgreSQL 文件：Continuous Archiving（archive_command 失敗時 WAL 不會回收）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/continuous-archiving.html
  pg-docs-connections:
    title: PostgreSQL 文件：Connection Settings（max_connections、superuser_reserved_connections、reserved_connections）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/runtime-config-connection.html
  pg-docs-statements:
    title: PostgreSQL 文件：pg_stat_statements
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/pgstatstatements.html
  pg-docs-amcheck:
    title: PostgreSQL 文件：amcheck 與 pg_index.indisvalid（索引損毀、建索引失敗）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/amcheck.html
  pg-source:
    title: PostgreSQL 原始碼（REL_17_11、REL_16_15）
    kind: upstream-code
    visibility: public
    url: https://github.com/postgres/postgres/tree/REL_17_11
    checked: "2026-11-08, REL_17_11 與 REL_16_15"
  # ---------- 九個面向補洞（cluster、protection、capacity、workload），2026-11-09 ----------
  pg-asp-lab:
    title: PostgreSQL 九個面向補洞實驗（lab/targets/postgres/aspects：archive 成敗、archive_mode、資料庫大小、session 錯誤計數）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/postgres/aspects
    checked: "2026-11-09, exporter v0.20.1, PostgreSQL 16.15 與 17.11"
    note: results/summary.txt 是摘要，run-20261109.txt 是原始輸出
  pg-docs-ha:
    title: PostgreSQL 文件：High Availability, Load Balancing, and Replication（failover 與 quorum commit）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/docs/17/high-availability.html
    note: "原始檔 doc/src/sgml/high-availability.sgml；「PostgreSQL does not provide the system software required to identify a failure on the primary」"
  pg-patroni:
    title: Patroni（REST API /metrics、leader lock 與 DCS）
    kind: upstream-code
    visibility: public
    url: https://github.com/patroni/patroni/tree/v4.1.5
    checked: "2026-11-09, v4.1.5（235fdb3）"
    note: "patroni/api.py 的 do_GET_metrics；patroni_primary 依 pg_is_in_recovery() 判斷，不是看誰拿到 leader lock"
  pg-patroni-docs:
    title: Patroni 文件：DCS failsafe mode、dynamic configuration（ttl、loop_wait）
    kind: upstream-doc
    visibility: public
    url: https://patroni.readthedocs.io/en/latest/dcs_failsafe_mode.html
  pg-repmgr:
    title: repmgr 文件（repmgrd 自動 failover、witness、repmgr cluster show）
    kind: upstream-doc
    visibility: public
    url: https://www.repmgr.org/docs/current/index.html
    note: 只讀文件，沒有核對原始碼；repmgr 沒有內建 Prometheus endpoint
  pg-autofailover:
    title: pg_auto_failover 文件（monitor 節點、pgautofailover.node 狀態機）
    kind: upstream-doc
    visibility: public
    url: https://pg-auto-failover.readthedocs.io/en/main/architecture.html
    note: 只讀文件，沒有核對原始碼；monitor 本身是單點，要另外監控
  pg-yugabyte-raft:
    title: YugabyteDB 文件：DocDB replication（每個 tablet 用 Raft）
    kind: upstream-doc
    visibility: public
    url: https://docs.yugabyte.com/preview/architecture/docdb-replication/replication/
    note: 只用來對照：分散式 PostgreSQL 相容資料庫才有內建共識；核心 PostgreSQL 沒有
  pg-pgbackrest-exporter:
    title: pgbackrest_exporter（woblerr）：pgbackrest_backup_since_last_completion_seconds、pgbackrest_exporter_status
    kind: upstream-code
    visibility: public
    url: https://github.com/woblerr/pgbackrest_exporter/tree/v0.25.0
    checked: "2026-11-09, v0.25.0（4cf845c）"
    note: 社群 exporter，不是 pgBackRest 官方；WAL-G、Barman 沒有對等的 exporter 時用 textfile collector 輸出最後成功時間
  pg-node-exporter-fs:
    title: node_exporter collector/filesystem_common.go（node_filesystem_avail_bytes）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus/node_exporter/blob/v1.12.1/collector/filesystem_common.go
    checked: "2026-11-09, v1.12.1"
