# 其他資料庫版本差異頁（docs/targets/versions/）用到的來源。原始碼參考在 catalog/refs.d/versions-other.yaml。
sources:
  ver-pg-versioning:
    title: PostgreSQL Versioning Policy（各主版本的最新 minor 與 EOL）
    kind: upstream-doc
    visibility: public
    url: https://www.postgresql.org/support/versioning/
    checked: "2026-11-10"
    note: "支援中 14–18（14 在 2026-11-12 EOL）；13 已在 2025-11-13 EOL；19 只有 RC1 tag"
  ver-pg-tags:
    title: postgres/postgres 的 tag 列表（各線最新 REL_13_23、REL_14_24、REL_15_19、REL_16_15、REL_17_11、REL_18_6）
    kind: upstream-code
    visibility: public
    url: https://github.com/postgres/postgres/tags
    checked: "2026-11-10"
  ver-mongo-lifecycle:
    title: MongoDB Software Lifecycle Schedules（Server 各版本 EOL）
    kind: upstream-doc
    visibility: public
    url: https://www.mongodb.com/legal/support-policy/lifecycles
    checked: "2026-11-10"
    note: "6.0 EOL 2025-07-31、7.0 2027-08-31、8.0 2029-10-31、8.2 2026-07-31、8.3 2029-10-31、9.0 2031-10-31"
  ver-mongo-tags:
    title: mongodb/mongo 的 tag 列表（r6.0.29、r7.0.45、r8.0.34、r8.2.12；另有 r8.3.13、r9.0.4）
    kind: upstream-code
    visibility: public
    url: https://github.com/mongodb/mongo/tags
    checked: "2026-11-10"
  ver-kv-tags:
    title: valkey-io/valkey 與 redis/redis 的 tag 列表
    kind: upstream-code
    visibility: public
    url: https://github.com/valkey-io/valkey/tags
    checked: "2026-11-10, Valkey 7.2.15、8.0.12、8.1.11、9.0.7、9.1.3；Redis 7.2.17、7.4.12、8.0.6、8.2.11、8.4.8、8.10.3"
    note: Redis 的 tag 在 https://github.com/redis/redis/tags
  ver-etcd-changelog:
    title: etcd CHANGELOG（CHANGELOG-3.4／3.5／3.6／3.7，main 分支）
    kind: upstream-doc
    visibility: public
    url: https://github.com/etcd-io/etcd/tree/main/CHANGELOG
    checked: "2026-11-10, main@d622ec5"
  ver-etcd-branch:
    title: etcd 分支管理（只維護最新兩個 stable minor）
    kind: upstream-doc
    visibility: public
    url: https://github.com/etcd-io/etcd/blob/main/Documentation/contributor-guide/branch_management.md
    checked: "2026-11-10, main@d622ec5"
  ver-tidb-rules:
    title: TiDB／TiKV／PD 官方 alert 規則（pkg/metrics/alertmanager、metrics/alertmanager），v7.5.8、v8.1.2、v8.5.8 逐檔 diff
    kind: upstream-rules
    visibility: public
    url: https://github.com/tikv/pd/blob/v8.5.8/metrics/alertmanager/pd.rules.yml
    checked: "2026-11-10"
    note: "PD 與 TiKV 的規則在 8.1.2 和 8.5.8 完全相同；TiDB 的在 8.5 多一條 TiDB_auto_analyze_failed"
  ver-yb-releases:
    title: YugabyteDB releases（各 stable 線的類型、維護結束與 EOL）
    kind: upstream-doc
    visibility: public
    url: https://docs.yugabyte.com/preview/releases/ybdb-releases/
    checked: "2026-11-10"
    note: "支援中：2024.2 LTS、2025.1 STS、2025.2 LTS、2026.1 STS；2.20 LTS 在 2026-05-13 EOL、2024.1 在 2026-03-07 EOL"
  ver-ch-security:
    title: ClickHouse SECURITY.md（有安全更新的版本）
    kind: upstream-doc
    visibility: public
    url: https://github.com/ClickHouse/ClickHouse/blob/v26.10.2.103-stable/SECURITY.md
    checked: "2026-11-10, v26.10.2.103-stable"
