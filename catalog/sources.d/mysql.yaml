# mysqld_exporter 目標卡新增的來源。共用的 mysqld-mixin、mysqld-exporter-src、awesome 在 catalog/sources.yaml。
sources:
  art-mysql:
    title: mysqld_exporter 輕量實驗（MariaDB 11.4）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/mysql
    checked: "2026-11-08, mariadb:11.4、prom/mysqld-exporter:v0.21.0、prom/prometheus:v3.13.5"
    note: 正常、停資料庫、停 exporter、收回權限四個情境；結果在 results/
  mysqld-exporter-readme:
    title: mysqld_exporter README（權限、多 target、collector 旗標）
    kind: upstream-doc
    visibility: public
    url: https://github.com/prometheus/mysqld_exporter/blob/main/README.md
    checked: "2026-11-08, main（v0.21.0）"
  mysqld-exporter-main:
    title: mysqld_exporter.go 與 probe.go（timeout-offset、/probe）
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus/mysqld_exporter/blob/main/probe.go
    checked: "2026-11-08, main（v0.21.0）"
    note: getScrapeTimeoutSeconds 在 mysqld_exporter.go；預設 offset 0.25s
  mysqld-exporter-slave-status:
    title: mysqld_exporter collector/slave_status.go
    kind: upstream-code
    visibility: public
    url: https://github.com/prometheus/mysqld_exporter/blob/main/collector/slave_status.go
    checked: "2026-11-08, main（v0.21.0）"
    note: 依序試 SHOW ALL SLAVES STATUS、SHOW SLAVE STATUS、SHOW REPLICA STATUS；metric 名稱直接取欄位名
  mysql-84-removed:
    title: MySQL 8.4 移除的功能（SHOW SLAVE STATUS 等）
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/mysql-nutshell.html
  mariadb-replica-monitor:
    title: MariaDB SHOW REPLICA STATUS 與 REPLICA MONITOR 權限
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-replica-status
  art-mysql-ha:
    title: MySQL 8.4／MariaDB 11.4 target-facing 實驗（primary + async replica）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/mysql/ha
    checked: "2026-11-08, mariadb:11.4（11.4.13）、mysql:8.4.7、prom/mysqld-exporter:v0.21.0、prom/prometheus:v3.13.5"
    note: 長交易、deadlock、三種延遲、replication 中斷、semi-sync 退回、連線打滿、primary 被 kill、failover；結果在 ha/results/
  art-mysql-perf:
    title: MySQL 8.4／MariaDB 11.4 效能與故障情境（慢查詢、row lock、metadata lock、purge、CPU、buffer pool、暫存表、redo、連線風暴、磁碟滿、OOM）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/mysql/perf
    checked: "2026-11-09, mariadb:11.4（11.4.13）、mysql:8.4.7、prom/mysqld-exporter:v0.21.0、prom/prometheus:v3.13.5"
    note: 兩種資料庫各一台、同時跑同一組情境；結果在 perf/results/
  mysql-server-src:
    title: MySQL Server 8.4.7 原始碼（Seconds_Behind_Source、保留連線）
    kind: upstream-code
    visibility: public
    url: https://github.com/mysql/mysql-server/tree/mysql-8.4.7
    checked: "2026-11-08, mysql-8.4.7"
  mariadb-server-src:
    title: MariaDB Server 11.4.13 原始碼（Innodb_deadlocks、Connection_errors_max_connections）
    kind: upstream-code
    visibility: public
    url: https://github.com/MariaDB/server/tree/mariadb-11.4.13
    checked: "2026-11-08, mariadb-11.4.13"
  mysql-full-disk:
    title: MySQL 8.4 手冊：磁碟滿時 MySQL 怎麼處理
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/full-disk.html
    checked: "2026-11-08"
    note: 寫入不報錯，每分鐘檢查一次空間並寫 error log；binlog 或 relay log 也一樣
  mysql-force-recovery:
    title: MySQL 8.4 手冊：innodb_force_recovery
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/forcing-innodb-recovery.html
    checked: "2026-11-08"
  mysql-status-vars:
    title: MySQL 8.4 手冊：server status variables
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/server-status-variables.html
    checked: "2026-11-08"
    note: Slow_queries 不管 slow log 有沒有開都計數；Connection_errors_max_connections；Created_tmp_disk_tables
  mysql-show-replica-status:
    title: MySQL 8.4 手冊：SHOW REPLICA STATUS（Seconds_Behind_Source 的定義）
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/show-replica-status.html
    checked: "2026-11-08"
  mysql-semisync:
    title: MySQL 8.4 手冊：semisynchronous replication 監控
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/replication-semisync-monitoring.html
    checked: "2026-11-08"
  mysql-too-many-connections:
    title: MySQL 8.4 手冊：Too many connections 與保留的管理連線
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/too-many-connections.html
    checked: "2026-11-08"
  mysql-gtid-functions:
    title: MySQL 8.4 手冊：GTID_SUBSET 與 errant transaction 檢查
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/gtid-functions.html
    checked: "2026-11-08"
  mariadb-gtid:
    title: MariaDB GTID（gtid_slave_pos、gtid_strict_mode）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/gtid/
    checked: "2026-11-08"
  mariadb-perfschema:
    title: MariaDB Performance Schema 概觀（預設關閉）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/performance-schema-overview/
    checked: "2026-11-08"
  # ---- 九個面向補缺（cluster、protection、capacity、maintenance）與 MariaDB ASH 頁 ----
  art-mysql-asp:
    title: MySQL 8.4 Group Replication、MariaDB Galera、binlog 保留、auto_increment 與 ASH 取樣器的輕量實驗
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/mysql/ash
    checked: "2026-11-09, mariadb:11.4（11.4.13、galera-4 26.4.27）、mysql:8.4.7、prom/mysqld-exporter:v0.21.0"
    note: GR 三台暫停兩台、Galera 三台暫停兩台、flow control 嘗試、MariaDB 無 replica 時的 binlog 過期、MySQL information_schema 統計快取、每秒取樣 PROCESSLIST＋performance_schema
  mysql-gr-monitoring:
    title: MySQL 8.4 手冊：Group Replication 監控（replication_group_members、member_stats、成員狀態）
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/group-replication-monitoring.html
    checked: "2026-11-09"
  mysql-gr-partition:
    title: MySQL 8.4 手冊：Group Replication 網路分割與失去多數
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/group-replication-network-partitioning.html
    checked: "2026-11-09"
    note: 多數成員 UNREACHABLE 時群組擋住寫入，要人用 group_replication_force_members 處理或等成員回來
  mysql-gr-flow-control:
    title: MySQL 8.4 手冊：Group Replication flow control
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/group-replication-flow-control.html
    checked: "2026-11-09"
    note: Gr_flow_control_* 統計由 Enterprise 的 component 提供；8.4.7 社群版原始碼的 components/ 裡沒有這個 component
  galera-status-vars:
    title: MariaDB 手冊：Galera Cluster status variables（wsrep_cluster_status、wsrep_flow_control_paused、wsrep_local_recv_queue）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/galera-cluster-status-variables/
    checked: "2026-11-09"
  galera-src:
    title: Galera 26.4.27 原始碼（replicator_smm_stats.cpp 的 wsrep_* 狀態變數）
    kind: upstream-code
    visibility: public
    url: https://github.com/codership/galera/tree/release_26.4.27
    checked: "2026-11-09, release_26.4.27（mariadb:11.4 映像內的 galera-4 版本）"
  mysql-pitr:
    title: MySQL 8.4 手冊：用 binlog 做 point-in-time recovery
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/point-in-time-recovery.html
    checked: "2026-11-09"
  mariadb-binlog-purge:
    title: MariaDB 手冊：binlog 的保留與刪除（binlog_expire_logs_seconds、max_binlog_total_size、slave_connections_needed_for_purge）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/using-and-maintaining-the-binary-log/
    checked: "2026-11-09"
  node-exporter-textfile:
    title: node_exporter textfile collector（批次工作把 metric 寫成檔案）
    kind: tool
    visibility: public
    url: https://github.com/prometheus/node_exporter#textfile-collector
    checked: "2026-11-09"
  mysql-is-stats-expiry:
    title: MySQL 8.4 手冊：information_schema_stats_expiry（TABLES 的統計值快取）
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/server-system-variables.html#sysvar_information_schema_stats_expiry
    checked: "2026-11-09"
  mariadb-show-explain:
    title: MariaDB 手冊：SHOW EXPLAIN／SHOW ANALYZE FOR <thread>（看執行中查詢的計畫）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/show-explain/
    checked: "2026-11-09"
  mariadb-slow-log-extended:
    title: MariaDB 手冊：slow query log 擴充統計（log_slow_verbosity）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/slow-query-log-extended-statistics/
    checked: "2026-11-09"
  mariadb-sys-schema:
    title: MariaDB 手冊：sys schema（10.6 起內建，資料來自 performance_schema）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/sys-schema/
    checked: "2026-11-09"
  query-exporter:
    title: query-exporter（把自訂 SQL 結果輸出成 Prometheus metric）
    kind: tool
    visibility: public
    url: https://github.com/albertodonato/query-exporter
    checked: "2026-11-09"
  mysql-admin-interface:
    title: MySQL 8.4 手冊：administrative connection interface（admin_address、admin_port、SERVICE_CONNECTION_ADMIN）
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/administrative-connection-interface.html
    checked: "2026-11-09"
  mysql-pfs-metadata-locks:
    title: MySQL 8.4 手冊：performance_schema.metadata_locks
    kind: upstream-doc
    visibility: public
    url: https://dev.mysql.com/doc/refman/8.4/en/performance-schema-metadata-locks-table.html
    checked: "2026-11-09"
  mariadb-metadata-lock-info:
    title: MariaDB 手冊：metadata_lock_info plugin（information_schema.METADATA_LOCK_INFO）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/metadata_lock_info-plugin/
    checked: "2026-11-09"
  mariadb-extra-port:
    title: MariaDB 手冊：thread pool 系統變數（extra_port、extra_max_connections）
    kind: upstream-doc
    visibility: public
    url: https://mariadb.com/kb/en/thread-pool-system-status-variables/
    checked: "2026-11-09"
