# redis_exporter（Valkey／Redis）卡引用的來源。key 一律以 vk- 開頭，避免和其他 target 衝突。
sources:
  vk-lab:
    title: Valkey／Redis 監控實驗（lab/targets/valkey）
    kind: experiment
    visibility: public
    url: https://github.com/HahaSula/alert-trust/tree/main/lab/targets/valkey
    checked: "2026-11-09, Valkey 9.1.3, Redis 7.2.17／8.10.3, redis_exporter v1.97.0, Prometheus v3.13.5"
    note: results/run-20261109.txt 是原始輸出，results/summary.md 是摘要
  vk-valkey-src:
    title: Valkey 9.1.3 原始碼（src/server.c 的 INFO、evict.c、rdb.c、replication.c、sentinel.c、cluster_legacy.c）
    kind: upstream-code
    visibility: public
    url: https://github.com/valkey-io/valkey/tree/9.1.3/src
    checked: "2026-11-09, 9.1.3"
  vk-redis-src:
    title: Redis 7.2.17（最後的 BSD 授權分支）與 8.10.3 原始碼
    kind: upstream-code
    visibility: public
    url: https://github.com/redis/redis/tree/7.2.17/src
    checked: "2026-11-09, 7.2.17, 8.10.3"
    note: 8.10.3 在 https://github.com/redis/redis/tree/8.10.3/src
  vk-exporter:
    title: redis_exporter v1.97.0 exporter/（INFO 欄位對照、scrape 流程、Sentinel、key group）
    kind: upstream-code
    visibility: public
    url: https://github.com/oliver006/redis_exporter/tree/v1.97.0/exporter
    checked: "2026-11-09, v1.97.0"
    note: 欄位對照表在 exporter.go 的 metricMapGauges／metricMapCounters；狀態字串 ok／err 在 metrics.go 轉成 1／0
  vk-exporter-readme:
    title: redis_exporter README（flag、multi-target、-script、key group）
    kind: upstream-doc
    visibility: public
    url: https://github.com/oliver006/redis_exporter/blob/v1.97.0/README.md
    checked: "2026-11-09, v1.97.0"
  vk-mixin:
    title: redis-mixin alerts（redis_exporter contrib）
    kind: upstream-rules
    visibility: public
    url: https://github.com/oliver006/redis_exporter/blob/v1.97.0/contrib/redis-mixin/alerts/redis.libsonnet
    checked: "2026-11-09, v1.97.0"
    note: 6 條：RedisDown、RedisOutOfMemory（要 --include-system-metrics）、RedisTooManyConnections、RedisClusterSlotFail／Pfail、RedisClusterStateNotOk
  vk-awesome:
    title: awesome-prometheus-alerts Redis（oliver006/redis_exporter）
    kind: community-rules
    visibility: public
    url: https://github.com/samber/awesome-prometheus-alerts/blob/dd70d7b66a4e9dbf14429aec244d543a2833390e/_data/rules.yml#L1687
    checked: "2026-11-09, commit dd70d7b"
  vk-otel:
    title: OpenTelemetry Collector redisreceiver（contrib v0.165.0）
    kind: upstream-code
    visibility: public
    url: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/v0.165.0/receiver/redisreceiver
    checked: "2026-11-09, v0.165.0"
    note: 只讀 INFO all 與 CLUSTER INFO；metadata.yaml 沒有 rdb_last_bgsave_status、aof_last_write_status、master_link_status
  vk-valkey-doc:
    title: valkey-doc 9.1.3（admin、latency、latency-monitor、replication、sentinel、lru-cache）
    kind: upstream-doc
    visibility: public
    url: https://github.com/valkey-io/valkey-doc/tree/9.1.3/topics
    checked: "2026-11-09, 9.1.3"
