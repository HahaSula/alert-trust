    question: 每個 Patroni 節點的 REST API 抓得到嗎
    signal: >-
      up{job="patroni"} == 0 與 absent(up{job="patroni"})。Patroni 的 /metrics 由 REST API 產生，不經過 postgres_exporter；
      每個 series 有 scope（叢集）與 name（節點）label，跨節點計數靠 scope，不必另加 cluster label
    metrics: [up, patroni_postgres_running]
