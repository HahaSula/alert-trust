    refs: [pg-asp-patroni-metrics, pg-asp-patroni-labels]
    upstream: { status: no, note: "Patroni 只提供 /metrics，沒有附 alert 規則" }
    rules: [rules/targets/postgres.yml#PatroniDown, rules/targets/postgres.yml#PatroniMissing]

  - id: patroni-leader
    aspect: cluster
    tier: 2
    question: 每個 Patroni 叢集剛好有一個 leader 嗎
    signal: >-
      leader lock 在 DCS：patroni_cluster_unlocked == 1 表示沒有人持有 lock。patroni_primary 看的是 pg_is_in_recovery()（文件寫「holds the leader lock」，程式不是），
      所以 count by (scope) (patroni_primary == 1) > 1 抓得到「lock 只有一個、PostgreSQL 卻有兩台可寫」的情況；= 0 且沒有 standby leader 是沒有主庫。
      和 postgres_exporter 的 role-detection（pg_replication_is_replica 依 cluster label 計數）互相印證
    metrics: [patroni_cluster_unlocked, patroni_primary, patroni_standby_leader, patroni_replica]
    evaluate_on: self
    applies_when: patroni
    silent_failure: 舊主庫的 Patroni 停了但 PostgreSQL 還在跑時，它的 patroni_primary 一起消失，只有 postgres_exporter 那邊的 PostgresMultiplePrimaries 看得到
    evidence: code
    source: pg-patroni
    refs: [pg-asp-patroni-primary, pg-asp-patroni-tl-lsn, pg-asp-patroni-unlocked, pg-asp-patroni-unlocked-metric, pg-asp-patroni-standby-leader, pg-asp-patroni-etcd-cas, pg-asp-patroni-demote-nolock]
    upstream: { status: no }
    rules: [rules/targets/postgres.yml#PatroniClusterUnlocked, rules/targets/postgres.yml#PatroniMultiplePrimaries, rules/targets/postgres.yml#PatroniNoPrimary]

  - id: patroni-dcs
    aspect: cluster
    tier: 2
    question: 每個節點還連得到 DCS 嗎
    signal: >-
      time() − patroni_dcs_last_seen > 2 × ttl（預設 ttl 30 秒）。Patroni 每次從 DCS 讀到叢集狀態就更新這個時間；
      主庫讀不到 DCS 時會自己降級（failsafe_mode 開著且所有成員都連得到時例外，這時 patroni_failsafe_mode_is_active == 1）。
      DCS（etcd、Consul）本身的 quorum 要用它自己的 metric 監控，例如 etcd 的 etcd_server_has_leader
    metrics: [patroni_dcs_last_seen, patroni_failsafe_mode_is_active]
    evaluate_on: self
    applies_when: patroni
    silent_failure: DCS 整個掛掉時所有節點同時降級成唯讀，PostgreSQL 本身與 postgres_exporter 都正常，pg_up=1
    evidence: code
    source: pg-patroni
    refs: [pg-asp-patroni-dcs-seen, pg-asp-patroni-dcs-seen-set, pg-asp-patroni-demote-dcs, pg-asp-patroni-failsafe, pg-asp-patroni-doc-dcs, pg-asp-patroni-doc-ttl]
    upstream: { status: no }
    rules: [rules/targets/postgres.yml#PatroniDcsUnreachable, rules/targets/postgres.yml#PatroniFailsafeActive]

  - id: patroni-paused
    aspect: cluster
    tier: 3
    question: 自動 failover 是不是被關掉了
    signal: patroni_is_paused == 1 持續超過維護時間（例子：1 小時）；pause 期間主庫掛掉不會自動 failover
    metrics: [patroni_is_paused]
    evaluate_on: self
    applies_when: patroni
    evidence: code
    source: pg-patroni
    refs: [pg-asp-patroni-paused]
    upstream: { status: no }
    rules: [rules/targets/postgres.yml#PatroniPaused]

  - id: patroni-timeline
    aspect: cluster
    tier: 3
    question: failover 之後每個節點都跟上新的 timeline 了嗎
    signal: >-
      依 scope 比較 patroni_postgres_timeline 的最大與最小值（排除 0＝沒在跑）。主庫的 timeline 取自目前 WAL 檔名，
      複本取 leader 的 timeline 或自己快取的值；不一致超過幾分鐘通常是舊主庫需要 pg_rewind 或重建
    metrics: [patroni_postgres_timeline]
    evaluate_on: self
    applies_when: patroni
    evidence: code
    source: pg-patroni
    refs: [pg-asp-patroni-timeline, pg-asp-patroni-tl-lsn, pg-asp-patroni-replica-tl]
    upstream: { status: no }
    rules: [rules/targets/postgres.yml#PatroniTimelineDiverged]

# 沒有 Patroni（或其他 HA 管理工具）的部署，cluster 面向沒有可監控的對象；上面的 patroni-* 訊號只在 applies_when: patroni 時適用。
not_applicable_aspects:
  cluster:
    why: >-
      只適用於純 PostgreSQL（沒有 Patroni 之類的 HA 管理工具）。核心 PostgreSQL 的 streaming replication 沒有共識、quorum 成員資格或自動選主：
      文件明寫 PostgreSQL 不提供偵測主庫故障並通知複本的軟體；提升只在 pg_ctl promote 或 pg_promote() 被呼叫時發生（寫 promote 信號檔）。
      synchronous_standby_names 的 ANY n（quorum）與 FIRST n（priority）只決定 commit 要等幾台 standby 回報，不選主、不隔離舊主庫。
      這種部署的「叢集」問題（誰是主庫、有沒有兩個主庫）在 replication 面向的 promotion 用 cluster label 計數。
      對照：YugabyteDB 這類分散式資料庫每個 tablet 用 Raft，才有 leader 與 quorum 可監控
    refs: [pg-asp-src17-doc-nofailover, pg-asp-src16-doc-nofailover, pg-asp-src17-promote, pg-asp-src16-promote, pg-asp-src17-doc-quorum, pg-asp-src17-syncrep-wait, pg-asp-src17-syncrep-method, pg-asp-src16-syncrep-quorum-def]

# 目前無法監控的範圍。category：exporter（資料庫有、exporter 沒輸出）、database（資料庫本身沒提供）、other（要靠其他元件）。
blind_spots:
  - what: 同步 standby 的狀態（`sync_state`、`synchronous_standby_names`）
    category: exporter
    why: exporter 沒有查；同步 standby 消失時 commit 會卡住
    workaround: 自訂查詢 `pg_stat_replication.sync_state`
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_replication_sync_standbys, pgq_replication_sync_required, pgq_replication_standbys]
      rules: [PostgresSyncStandbyMissing]
      refs: [pg-q-exp, pg-q-pg17-view-syncstate, pg-q-pg17-walsnd-quorum, pg-q-pg17-syncrep-gram-any, pg-q-qe-expire]
  - what: 時間延遲（`write_lag`、`flush_lag`、`replay_lag`）
    category: exporter
    why: exporter 沒有輸出；閒置時會變 NULL
    workaround: 自訂查詢，或 heartbeat 表
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_replication_write_lag_seconds, pgq_replication_flush_lag_seconds, pgq_replication_replay_lag_seconds]
      rules: [PostgresReplicationReplayLagHigh]
      refs: [pg-q-exp, pg-q-pg16-walsnd-lagnull, pg-trace-pg17-walsnd-lagnull, pg-q-qe-null-zero]
  - what: 誰擋住 vacuum（`backend_xid` 的 age、slot 的 `xmin`、prepared xacts）
    category: exporter
    why: exporter 沒有輸出
    workaround: 自訂查詢 `max(age(backend_xid))`、`max(age(xmin))`
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_oldest_backend_xid_age, pgq_oldest_backend_xmin_age, pgq_oldest_slot_xmin_age, pgq_oldest_slot_catalog_xmin_age, pgq_oldest_prepared_xact_age, pgq_prepared_xacts]
      rules: [PostgresXminHorizonHeld, PostgresPreparedXactLingering]
      refs: [pg-q-exp, pg-q-pg17-view-backendxid, pg-q-pg17-view-slot-xmin, pg-q-pg17-view-prepared]
  - what: "`archive_mode`、`archive_command`、`last_failed_wal`"
    category: exporter
    why: enum 與字串設定不輸出；關掉 archive 時看起來和剛啟動一樣
    workaround: 盤點時檢查，或自訂查詢輸出 0／1
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_archive_mode, pgq_archive_command_set, pgq_archive_failing, pgq_archive_ready_files]
      rules: [PostgresArchiveModeOff, PostgresArchiveCommandEmpty, PostgresArchiveLastAttemptFailed, PostgresArchiveBacklog]
      refs: [pg-q-exp, pg-q-pg17-archcmd-disabled, pg-q-pg17-archstatus-grant, pg-q-pg17-archstatus-dir]
  - what: 失效索引、checksum 失敗、timeline
    category: exporter
    why: exporter 沒有查
    workaround: 自訂查詢 `pg_index`、`pg_stat_database.checksum_failures`、`pg_control_checkpoint()`；排程 amcheck
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_invalid_indexes, pgq_checksum_failures_total, pgq_data_checksums_enabled, pgq_checkpoint_timeline_id]
      rules: [PostgresInvalidIndex, PostgresChecksumFailure, PostgresDataChecksumsOff, PostgresTimelineChanged]
      refs: [pg-q-exp, pg-q-pg17-indisvalid, pg-q-pg17-checksum-null, pg-q-pg17-control-tli]
  - what: "`pg_stat_wal`、`pg_stat_io`、`sessions_*`"
    category: exporter
    why: exporter 沒有查
    workaround: 自訂查詢（`sessions_*` 從 14 起有）
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_wal_bytes_total, pgq_wal_buffers_full_total, pgq_io_writes_total, pgq_io_fsyncs_total, pgq_db_sessions_killed_total, pgq_db_sessions_fatal_total, pgq_db_sessions_abandoned_total]
      rules: [PostgresWalBuffersFull, PostgresBackendsWritingBuffers, PostgresSessionsKilledOrFatal]
      refs: [pg-q-exp, pg-q-pg17-view-statwal, pg-q-pg17-view-statio, pg-q-pg17-view-sessions-killed]
  - what: 其他資料庫的表
    category: exporter
    why: stat_user_tables 只看 DSN 那一個資料庫
    workaround: 每個資料庫各設一個 DSN，或用 `/probe`
    section: targets/postgres.md#blind-spots
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/postgres.yaml
      metrics: [pgq_invalid_indexes, pgq_tables_over_vacuum_threshold, pgq_table_dead_tuples]
      rules: [PostgresTablesNeedVacuum]
      refs: [pg-q-exp, pg-q-qe-db-label]
  - what: SQL 錯誤數
    category: database
    why: 沒有任何 view 或函式計數 ERROR；pg_stat_database 只有 xact_rollback（含應用主動 ROLLBACK）與 sessions_fatal（只算連線層級），query-exporter 這類查詢工具補不了
    workaround: log 管線計數（log_min_messages、VictoriaLogs 或 mtail 依 SQLSTATE 計數）
    section: targets/postgres.md#blind-spots
  - what: 叢集共識（leader、quorum）
    category: database
    why: 核心 PostgreSQL 沒有共識機制
    workaround: Patroni 的 `/metrics`（`patroni-cluster` 規則組）
    section: targets/postgres.md#cluster
  - what: 磁碟剩餘空間
    category: other
    why: 不在資料庫裡；WAL 寫滿就停機
    workaround: node_exporter 的 `node_filesystem_avail_bytes`
    section: targets/postgres.md#capacity
  - what: base backup 的新鮮度
    category: other
    why: 沒有備份時 archive 再正常也還原不了
    workaround: pgbackrest_exporter；WAL-G、Barman 用 textfile
    section: targets/postgres.md#protection
