    source: art-mysql-ha
    refs: [exp-mysql-ha, my-innodb-metrics-name, my-trace-my-deadlock-mon, my-trace-my-deadlock-inc, my-trace-ex-im-total]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLDeadlocks]

  # ---------- 使用：連線、鎖、快取與暫存表 ----------
  - id: connections
    aspect: saturation
    section: misuse
    tier: 3
    question: 連線數接近上限了嗎
    signal: >-
      threads_connected / max_connections > 0.8；threads_running / max_connections > 0.6；
      真的被拒絕時看 connection_errors_total{error="max_connections"} 的增加量（滿載當下 exporter 自己也被擋，
      這個計數要等連線降下來才抓得到；實驗 +10）
    metrics:
      - mysql_global_status_threads_connected
      - mysql_global_status_threads_running
      - mysql_global_variables_max_connections
      - mysql_global_status_connection_errors_total
      - mysql_global_status_max_used_connections
    evaluate_on: self
    silent_failure: 連線打滿時 exporter 一般帳號也連不上，mysql_up 變 0、threads_connected 消失，比例規則回傳空，只剩 MySQLNotReachable
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, mysql-conn-reserved, my-trace-my-connerr-var, my-trace-my-connerr-inc]
    upstream: { status: partial, note: "awesome 有比例規則，沒有被拒絕的計數，也沒提到打滿時規則回傳空" }
    rules:
      - rules/targets/mysql.yml#MySQLTooManyConnections
      - rules/targets/mysql.yml#MySQLHighThreadsRunning
      - rules/targets/mysql.yml#MySQLConnectionsRefused
      - rules/targets/mysql.yml#MySQLConnectionsExhausted

  - id: thread-cache
    aspect: saturation
    section: misuse
    tier: 3
    question: 新連線都要現開 thread 嗎（thread cache 不夠）
    signal: >-
      rate(threads_created) / rate(connections) 長時間偏高：每條新連線都要建立 thread，表示 thread_cache_size 不夠或連線一直重建。
      Threads_created 只在 cache 裡沒有閒置 thread、建立新 thread 時加 1；thread_cache_size 沒設時自動是 8 + max_connections / 100（上限 100）。
      三條線（8.0.46、8.4.13、9.7.4）都有 Threads_created；global_status 照名稱輸出，不需要額外 collector。門檻是例子
    metrics:
      - mysql_global_status_threads_created
      - mysql_global_status_connections
      - mysql_global_variables_thread_cache_size
    evaluate_on: self
    silent_failure: >-
      只是速率比，沒有延遲：建立 thread 的成本要看 CPU；連線池（長連線）環境 connections 幾乎不增加，比例的分母很小，規則另外要求每秒至少 1 條新連線
    evidence: code
    source: mysql-server-src
    refs: [spl-my80-threads-created, spl-my84-threads-created, spl-my97-threads-created, spl-my84-thread-created-inc, spl-my84-connections, spl-my84-thread-cache-var, spl-my84-thread-cache-autosize, res-mx-default-gs, my-global-status-skip]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLThreadCacheMisses]

  - id: user-connection-limits
    aspect: saturation
    section: misuse
    tier: 3
    question: 個別帳號快碰到 MAX_USER_CONNECTIONS 了嗎
    signal: >-
      sys.user_summary 的 current_connections 除以 mysql.user 的 max_user_connections（> 0 的才算）。
      兩個 collector 都預設關；帳號 label 一個叫 user、一個叫 mysql_user，要 label_replace。
      超過上限的連線算進 Aborted_connects，不算進 Connection_errors_*。performance_schema 在 8.0／8.4／9.7 都預設開
    metrics: [mysql_sys_current_connections, mysql_mysql_max_user_connections, mysql_global_status_aborted_connects]
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-sys-user-summary, my-mysql-user-maxconn, ver-my-pfs-default-on]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLUserConnectionLimit]

  - id: lock-waits
    aspect: saturation
    section: misuse
    tier: 3
    question: 有很多 session 在等鎖嗎
    signal: >-
      InnoDB row lock：innodb_row_lock_current_waits（預設就有）。
      Metadata lock（DDL 卡住）不在任何 status 變數裡，只能從 processlist collector 的
      state="waiting_for_table_metadata_lock" 看到（預設關，要 PROCESS），見 metadata-locks。
      current_waits 最多等於應用的連線數：實驗中 8 條連線全部卡住時是 8，> 10 的門檻不會響；
      rate(innodb_row_lock_time) / 1000 是平均同時在等的 session 數，不受連線數上限影響。
      等鎖的 session 在 processlist 的 state 是 updating，不是 lock
    metrics:
      - mysql_global_status_innodb_row_lock_current_waits
      - mysql_global_status_innodb_row_lock_time
      - mysql_info_schema_processlist_threads
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-processlist-query, exp-mysql-perf, my-trace-my-rowlock-var, my-trace-my-rowlock-inc]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLRowLockWaits, rules/targets/mysql.yml#MySQLRowLockWaitTime]

  - id: slow-queries
    aspect: workload
    section: misuse
    tier: 3
    question: 有新的慢查詢嗎
    signal: >-
      increase(slow_queries[5m]) > 0。Slow_queries 依 long_query_time（預設 10 秒）計數，不管 slow log 有沒有開；
      要知道是哪個查詢，見 slow-sql-visibility。實驗中 long_query_time=0.5 時，兩個 client 跑 filesort 全表與 SLEEP(1)，30 秒內 +38
    metrics: [mysql_global_status_slow_queries]
    evaluate_on: self
    evidence: tested
    source: mysql-status-vars
    refs: [exp-mysql-perf, my-trace-my-slow]
    upstream: { status: yes }
    rules: [rules/targets/mysql.yml#MySQLSlowQueries]

  - id: innodb-pressure
    aspect: saturation
    section: misuse
    tier: 3
    question: InnoDB 在等磁碟或等 buffer pool 嗎
    signal: >-
      rate(innodb_log_waits) > 10（log buffer 不夠，不是 redo 檔案太小）；rate(innodb_buffer_pool_wait_free) > 0 持續 15 分鐘。
      8.4 改了 InnoDB 預設值（innodb_io_capacity、innodb_flush_method 等），從 8.0 升上來時門檻要重新取基準
    metrics:
      - mysql_global_status_innodb_log_waits
      - mysql_global_status_innodb_buffer_pool_wait_free
      - mysql_global_status_buffer_pool_pages
    evaluate_on: self
    evidence: code
    source: mysqld-exporter-src
    refs: [my-global-status-re, my-perf-my-log-waits, my-asp-my-bp-wait-free, res-my-flush-odirect]
    upstream: { status: partial, note: "mixin 有 log waits；buffer pool wait_free 沒有規則" }
    rules: [rules/targets/mysql.yml#MySQLInnoDBLogWaits, rules/targets/mysql.yml#MySQLBufferPoolWaitFree]

  - id: pending-fsyncs
    aspect: saturation
    section: misuse
    tier: 3
    question: InnoDB 的 fsync 在排隊嗎
    signal: >-
      Innodb_data_pending_fsyncs 是此刻還沒完成的 fsync 數（redo log 的 pending flush 加上 tablespace 的 pending flush），
      avg_over_time(...[10m]) > 1 代表每次 scrape 都有 fsync 在等磁碟。三條線（8.0.46、8.4.13、9.7.4）都是同一個算法。門檻是例子
    metrics: [mysql_global_status_innodb_data_pending_fsyncs]
    evaluate_on: self
    silent_failure: >-
      是 scrape 那一刻的快照，不是延遲：短暫的 fsync 尖峰在 scrape 之間看不到；fsync 延遲本身要看主機層的磁碟寫入時間（host 卡的 disk-latency）
    evidence: code
    source: mysql-server-src
    refs: [spl-my80-pending-fsyncs, spl-my84-pending-fsyncs, spl-my97-pending-fsyncs, spl-my84-pending-fsyncs-calc, res-mx-default-gs, my-global-status-skip]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLPendingFsyncs]

  - id: tmp-tables
    aspect: saturation
    section: misuse
    tier: 3
    question: 暫存表常常落到磁碟嗎
    signal: >-
      rate(created_tmp_disk_tables) / rate(created_tmp_tables) > 0.25。TempTable 引擎超過上限改用 InnoDB 磁碟表時也算在 Created_tmp_disk_tables 裡；
      9.7 另有 Count_hit_tmp_table_size（mysql_global_status_count_hit_tmp_table_size）
    metrics: [mysql_global_status_created_tmp_disk_tables, mysql_global_status_created_tmp_tables]
    evaluate_on: self
    evidence: upstream
    source: mysql-status-vars
    refs: [my-asp-my-tmp-disk, ver-my97-count-hit-tmp]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLTmpDiskTables]

  - id: table-open-cache
    aspect: saturation
    section: misuse
    tier: 3
    question: table_open_cache 夠用嗎
    signal: rate(table_open_cache_overflows) > 1；也可看 table_open_cache_misses 與 opened_tables 的增加速度
    metrics:
      - mysql_global_status_table_open_cache_overflows
      - mysql_global_status_table_open_cache_misses
      - mysql_global_status_opened_tables
    evaluate_on: self
    evidence: upstream
    source: mysql-status-vars
    refs: [my-asp-my-toc-overflows]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLTableOpenCacheOverflows]

  - id: aborted-connects
    aspect: workload
    section: misuse
    tier: 3
    question: 連線建立失敗變多了嗎
    signal: >-
      rate(aborted_connects) > 1；包含密碼錯、超過 MAX_USER_CONNECTIONS、握手逾時。
      被 max_connections 拒絕的連線在 MySQL 不算進 Aborted_connects（連線風暴實驗：connection_errors +4,040、aborted_connects +298），原因細分看 connection_errors_total{error}
    metrics: [mysql_global_status_aborted_connects, mysql_global_status_aborted_clients, mysql_global_status_connection_errors_total]
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, exp-mysql-perf, my-asp-my-aborted-connects]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLAbortedConnects]

  # ---------- 效能情境（lab/targets/mysql/perf）----------
  - id: throughput-drop
    aspect: workload
    section: misuse
    tier: 3
    question: 吞吐量（TPS／QPS）掉下來了嗎
    signal: >-
      rate(commands_total{command="commit"}) 與 rate(queries) 和平常比；實驗中 row lock、metadata lock、CPU 限制都先讓
      threads_running 升高（情境開始後 4–10 秒），commit 速率在同一個或之後幾個 scrape 跟著掉（row lock 掉到 1.1/s，CPU 0.1 核掉到 45/s）。
      列操作量看 innodb_row_ops_total{operation}
    metrics:
      - mysql_global_status_commands_total
      - mysql_global_status_queries
      - mysql_global_status_threads_running
      - mysql_global_status_innodb_row_ops_total
    evaluate_on: self
    silent_failure: >-
      吞吐量掉下來本身不說原因；限速的應用（連線池、每秒固定請求）在資料庫變慢時 QPS 不一定掉，先動的是延遲與 threads_running。
      MySQLHighThreadsRunning 用 max_connections 的 60% 當門檻，連線池 8 條時 threads_running 最多 11–13，永遠不會響
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, my-perf-ex-commands, my-perf-ex-row-ops, my-perf-my-rows-read]
    upstream: { status: no, note: "mixin 與 awesome 都沒有吞吐量下降的規則" }
    rules: [rules/targets/mysql.yml#MySQLThroughputDrop]

  - id: metadata-locks
    aspect: saturation
    section: misuse
    tier: 2
    question: 有 DDL 卡在長交易後面、把整張表的查詢都擋住嗎
    signal: >-
      processlist collector 的 mysql_info_schema_processlist_threads{state="waiting_for_table_metadata_lock"}。
      實驗：一個讀了一列沒 commit 的交易，加上一個 ALTER TABLE ADD COLUMN，10 秒內 9 個 session 在等，
      commit 速率從 320/s 掉到 0，innodb_row_lock_current_waits 是 0。ALTER 預設的 lock_wait_timeout 是一年，不會自己放棄
    metrics:
      - mysql_info_schema_processlist_threads
      - mysql_info_schema_processlist_seconds
      - mysql_perf_schema_events_waits_seconds_total
    evaluate_on: self
    silent_failure: >-
      row lock 規則與長交易規則（> 300 秒）都看不到：擋住的交易只開了 25 秒。perf_schema.eventswaits 的 wait/lock/metadata/sql/mdl
      只在等待結束後才累計（交易結束時一次加 328 秒）。要知道誰擋住，用 sys.schema_table_lock_waits（performance_schema.metadata_locks）
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, my-processlist-query, my-trace-ex-pl-sanitize, my-perf-my-mdl-state, my-perf-my-lock-wait-timeout, my-perf-ex-waits-query]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLMetadataLockWaits, rules/targets/mysql.yml#MySQLMetadataLockBlocker]

  - id: slow-sql-visibility
    aspect: workload
    section: misuse
    tier: 3
    question: 慢的是哪一種 SQL
    signal: >-
      --collect.perf_schema.eventsstatements 讀 events_statements_summary_by_digest，每個 digest 輸出次數、總時間、rows_examined、
      錯誤、暫存表、no_index_used 等 15 個 counter 和一個 latency summary。用 rate(seconds_total) / rate(total) 算每個 digest 的平均時間。
      只輸出依 SUM_TIMER_WAIT 排序的前 250 個（--collect.perf_schema.eventsstatements.limit），digest_text 截在 120 字。
      exporter 只對 MySQL ≥ 8.0.28 查 quantile、lock_time、cpu_time，8.0.46、8.4、9.7 都符合
    metrics:
      - mysql_perf_schema_events_statements_total
      - mysql_perf_schema_events_statements_seconds_total
      - mysql_perf_schema_events_statements_rows_examined_total
      - mysql_perf_schema_events_statements_latency
      - mysql_global_status_slow_queries
    evaluate_on: self
    silent_failure: >-
      latency summary 的 quantile label 是 "95.0"、"99.0"、"999.0"，不是 0.95、0.99，照慣例寫 quantile="0.99" 回傳空。
      送 300 種 digest 後 series 數固定在 250 個 digest、4771 條，排不進前 250 的 digest 看不到；exporter 看不到 slow log 原文與執行計畫
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, my-perf-ex-stmt-query, my-perf-ex-stmt-topn, my-perf-ex-stmt-digest-text, my-perf-ex-stmt-labels, my-perf-ex-stmt-8028, my-perf-ex-stmt-quantile, my-perf-ex-stmt-defaults, my-perf-ex-stmt-flags, my-perf-my-pfs-default, ver-ex-stmt-8028]
    upstream: { status: no, note: "mixin 與 awesome 只有 slow_queries 計數" }
    rules: [rules/targets/mysql.yml#MySQLSlowDigest, rules/targets/mysql.yml#MySQLSlowQueries]

  - id: statement-errors
    aspect: workload
    section: misuse
    tier: 3
    question: 語句錯誤（lock wait timeout、table is full）變多了嗎
    signal: >-
      --collect.perf_schema.eventsstatementssum 的 mysql_perf_schema_events_statements_sum_errors（所有 digest 加總，不受前 250 個限制）。
      實驗中 row lock 情境的 ERROR 1205 讓它升到 0.9/s；global status 沒有對應的計數器
    metrics: [mysql_perf_schema_events_statements_sum_errors, mysql_perf_schema_events_statements_errors_total]
    evaluate_on: self
    silent_failure: 錯誤碼不在 metric 裡；要看 performance_schema.events_errors_summary_global_by_error（沒有 collector）
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, my-perf-ex-stmtsum-query, my-perf-ex-stmtsum-errors]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLStatementErrors]

  - id: buffer-pool-misses
    aspect: saturation
    section: misuse
    tier: 3
    question: Buffer pool 放得下工作集嗎
    signal: >-
      rate(innodb_buffer_pool_reads) / rate(innodb_buffer_pool_read_requests)。實驗把 buffer pool 從 128M 縮到 16M（表 102 MB）後，
      磁碟讀取升到 1,437/s，約佔讀取請求的 20%；限速負載下 commit 速率幾乎不變，p99 升到 340 ms；buffer_pool_wait_free 約 4/s
    metrics:
      - mysql_global_status_innodb_buffer_pool_reads
      - mysql_global_status_innodb_buffer_pool_read_requests
      - mysql_global_status_innodb_buffer_pool_wait_free
      - mysql_global_variables_innodb_buffer_pool_size
    evaluate_on: self
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, my-asp-my-bp-reads]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLBufferPoolDiskReads]

  # ---------- HA：replication、角色、semi-sync ----------
  - id: replication-running
    aspect: replication
    section: misuse
    tier: 1
    question: Replication thread 在跑嗎
    signal: >-
      8.0 的 exporter 用 SHOW SLAVE STATUS，名稱是 mysql_slave_status_slave_(io|sql)_running；8.4 與 9.7 只有 SHOW REPLICA STATUS，
      名稱是 mysql_slave_status_replica_(io|sql)_running。規則用 __name__ 正規式一起比對、取最小值 == 0（不能用 or：
      io 與 sql 的 label 相同，or 會丟掉第二條）。IO thread 在重連（Connecting）時 exporter 也輸出 0
    metrics:
      - mysql_slave_status_slave_io_running
      - mysql_slave_status_slave_sql_running
      - mysql_slave_status_replica_io_running
      - mysql_slave_status_replica_sql_running
    evaluate_on: self
    applies_when: replication
    silent_failure: IO 或 SQL thread 停止時 Seconds_Behind 是 NULL、metric 消失，只看延遲的規則不會響；只寫一種名稱的規則在 8.0 升 8.4 時回傳空
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-parse-connecting, mysql-sbs-null, ver-my80-old-names, ver-my84-sbs-col, ver-ex-slave-loop]
    upstream: { status: partial, note: "mixin 與 awesome 只寫 slave_*，8.4 的 replica_* 不會響" }
    rules: [rules/targets/mysql.yml#MySQLReplicationNotRunning]

  - id: replication-error
    aspect: replication
    section: misuse
    tier: 2
    question: Replication 是因為錯誤停下的嗎
    signal: >-
      mysql_slave_status_last_sql_errno > 0（例如 1062 重複鍵）；欄位名在 8.0 的舊語法與 8.4 的新語法相同。SQL thread 因錯誤停下時不會自己恢復，
      要人處理；errno 讓告警直接帶出原因。錯誤訊息文字（Last_SQL_Error）是字串，exporter 不輸出
    metrics: [mysql_slave_status_last_sql_errno, mysql_slave_status_last_io_errno]
    evaluate_on: self
    applies_when: replication
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-slave-skip, my-trace-my-last-sql-errno]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLReplicationError, rules/targets/mysql.yml#MySQLReplicaErrorCode]

  - id: replica-status-present
    aspect: replication
    section: observe
    tier: 1
    question: Replica 的狀態資料還在嗎
    signal: >-
      一小時前有 *_sql_running、現在沒有，且 mysql_up == 1；長期作法是用 role label 標出 replica，再用 absent。
      8.0 升 8.4 那一刻舊名稱消失，規則寫兩種名稱，所以不會誤報（只寫一種名稱的版本會）
    metrics: [mysql_slave_status_slave_sql_running, mysql_slave_status_replica_sql_running, mysql_up]
    evaluate_on: self
    applies_when: replication
    silent_failure: 權限被收回、RESET REPLICA ALL（升級成 primary）、升版改名時，所有 replication 規則同時回傳空
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-slave-skip]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLReplicaStatusMissing]

  - id: replication-semantics
    aspect: replication
    section: observe
    tier: 2
    question: Replication 延遲量的是真的嗎
    signal: >-
      主要來源是 heartbeat 表（--collect.heartbeat，pt-heartbeat 格式）的 now - stored。
      Seconds_Behind 只當輔助：SQL thread 停、或 IO thread 停而 SQL 追完時是 NULL，exporter 不輸出；名稱 8.0 是 seconds_behind_master、8.4 起是 seconds_behind_source。
      heartbeat 在每台都會變大時，代表 primary 上的寫入程式停了，不是 replica 延遲。
      Seconds_Behind 消失時由 replication-running、replica-status-present 補位；延遲太大本身看 replication-lag
    metrics:
      - mysql_heartbeat_now_timestamp_seconds
      - mysql_heartbeat_stored_timestamp_seconds
      - mysql_slave_status_seconds_behind_master
      - mysql_slave_status_seconds_behind_source
    evaluate_on: self
    applies_when: replication
    silent_failure: >-
      IO thread 停止時 Seconds_Behind 消失，heartbeat 卻持續變大（實驗 27 秒）；
      failover 後若寫入程式是 primary 上的 EVENT，它在升級的 replica 上是停用的，heartbeat 從此停住
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-heartbeat-query, mysql-sbs-null, mysql-sbs-compute, ver-my84-sbs-col]
    upstream: { status: partial, note: "mixin 的 MySQLReplicationLag 只用 seconds_behind_master，8.4 起名稱不同、thread 停時消失" }
    rules: [rules/targets/mysql.yml#MySQLReplicationNotRunning, rules/targets/mysql.yml#MySQLReplicaStatusMissing]

  - id: replication-lag
    aspect: replication
    section: misuse
    tier: 2
    question: Replica 落後太多了嗎
    signal: >-
      heartbeat：now - stored > 30（例子）。Seconds_Behind 扣掉 SQL_Delay > 30 當輔助，兩個名稱用 or 接起來（同一台只會有一個）。
      9.7 的 replication_applier_metrics component 有更細的 applier 統計，exporter 沒有 collector。量的是不是真的見 replication-semantics
    metrics:
      - mysql_heartbeat_now_timestamp_seconds
      - mysql_heartbeat_stored_timestamp_seconds
      - mysql_slave_status_seconds_behind_master
      - mysql_slave_status_seconds_behind_source
      - mysql_slave_status_sql_delay
    evaluate_on: self
    applies_when: replication
    silent_failure: thread 停止時 Seconds_Behind 消失，MySQLReplicationLag 回傳空；heartbeat 寫入程式停了時 MySQLHeartbeatLag 在每台都響
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-heartbeat-query, mysql-sbs-null, ver-my97-applier-metrics]
    upstream: { status: partial, note: "mixin 有 MySQLHeartbeatLag 與 MySQLReplicationLag；後者只用 seconds_behind_master" }
    rules: [rules/targets/mysql.yml#MySQLHeartbeatLag, rules/targets/mysql.yml#MySQLReplicationLag]

  - id: replica-read-only
    aspect: replication
    section: misuse
    tier: 2
    question: Replica 擋得住寫入嗎
    signal: >-
      正在複製的節點 read_only == 0 或 super_read_only == 0。super_read_only 連 root（CONNECTION_ADMIN／SUPER）也擋
    metrics: [mysql_global_variables_read_only, mysql_global_variables_super_read_only]
    evaluate_on: self
    applies_when: replication
    silent_failure: 在 replica 上寫入時 replication 照常；要等 primary 寫到同一筆資料才會 1062 停下，而且多出 primary 沒有的 GTID
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-my-readonly, my-trace-my-super-readonly]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLReplicaWritable]

  - id: role-detection
    aspect: replication
    section: misuse
    tier: 2
    question: 每個叢集剛好有一台可寫的 primary 嗎
    signal: >-
      從 metric 推角色：可寫（read_only == 0）且沒有 slave_status series 的就是 primary。
      每個 cluster 數量 == 0 代表沒有 primary，> 1 代表 failover 後舊 primary 回來、兩邊都能寫。
      cluster 是要自己加的 label；靜態的 role label 在 failover 後就是錯的。slave_status 的名稱隨版本變，規則兩種一起比對
    metrics: [mysql_global_variables_read_only, mysql_slave_status_replica_sql_running, mysql_slave_status_slave_sql_running, mysql_up]
    evaluate_on: self
    applies_when: replication
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLNoWritablePrimary, rules/targets/mysql.yml#MySQLMultipleWritable]

  - id: primary-writable
    aspect: availability
    section: misuse
    tier: 2
    question: Primary 寫得進去嗎
    signal: >-
      標成 primary 的節點 read_only == 1；mysql_up 只做 ping，真正的寫入要外部探測
      （例如應用層或 heartbeat 寫入程式自己回報）。role label 要跟著 failover 更新，否則改用 role-detection
    metrics: [mysql_global_variables_read_only]
    evaluate_on: self
    applies_when: replication
    evidence: inferred
    source: mysqld-exporter-src
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLPrimaryReadOnly]

  - id: gtid-consistency
    aspect: replication
    section: misuse
    tier: 2
    question: Replica 有沒有 primary 沒有的交易（errant GTID）
    signal: >-
      exporter 看不到：gtid_executed、gtid_purged 是字串，global_variables 解析失敗就跳過；gtid_mode 只有 ON／OFF 會輸出 1／0，
      ON_PERMISSIVE、OFF_PERMISSIVE 也被跳過。要另外跑查詢：GTID_SUBSET(replica 的 gtid_executed, primary 的 gtid_executed)，
      或用 query-exporter 輸出每個 source UUID 的交易數（見 blind_spots）。failover 前一定要檢查
    metrics: [mysql_global_variables_gtid_mode, mysql_global_variables_enforce_gtid_consistency]
    evaluate_on: external
    applies_when: "GTID replication"
    silent_failure: 在 replica 上寫一筆（暫時關 super_read_only）後，GTID_SUBSET 變 0，但 exporter 沒有任何 metric 改變
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-global-variables-parse, my-trace-my-gtid-executed]
    upstream: { status: no, note: "mixin 與 awesome 都沒有；Orchestrator 等 HA 工具自己會檢查" }
    rules: [rules/targets/mysql.yml#MySQLErrantGtid]

  - id: semi-sync
    aspect: replication
    section: misuse
    tier: 3
    question: Semi-sync 有沒有退回 async
    signal: >-
      rpl_semi_sync_source_status == 0 且 rpl_semi_sync_source_enabled == 1。8.0／8.4 有兩組 plugin（舊的 semisync_master 用 Rpl_semi_sync_master_*，
      新的 semisync_source 用 Rpl_semi_sync_source_*），規則兩組一起比對；9.7 只剩 source。等 ACK 逾時後 commit 照常成功，只有這個狀態變 0
    metrics:
      - mysql_global_status_rpl_semi_sync_source_status
      - mysql_global_variables_rpl_semi_sync_source_enabled
      - mysql_global_status_rpl_semi_sync_master_status
      - mysql_global_variables_rpl_semi_sync_master_enabled
    evaluate_on: self
    applies_when: semi-sync replication
    silent_failure: 沒裝 plugin 時這組 metric 不存在；replica 開著 super_read_only 時 INSTALL PLUGIN 失敗（ERROR 1290）
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-my-semisync-status, ver-my84-semisync-master-plugin, ver-my97-semisync-plugins, ver-my97-semisync-source-status]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLSemiSyncDegraded]

  # ---------- 叢集與共識：Group Replication ----------
  - id: gr-member-state
    aspect: cluster
    section: misuse
    tier: 2
    question: Group Replication 每個成員都 ONLINE 嗎
    signal: >-
      --collect.perf_schema.replication_group_members（預設關）把 performance_schema.replication_group_members 的每一列輸出成
      mysql_perf_schema_replication_group_member_info{member_host,member_state,member_role,...} = 1，所有欄位都變成 label。
      member_state 不是 ONLINE（RECOVERING、OFFLINE、ERROR、UNREACHABLE）時告警；被踢出群組的成員不會留在其他成員的表裡，
      所以另外比「看到的成員數比一小時內少」。8.4 起被踢出的成員進 offline_mode，exporter 在那台連不上（mysql_up 0），也要算進去
    metrics: [mysql_perf_schema_replication_group_member_info]
    evaluate_on: self
    applies_when: "MySQL Group Replication／InnoDB Cluster"
    silent_failure: >-
      狀態是 label 不是值：狀態一變，舊 series 消失、新 series 出現，只寫 == 0 的規則永遠不會響。
      沒裝 plugin 時表是空的，collector 回報成功但沒有 series；member_id、member_version 也是 label，升版或重建成員會換一組 series
    evidence: tested
    source: art-mysql-asp
    refs: [my-asp-exp, my-asp-ex-grm-query, my-asp-ex-grm-labels, my-asp-ex-grm-metric, my-asp-my-grm-state-col, my-asp-my-grm-unreachable, my-asp-ex-def-grm, ver-my84-gr-exit-offline]
    upstream: { status: no, note: "mixin 與 awesome 都沒有 Group Replication 規則" }
    rules: [rules/targets/mysql.yml#MySQLGroupMemberNotOnline, rules/targets/mysql.yml#MySQLGroupMembersMissing]

  - id: gr-quorum
    aspect: cluster
    section: misuse
    tier: 2
    question: Group Replication 還有多數嗎
    signal: >-
      每台成員自己看到的 UNREACHABLE 數 × 2 ≥ 成員數時失去多數（plugin 的判斷是 members − unreachable ≤ members / 2），寫入被擋住。
      實驗：三台暫停兩台 24 秒後，倖存的 gr1 看到 2 台 UNREACHABLE、自己仍是 ONLINE／PRIMARY，exporter 照常回應（mysql_up 1），
      INSERT 卡住到 5 秒 timeout；恢復後那筆 INSERT 其實 commit 了
    metrics: [mysql_perf_schema_replication_group_member_info]
    evaluate_on: self
    applies_when: "MySQL Group Replication／InnoDB Cluster"
    silent_failure: >-
      失去多數的成員自己仍是 ONLINE，只看 member_state != ONLINE 的規則會對 UNREACHABLE 的那幾列響，但看不出群組已經不能寫；
      group_replication_unreachable_majority_timeout 預設 0（一直等），群組不會自己恢復。客戶端逾時不代表交易沒寫入
    evidence: tested
    source: art-mysql-asp
    refs: [my-asp-exp, my-asp-my-gr-quorum, my-asp-my-gr-blocked, my-asp-ex-grm-labels]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLGroupQuorumLost]

  - id: gr-flow-control
    aspect: cluster
    section: misuse
    tier: 3
    question: Group Replication 的佇列快碰到 flow control 門檻了嗎
    signal: >-
      --collect.perf_schema.replication_group_member_stats（預設關，只查本機成員：WHERE MEMBER_ID=@@server_uuid）輸出
      mysql_perf_schema_transactions_in_queue（等 certification）與 transactions_remote_in_applier_queue（等套用）；
      門檻是 group_replication_flow_control_certifier_threshold／applier_threshold（預設 25000，global_variables 有輸出）。
      9.7 社群版可裝 component_group_replication_flow_control_stats，多出 Gr_flow_control_throttle_*（global_status 會輸出數值型的，推論）
    metrics:
      - mysql_perf_schema_transactions_in_queue
      - mysql_perf_schema_transactions_remote_in_applier_queue
      - mysql_global_variables_group_replication_flow_control_applier_threshold
      - mysql_global_variables_group_replication_flow_control_certifier_threshold
    evaluate_on: self
    applies_when: "MySQL Group Replication／InnoDB Cluster"
    silent_failure: >-
      8.0／8.4 社群版看不到「目前正在被節流多久」：8.4.7 的 global status 有 Gr_* 共識計數，但沒有 flow control 的，只能看佇列長度。
      member_stats 只輸出本機，要每台都抓
    evidence: code
    source: mysql-gr-flow-control
    refs: [my-asp-exp, my-asp-ex-grms-query, my-asp-ex-grms-queue, my-asp-ex-grms-applier, my-asp-my-grms-queue-col, my-asp-my-grms-applier-col, my-asp-my-gr-fc-applier, my-asp-my-gr-fc-certifier, ver-my97-gr-fc-stats]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLGroupApplierQueueHigh]

  # ---------- 資料維護與完整性：救援模式、碎片、損毀 ----------
  - id: force-recovery
    aspect: maintenance
    section: misuse
    tier: 3
    question: 資料庫在 InnoDB 救援模式嗎
    signal: >-
      innodb_force_recovery != 0（global_variables 預設有輸出）。≥ 4 時 InnoDB 唯讀，但 read_only 仍可能是 0；
      通常是之前遇到損毀，救完要改回 0 並重啟
    metrics: [mysql_global_variables_innodb_force_recovery]
    evaluate_on: self
    evidence: code
    source: mysql-force-recovery
    refs: [my-asp-my-force-recovery, my-global-variables-parse]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLInnoDBForceRecovery]

  - id: table-fragmentation
    aspect: maintenance
    section: misuse
    tier: 3
    question: 有沒有表在大量刪除後留下很多未使用空間
    signal: >-
      --collect.info_schema.tables（預設關）讀 information_schema.TABLES，每張表輸出 mysql_info_schema_table_size{component=data_length|index_length|data_free}。
      data_free 大且超過資料加索引的一半時考慮重建
    metrics: [mysql_info_schema_table_size, mysql_info_schema_table_rows]
    evaluate_on: self
    silent_failure: >-
      每張表三條以上的 series，表多時 cardinality 高，可用 --collect.info_schema.tables.databases 限定 schema。
      值來自統計快取（information_schema_stats_expiry 預設一天），實驗中新表在 ANALYZE TABLE 之前完全沒出現在 auto_increment 結果裡；
      innodb_file_per_table=OFF 時 data_free 是共用 tablespace 的剩餘空間，每張表都一樣
    evidence: code
    source: mysqld-exporter-src
    refs: [my-asp-ex-tables-query, my-asp-ex-tables-datafree, my-asp-ex-def-tables, my-asp-my-is-stats-expiry, my-asp-exp]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLTableFragmented]

  - id: corruption-signals
    aspect: maintenance
    section: misuse
    tier: 2
    question: 有頁面損毀或 checksum 錯誤嗎
    signal: >-
      exporter 看不到：MySQL 8.4 沒有「讀到損毀頁」的 status 計數；損毀只寫在 error log。補法：log pipeline 對 error log 的 InnoDB 損毀訊息告警，
      加上定期 CHECK TABLE（或 mysqlcheck）把結果寫成 textfile metric；innodb_force_recovery 被打開是事後訊號
    metrics: [mysql_global_variables_innodb_force_recovery]
    evaluate_on: external
    silent_failure: >-
      只讀到某一頁時才發現的損毀不會讓任何 mysql_* 改變；crash recovery 失敗時 metric 上只看得到 mysql_up 0
    evidence: code
    source: mysql-server-src
    refs: [my-asp-my-force-recovery]
    upstream: { status: no }
    rules: []

  # ---------- 資料保護：PITR、耐久性、備份 ----------
  - id: binlog-pitr
    aspect: protection
    section: misuse
    tier: 2
    question: binlog 有開、保留得夠久，可以做 point-in-time recovery 嗎
    signal: >-
      log_bin == 0 代表只能還原到最後一次完整備份；binlog_expire_logs_seconds 要比完整備份週期長（0 代表不依時間刪除）。
      實驗：8.4 預設 log_bin 1、expire 2592000（30 天）。8.4 移除 expire_logs_days，只看 binlog_expire_logs_seconds。binlog 用量用 --collect.binlog_size
    metrics:
      - mysql_global_variables_log_bin
      - mysql_global_variables_binlog_expire_logs_seconds
      - mysql_binlog_size_bytes
      - mysql_binlog_files
    evaluate_on: self
    silent_failure: >-
      binlog_size collector 在 log_bin=0 時直接回傳、沒有任何 series（collector_success 仍是 1），「沒開 binlog」和「沒開 collector」看起來一樣，
      要看 mysql_global_variables_log_bin。binlog 開著不代表有被保存到別處：binlog 和資料在同一顆磁碟上時，磁碟壞掉一起沒了
    evidence: tested
    source: art-mysql-asp
    refs: [my-asp-exp, my-asp-ex-binlog-logbin, my-asp-ex-binlog-skip, my-asp-ex-binlog-query, my-asp-my-log-bin, my-asp-my-binlog-expire, my-asp-ex-def-binlog, ver-my80-expire-logs-days, ver-my84-binlog-expire-seconds]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLBinlogDisabled, rules/targets/mysql.yml#MySQLBinlogRetentionShort]

  - id: durability-settings
    aspect: protection
    section: misuse
    tier: 3
    question: 斷電時會不會少掉已 commit 的交易
    signal: >-
      sync_binlog != 1（binlog 開著時）或 innodb_flush_log_at_trx_commit != 1。實驗：8.4 兩個預設都是 1
    metrics: [mysql_global_variables_sync_binlog, mysql_global_variables_innodb_flush_log_at_trx_commit]
    evaluate_on: self
    evidence: tested
    source: art-mysql-asp
    refs: [my-asp-exp, my-asp-my-sync-binlog, my-asp-my-flush-log-trx]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLDurabilityRelaxed]

  - id: backup-freshness
    aspect: protection
    section: misuse
    tier: 2
    question: 最近一次成功的備份是什麼時候
    signal: >-
      mysqld_exporter 沒有任何備份相關的 collector。做法：備份 job（xtrabackup、mysqldump、MySQL Shell dump）成功後
      寫 textfile metric，例如 mysql_backup_last_success_timestamp_seconds{cluster} 與 mysql_backup_size_bytes，由 node_exporter 的
      textfile collector 或 Pushgateway 送進來；告警看「多久沒有成功」與「metric 整個不見」。還原測試另外記錄
    metrics: [mysql_backup_last_success_timestamp_seconds]
    evaluate_on: external
    silent_failure: >-
      只在失敗時發通知的備份 job，cron 沒跑或主機停機時什麼都不會發；所以要用「最後成功時間」而不是「失敗事件」，並且 absent 要另外一條規則
    evidence: inferred
    source: node-exporter-textfile
    refs: [my-default-collectors]
    upstream: { status: no, note: "mixin 與 awesome 都沒有；metric 名稱是本專案的例子" }
    rules: [rules/targets/mysql.yml#MySQLBackupStale]

  - id: backup-metric-present
    aspect: protection
    section: observe
    tier: 2
    question: 備份新鮮度的 metric 還在嗎
    signal: >-
      absent(mysql_backup_last_success_timestamp_seconds) 持續 1 小時：備份 job 沒在寫、textfile 路徑錯，或 node_exporter 沒開 textfile collector。
      這時 backup-freshness 的 MySQLBackupStale 回傳空
    metrics: [mysql_backup_last_success_timestamp_seconds]
    evaluate_on: external
    evidence: inferred
    source: node-exporter-textfile
    refs: [my-default-collectors]
    upstream: { status: no, note: "metric 名稱是本專案的例子" }
    rules: [rules/targets/mysql.yml#MySQLBackupMetricMissing]

  # ---------- 容量與成長 ----------
  - id: autoinc-exhaustion
    aspect: capacity
    section: misuse
    tier: 3
    question: 有沒有 AUTO_INCREMENT 欄位快用完整數範圍
    signal: >-
      --collect.auto_increment.columns（預設關）輸出 mysql_info_schema_auto_increment_column 與 ..._column_max（依型別算 2^n − 1）
    metrics: [mysql_info_schema_auto_increment_column, mysql_info_schema_auto_increment_column_max]
    evaluate_on: self
    silent_failure: >-
      information_schema.TABLES.AUTO_INCREMENT 走統計快取（information_schema_stats_expiry 預設 86400 秒）：
      實驗中新表插入 10 列、再插入 50 列，兩次 scrape 都沒有這張表；ANALYZE TABLE 之後才出現（74）。最慢要一天才看得到
    evidence: tested
    source: art-mysql-asp
    refs: [my-asp-exp, my-asp-ex-autoinc-query, my-asp-ex-def-autoinc, my-asp-my-is-stats-expiry]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLAutoIncrementNearMax]

  - id: connection-headroom
    aspect: capacity
    section: misuse
    tier: 3
    question: 連線數的高峰離 max_connections 還有多遠
    signal: >-
      Max_used_connections 是重啟（或 FLUSH STATUS）以來的高水位，scrape 之間的尖峰與 exporter 被擋在外面的那段時間都會記下來
      （ha lab：max_connections=30 打滿後是 31）。和 threads_connected / max_connections 的即時比例互補
    metrics: [mysql_global_status_max_used_connections, mysql_global_variables_max_connections]
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-my-max-used, my-trace-my-max-used-upd]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLConnectionPeakNearMax]

  - id: binlog-growth
    aspect: capacity
    section: misuse
    tier: 3
    question: binlog 有照設定刪除嗎
    signal: >-
      mysql_binlog_files 與 mysql_binlog_size_bytes 的趨勢；磁碟預測用 MySQLDataDiskFillingSoon。
      binlog_expire_logs_auto_purge（8.0.46、8.4.13、9.7.4 都有，lab 的 8.4.7 預設 1）是 0 時，expire 到期也不會自動刪
    metrics: [mysql_binlog_files, mysql_binlog_size_bytes, mysql_global_variables_binlog_expire_logs_auto_purge]
    evaluate_on: self
    silent_failure: 設定看起來對（expire 有設）但 auto_purge 被關掉時，只有檔案數會一直增加
    evidence: code
    source: mysql-server-src
    refs: [spl-my80-auto-purge, spl-my84-auto-purge, spl-my97-auto-purge, my-asp-my-binlog-auto-purge, my-asp-ex-binlog-query, my-asp-exp]
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLDataDiskFillingSoon]

  - id: data-growth
    aspect: capacity
    section: misuse
    tier: 3
    question: 資料量長多快
    signal: >-
      --collect.info_schema.schema_size（預設關）每個 schema 一條 mysql_info_schema_schema_size_bytes（DATA_LENGTH + INDEX_LENGTH 加總，
      不含 mysql、sys、performance_schema、information_schema），用來畫趨勢與做容量規劃；告警交給磁碟預測
    metrics: [mysql_info_schema_schema_size_bytes]
    evaluate_on: self
    silent_failure: 是估計值，走統計快取（最多晚一天），不等於磁碟上的檔案大小（不含 binlog、redo、undo、暫存檔）
    evidence: code
    source: mysqld-exporter-src
    refs: [my-asp-ex-schema-size-query, my-asp-ex-def-schema-size, my-asp-my-is-stats-expiry]
    upstream: { status: no }
    rules: []

  # ---------- 工作量：active session ----------
  - id: active-sessions
    aspect: workload
    section: misuse
    tier: 3
    question: 此刻有多少 session 在做事、在等什麼
    signal: >-
      processlist collector（預設關）每次 scrape 依 command、state 計數，等於一個以 scrape 間隔取樣的簡化 ASH：
      sum(mysql_info_schema_processlist_threads{command!~"sleep|daemon|binlog_dump.*"}) 是 active session 數。
      要知道是哪個語句、等哪個事件，直接查 performance_schema（events_statements_current、events_waits_current、sys.session），exporter 沒有對應的 collector
    metrics: [mysql_info_schema_processlist_threads, mysql_info_schema_processlist_seconds]
    evaluate_on: self
    silent_failure: >-
      等 row lock 的 session state 是 updating，看不出在等鎖；只有 scrape 那一刻的快照，scrape 之間的尖峰看不到；沒有語句或 digest 的維度
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-processlist-query, my-asp-ex-processlist-group]
    upstream: { status: no }
    rules: []

# 不正確使用：應用送出寫得不好的 SQL 時，哪些訊號看得到（section: misuse）、哪些看不到（blind_spots）。
# 依據是 lab/targets/mysql/perf 與 ha 的實驗與原始碼；沒有依據的項目寫在 not_visible。
bad_queries:
  - case: 全表掃描、缺索引
    signals: [slow-queries, slow-sql-visibility, buffer-pool-misses, throughput-drop]
    visible: >-
      Slow_queries 增加（依 long_query_time）；eventsstatements 每個 digest 的 rows_examined、no_index_used（實驗中 filesort 全表的 digest 是 rows_examined 第一名）；
      eventsstatementssum 有全部 digest 加總的全表掃描數；工作集放不下時 buffer pool 磁碟讀取升高
    not_visible: 執行計畫、參數值、排不進前 250 的 digest
    refs: [exp-mysql-perf, my-trace-my-slow, my-perf-ex-stmt-query, my-perf-ex-stmtsum-query]
  - case: 長交易（開了不 commit）
    signals: [long-transactions, undo-history, metadata-locks]
    visible: innodb_trx 的 oldest_transaction_age_seconds；history list 變長（實驗 50 秒到 13,474）；後面有 DDL 時變成 metadata lock 排隊
    not_visible: 交易裡跑了哪些語句、是哪個應用
    refs: [exp-mysql-ha, exp-mysql-perf, my-innodb-trx-query]
  - case: 查詢造成的 row lock 爭用與 deadlock
    signals: [lock-waits, deadlocks, statement-errors, throughput-drop, active-sessions]
    visible: >-
      innodb_row_lock_current_waits（最多等於應用連線數）與 rate(innodb_row_lock_time)；innodb_metrics 的 lock_deadlocks_total；
      lock wait timeout（1205）算進語句錯誤數；threads_running 先升、commit 速率跟著掉
    not_visible: 誰擋住誰、錯誤碼分布
    refs: [exp-mysql-perf, exp-mysql-ha, my-innodb-metrics-name, my-perf-ex-stmtsum-errors]
  - case: 暫存表落到磁碟
    signals: [tmp-tables, slow-sql-visibility]
    visible: created_tmp_disk_tables / created_tmp_tables；eventsstatements 的 tmp_disk_tables_total 指出是哪個 digest（實驗 9.5/s、84%）
    not_visible: 暫存表用了多少磁碟空間（MySQL 沒有這個 status）
    refs: [exp-mysql-perf, my-asp-my-tmp-disk]
  - case: 回傳大量資料的查詢
    signals: [slow-sql-visibility]
    visible: eventsstatements 每個 digest 的 rows_sent 與 rows_examined
    not_visible: 單一查詢回傳的位元組數、客戶端的記憶體；本專案沒有實驗或原始碼依據可寫 global 的位元組計數
    refs: [my-perf-ex-stmt-query, exp-mysql-perf]
  - case: DDL 卡在長交易後面（metadata lock）
    signals: [metadata-locks, throughput-drop]
    visible: >-
      processlist 的 state="waiting_for_table_metadata_lock"（實驗 9 個 session、commit 0）；query-exporter 的阻擋者數與持有時間（MySQLMetadataLockBlocker）；
      row lock 與長交易規則都不響
    not_visible: exporter 本身看不到阻擋者（見 blind_spots）
    refs: [exp-mysql-perf, my-processlist-query, my-q-exp]
  - case: 連線風暴（短連線反覆連線、斷線）
    signals: [connections, aborted-connects, connection-headroom, thread-cache, db-up]
    visible: >-
      打滿當下 exporter 也被擋，mysql_up 0、其他 metric 消失；事後 connection_errors_total{error="max_connections"}（實驗 +4,040）、
      max_used_connections 到 max_connections + 1；被 max_connections 拒絕的連線在 MySQL 不算進 aborted_connects
    not_visible: 打滿當下的連線數（見 blind_spots，query-exporter 走 admin port 補）
    refs: [exp-mysql-perf, exp-mysql-ha, mysql-conn-reserved]

# 目前無法監控的範圍。category：exporter（資料庫有、exporter 沒輸出）、database（資料庫本身沒提供）、other（要靠其他元件）。
blind_spots:
  - what: 連線打滿當下的連線數
    category: exporter
    why: exporter 也被擋在外面，整組 metric 消失
    workaround: >-
      告警靠 `mysql_up` 與事後的 `connection_errors_total`；或讓查詢走不受 max_connections 限制的 admin port（`admin_address`、`admin_port`，8.0.14 起；帳號要 SERVICE_CONNECTION_ADMIN）
    options: "建議：query-exporter 走 admin port 讀連線數（MySQLConnectionsExhausted）"
    section: targets/mysql.md#custom-queries
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/mysql.yaml
      metrics: [mysql_q_threads_connected, mysql_q_max_connections]
      rules: [MySQLConnectionsExhausted]
      refs: [my-q-exp, my-q-my-admin-bypass, my-q-my-admin-priv, my-q-qe-pool-persist, ver-my80-admin-port]
  - what: errant GTID
    category: exporter
    why: "`gtid_executed` 是字串，exporter 跳過"
    workaround: >-
      自訂查詢把 gtid_executed 拆成每個 source UUID 的交易數，在 PromQL 裡比 replica 與 read_only=0 的 primary；
      精確的 GTID_SUBSET 要同時連兩台，單一查詢做不到
    options: "建議：query-exporter 輸出每個 source UUID 的交易數，在 PromQL 比 replica 與 primary（MySQLErrantGtid）"
    section: targets/mysql.md#custom-queries
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/mysql.yaml
      metrics: [mysql_q_gtid_executed_transactions, mysql_q_read_only]
      rules: [MySQLErrantGtid]
      refs: [my-q-exp, my-q-my-gtid-executed, my-q-qe-row-map]
  - what: Metadata lock 的細節（誰擋住誰）
    category: exporter
    why: 沒有 collector 讀 `performance_schema.metadata_locks`
    workaround: >-
      自訂查詢彙總成數字：等待數、最久等待、阻擋者數、閒置的阻擋者數、阻擋者持有多久；誰（pid、帳號、SQL）不放 label，
      告警後查 `sys.schema_table_lock_waits`
    options: "建議：query-exporter 彙總 metadata_locks 的等待與阻擋者（MySQLMetadataLockBlocker）；是誰查 sys.schema_table_lock_waits"
    section: targets/mysql.md#custom-queries
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/mysql.yaml
      metrics: [mysql_q_mdl_waiting_sessions, mysql_q_mdl_oldest_wait_seconds, mysql_q_mdl_blocking_sessions, mysql_q_mdl_idle_blocking_sessions, mysql_q_mdl_blocker_age_seconds]
      rules: [MySQLMetadataLockBlocker]
      refs: [my-q-exp, my-q-my-mdl-status, my-q-qe-null-zero]
  - what: Replica 的錯誤訊息
    category: exporter
    why: "`Last_SQL_Error` 是字串（自由文字，不能當 label）"
    workaround: >-
      自訂查詢把 errno 與 ER_ 名稱（events_errors_summary_global_by_error，有限集合）當 label；錯誤訊息本身仍要看 `SHOW REPLICA STATUS`
    options: "建議：query-exporter 把 errno 與 ER_ 名稱當 label（MySQLReplicaErrorCode）；訊息看 SHOW REPLICA STATUS"
    section: targets/mysql.md#custom-queries
    covered_by:
      tool: "query-exporter 5.2.2"
      config: queries/query-exporter/mysql.yaml
      metrics: [mysql_q_replica_last_error_timestamp_seconds]
      rules: [MySQLReplicaErrorCode]
      refs: [my-q-exp, my-q-my-worker-errno, my-q-my-conn-errno, my-q-my-error-name, my-q-qe-expiration]
  - what: 9.7 的 replication applier metrics
    category: exporter
    why: "`replication_applier_metrics`、`replication_applier_progress_by_worker`（9.7 的 component）沒有 collector"
    workaround: 裝 component 後用自訂查詢；這裡沒有提供查詢
    options: "建議：裝 component 後用自訂查詢（這裡沒有提供）"
    section: targets/versions/mysql.md#diff
  - what: 頁面損毀
    category: database
    why: 沒有 status 計數，只寫在 error log；`CHECK TABLE` 要讀整張表（並加鎖），不能放進每 15–60 秒的查詢
    workaround: log 管線對 error log 告警；離峰排程 `CHECK TABLE`／mysqlcheck 寫 textfile（query-exporter 的 schedule 也能跑，但成本與鎖要自己評估，這裡不提供）
    options: "建議：log 管線對 error log 告警；離峰排程 CHECK TABLE 寫 textfile"
    section: targets/mysql.md#blind-spots
  - what: Group Replication 的節流時間（8.0、8.4）
    category: database
    why: "`Gr_flow_control_*` 在 8.4 以前只有 Enterprise component 有；9.7 社群版要另裝 component"
    workaround: 看 applier／certifier 佇列對門檻的比例；9.7 裝 component_group_replication_flow_control_stats
    options: "建議：看 applier／certifier 佇列對門檻的比例；9.7 裝 flow control stats component"
    section: targets/mysql.md#blind-spots
  - what: 真正的寫入是否成功
    category: database
    why: "`mysql_up` 只做 ping"
    workaround: heartbeat 寫入程式回報成功時間（pt-heartbeat ＋ --collect.heartbeat），或應用層探測；不建議讓監控帳號寫入，所以沒有放進自訂查詢
    options: "建議：heartbeat 寫入程式回報成功時間，或應用層探測"
    section: targets/mysql.md#blind-spots
  - what: 磁碟剩餘空間、檔案系統唯讀
    category: other
    why: 不在資料庫裡；mysqld_exporter 沒有磁碟 metric
    workaround: >-
      node_exporter 的 `node_filesystem_avail_bytes`、`node_filesystem_readonly`；本卡的 MySQLDataDiskFilling 指定資料目錄的 mountpoint。
      主機層規則只讀碼
    options: "建議：node_exporter 指定資料目錄的 mountpoint（MySQLDataDiskFilling、HostFilesystemReadOnly）"
    section: targets/mysql.md#capacity
    covered_by:
      tool: "node_exporter v1.12.1（容器另加 cAdvisor／kube-state-metrics）"
      config: rules/host/meta.yml
      metrics: [node_filesystem_avail_bytes, node_filesystem_size_bytes, node_filesystem_files_free, node_filesystem_readonly]
      rules: [HostFilesystemAlmostFull, HostFilesystemFillingUp, HostInodesAlmostFull, HostFilesystemReadOnly, MySQLDataDiskFilling, MySQLDataDiskFillingSoon]
      refs: [res-nm-fs-filling, res-nm-fs-almost, res-nm-files, res-ne-fs-readonly, res-nm-fs-readonly]
  - what: 行程 CPU、記憶體、OOM kill、fsync／磁碟延遲
    category: other
    why: mysqld_exporter 沒有行程 CPU 與 fsync 延遲（`Innodb_data_pending_fsyncs` 只是數量）；OOM kill 在資料庫裡只看得到 uptime 歸零
    workaround: node_exporter 的 PSI、MemAvailable、vmstat 與磁碟時間；容器用 cAdvisor 的節流、working set 與 OOM 事件。主機層規則只讀碼
    options: "建議：node_exporter 的 PSI、MemAvailable、vmstat 與磁碟時間；容器用 cAdvisor"
    section: targets/mysql.md#saturation
    covered_by:
      tool: "node_exporter v1.12.1（容器另加 cAdvisor／kube-state-metrics）"
      config: rules/host/meta.yml
      metrics: [node_pressure_cpu_waiting_seconds_total, container_cpu_cfs_throttled_periods_total, node_memory_MemAvailable_bytes, node_vmstat_oom_kill, node_disk_write_time_seconds_total, node_disk_writes_completed_total]
      rules: [HostCPUPressure, ContainerCPUThrottled, HostMemoryLow, HostMemoryPressure, HostOOMKill, ContainerOOMEvent, ContainerOOMKilled, HostDiskWriteLatencyHigh, HostIOPressure]
      refs: [res-ne-psi-cpu, res-cadv-throttled, res-ne-mem-avail, res-ne-psi-mem, res-ne-vmstat-fields, res-cadv-oom, res-ksm-terminated, res-ne-disk-writetime, res-ne-disk-writes, res-ne-psi-io]
  - what: 備份是否成功、多新
    category: other
    why: 沒有備份 collector
    workaround: 備份 job 寫 textfile metric
    options: "建議：備份 job 成功後寫 textfile 時間戳（MySQLBackupStale、MySQLBackupMetricMissing）"
    section: targets/mysql.md#protection
  # 寫得不好的 SQL：exporter 只看得到彙總，下面這些痕跡看不到（對照 bad_queries）
  - what: 慢查詢的執行計畫、參數值與 slow log 原文
    category: exporter
    why: eventsstatements 只有 digest 彙總（digest_text 截在 120 字、只取總耗時前 250 個），exporter 不讀 slow log、不跑 EXPLAIN
    workaround: 告警後查 `sys.statement_analysis`、`sys.statements_with_full_table_scans` 與 `EXPLAIN`；slow log 交給 log 管線
    options: "建議：告警帶出 digest，再查 sys.statement_analysis 與 EXPLAIN；slow log 交給 log 管線"
    section: targets/mysql.md#perf-slow-sql
  - what: Row lock 的阻擋者（誰擋住誰）
    category: exporter
    why: 沒有 collector 讀 `performance_schema.data_lock_waits`；等 row lock 的 session 在 processlist 的 state 是 updating
    workaround: 告警後查 `sys.innodb_lock_waits`（這個查詢未實測）與 `INNODB_TRX`
    options: "建議：告警後查 sys.innodb_lock_waits 與 INNODB_TRX（未實測）"
    section: targets/mysql.md#perf-row-lock
  - what: 語句錯誤是哪一個錯誤碼
    category: exporter
    why: eventsstatementssum 只有錯誤總數；`events_errors_summary_global_by_error` 沒有 collector
    workaround: 查 `performance_schema.events_errors_summary_global_by_error`
    options: "建議：查 events_errors_summary_global_by_error；要告警時用自訂查詢輸出有限的錯誤名稱"
    section: targets/mysql.md#perf-slow-sql
  - what: 此刻正在執行的是哪個語句
    category: exporter
    why: processlist collector 只依 command、state 計數，沒有語句或 digest 的維度，也只有 scrape 那一刻的快照
    workaround: 查 `performance_schema.events_statements_current`、`sys.session`
    options: "建議：告警後查 events_statements_current、sys.session"
    section: targets/mysql.md#workload
