id: mysql
name: mysqld_exporter＋MySQL
kind: target
model: exporter
exporter: mysqld_exporter
family: database
status: draft
stages: [source]
versions_checked: ["mysqld_exporter 0.21.0", "MySQL 8.0.46", "MySQL 8.4.13", "MySQL 9.7.4", "MySQL 8.4.7（lab 與多數原始碼參考）"]
architecture: architecture/db-relational.md
role: >-
  只寫 MySQL（Oracle 社群版）。MariaDB 的原始碼與行為不同，另有一張卡（[mariadb](mariadb.md)）；兩張卡共用的訊號 id 相同，
  但證據都引用各自的原始碼與 lab。
  Exporter 有三層「活著」：Prometheus 抓得到 exporter（up）、exporter 連得到資料庫（mysql_up）、
  每個 collector 的查詢成功（mysql_exporter_collector_success）。每一層壞掉時，下一層的 series 不是變 0，
  而是整組消失，所以用 != 1 或 == 0 寫的規則會回傳空。
  版本差異（8.0、8.4 LTS、9.7 LTS）從原始碼整理在[MySQL 各版本的監控差異](../targets/versions/mysql.md)；
  會隨版本變的訊號在 signal 或 applies_when 寫明。lab 跑的是 MySQL 8.4.7，原始碼參考多數也釘在 8.4.7，8.0.46／8.4.13／9.7.4 的差異只讀碼。
  規則範例在 rules/targets/mysql.yml，job="mysql" 是佔位符。
  訊號依九個面向分組（aspect 欄位）：exporter、availability、workload、saturation、replication、cluster（Group Replication）、
  maintenance（purge、救援模式、碎片）、protection（binlog、耐久性、備份）、capacity（磁碟、auto_increment、連線高水位）。
  exporter 的連線與錯誤處理見 [Exporter 架構](../architecture/exporters.md#mysqld-exporter)。
  資料庫本身該監控什麼、每個訊號由哪個 collector 提供、需要什麼權限，整理在 docs/targets/mysql.md。

silent_failures:
  - text: >-
      Exporter 停機時 mysql_up 這條 series 跟著 exporter 消失（它是 exporter 自己輸出的），mysql_up != 1（mixin MySQLDown）與
      mysql_up == 0（awesome）都回傳空，不會觸發；只有 up{job="mysql"} == 0 與 absent(mysql_up) 成立。
    evidence: code
    source: mysqld-exporter-src
    refs: [my-trace-ex-up]
  - text: >-
      資料庫停機（kill -9）時 up 仍是 1，mysql_up 變 0，mysql_exporter_collector_success 整組消失，
      所以 collector_success == 0 在這時也不會響。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      資料庫主機停機時連線會一直等到 context 取消，scrape 耗時約等於 scrape_timeout 減 --timeout-offset（預設 0.25s）。
      --timeout-offset 大於等於 scrape_timeout 時 exporter 只記一行錯誤、不設期限；Prometheus 先逾時，up 變 0，
      所有 mysql_* 消失，症狀從「資料庫停機」變成「exporter 停機」。
    evidence: code
    source: mysqld-exporter-main
  - text: >-
      8.4 移除 SHOW SLAVE STATUS，exporter 改用 SHOW REPLICA STATUS，metric 名稱跟著欄位變成
      mysql_slave_status_replica_io_running、seconds_behind_source；8.0 上 exporter 先成功的是 SHOW SLAVE STATUS，名稱是舊的 slave_*、seconds_behind_master。
      mixin 的 MySQLReplicationNotRunning、instance:mysql_slave_lag_seconds 與 awesome 的 replication 規則都寫舊名稱，8.0 升 8.4 後回傳空。
    evidence: code
    source: mysqld-exporter-slave-status
    refs: [ver-my80-show-slave-status, ver-my80-old-names, ver-my84-show-replica-only, ver-my84-sbs-col, ver-ex-slave-loop]
  - text: >-
      8.4 起 mysql_native_password 預設不啟用、9.7 不在內建認證 plugin 裡；8.0 上用 native password 建的 exporter 帳號升版後登不進去，
      mysql_up 變 0，所有 mysql_* 只剩 mysql_up。
    evidence: code
    source: mysql-server-src
    refs: [ver-my84-native-pw-cached, ver-my97-no-native-pw]
  - text: >-
      SQL thread 停止時 Seconds_Behind_Source 是 NULL，exporter 解析失敗就不輸出，延遲規則回傳空；
      非 replica 的節點 slave_status 成功但沒有任何 series，和「權限不足被吃掉」從 metric 上很難區分。
    evidence: code
    source: mysqld-exporter-slave-status
    refs: [mysql-sbs-null, my-slave-skip]
  - text: >-
      Collector 的版本門檻高於資料庫版本時直接跳過，不輸出 collector_success；透過 collect[] 參數或改啟動旗標
      少掉的 collector 也一樣，沒有任何失敗訊號。8.0、8.4、9.7 都高於所有 collector 的門檻（最高 8.0），所以版本本身不會讓 collector 被跳過。
    evidence: code
    source: mysqld-exporter-src
    refs: [ver-ex-version-float, ver-ex-version-gate]
  - text: >-
      多 target 模式（/probe）下一台 exporter 掛掉，所有 target 的 up 同時變 0，看起來像所有資料庫一起壞；
      /probe 的輸出不含 exporter 自己的 process 與 go 指標，要另外一個 job 抓 /metrics。
    evidence: code
    source: mysqld-exporter-main
  - text: >-
      每次 scrape 開新連線（預設最多 2 條）。兩台 HA Prometheus 同時抓，或多 target 併發時，
      可能超過 README 建議的 MAX_USER_CONNECTIONS 3，mysql_up 間歇變 0，而且只在其中一台 Prometheus 上看得到。
    evidence: inferred
    source: mysqld-exporter-readme
  - text: >-
      連線數打滿 max_connections 時，exporter 一般帳號也收到 Error 1040，mysql_up 變 0、threads_connected 消失，
      「連線數 / max_connections > 0.8」這類規則在最需要時回傳空；只有 mysql_up 規則與事後的
      connection_errors_total{error="max_connections"} 看得到。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, mysql-conn-reserved]
  - text: >-
      給 exporter CONNECTION_ADMIN 可以用保留的那一條連線（max_connections + 1），mysql_up 回到 1，
      但 exporter 預設開兩條連線，第二條仍被拒，7 個 collector（含 global_variables）失敗，max_connections 跟著消失。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, mysql-conn-reserved]
  - text: >-
      IO thread 停止、SQL thread 追完時 Seconds_Behind_Source 是 NULL，exporter 不輸出；heartbeat 延遲同時持續變大。
      只看 Seconds_Behind 的延遲規則在 replica 斷線時安靜。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, mysql-sbs-null]
  - text: >-
      heartbeat 寫入程式若是 primary 上的 EVENT，failover 後在新 primary 上是 SLAVESIDE_DISABLED，heartbeat 停住；
      寫入程式要跟著 primary 角色走（例如 pt-heartbeat 由 HA 工具啟動）。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      靜態的 role="primary" label 在 failover 後指向舊節點，MySQLPrimaryReadOnly 之類的規則查不到任何東西；
      舊 primary 回來時兩台都可寫，只有從 metric 推角色的規則（MySQLMultipleWritable）看得到。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      gtid_executed 是字串，global_variables 解析失敗就跳過；在 replica 上誤寫造成的 errant GTID
      沒有任何 metric 會變。gtid_mode 的 ON_PERMISSIVE、OFF_PERMISSIVE 也一樣被跳過。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-global-variables-parse, my-global-status-skip]
  - text: >-
      Semi-sync 等 ACK 逾時後退回 async，commit 照常成功，只有 rpl_semi_sync_source_status（舊 plugin 是 master）從 1 變 0。
      沒裝 plugin 時這組 metric 不存在。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      MySQL 沒有 Innodb_deadlocks、Innodb_history_list_length 這兩個 global status，deadlock 與 undo history 只能開 info_schema.innodb_metrics；
      deadlock 的名稱是 mysql_info_schema_innodb_metrics_lock_lock_deadlocks_total（有 _total），抄 MariaDB 寫法的規則回傳空。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-innodb-metrics-name, my-trace-my-deadlock-mon]
  - text: >-
      innodb_trx collector 在沒有交易時不輸出任何 series（不是 0），沒開 collector 和「沒有長交易」看起來一樣；
      要靠 collector_success 確認它在跑。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-innodb-trx-query]
  - text: >-
      8.4 起 Group Replication 被踢出的成員預設進 offline_mode，沒有 CONNECTION_ADMIN 的 exporter 被斷線、連不上那台：
      那台的 mysql_up 變 0、replication_group_member_info 消失，而不是 member_state 變 ERROR（推論，未實測）。8.0 的預設是 READ_ONLY。
    evidence: code
    source: mysql-server-src
    refs: [ver-my80-gr-exit-readonly, ver-my84-gr-exit-offline]

# 五段框架 2：正確使用。只寫原始碼推理（code）、本機小實驗（tested）或標明的官方文件（doc）。
usage:
  - id: exporter-account-grants
    text: >-
      exporter 帳號 GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.*，WITH MAX_USER_CONNECTIONS 3（README 的建議）；
      沒有 PROCESS 時 innodb_trx、processlist 只看得到自己的連線，數字偏低但 collector 回報成功
    evidence: doc
    refs: [ver-ex-readme-grants, my-innodb-trx-query, my-processlist-query]
  - id: exporter-auth-plugin
    text: >-
      exporter 帳號用 caching_sha2_password 建立。mysql_native_password 在 8.4 預設停用、9.7 不在內建 plugin 裡，
      8.0 上用它建的帳號升版後登不進去（mysql_up 0）；exporter 的 driver 支援 caching_sha2_password
    evidence: code
    refs: [ver-my84-native-pw-cached, ver-my97-no-native-pw, ver-ex-gsd-sha2]
  - id: exporter-connection-budget
    text: >-
      exporter 每次 scrape 最多開 2 條連線；MAX_USER_CONNECTIONS 要大於等於 2 ×（同時抓的 Prometheus 數 + /probe 併發數），
      否則 mysql_up 間歇變 0
    evidence: code
    refs: [my-pool-default, ver-ex-readme-grants]
  - id: timeout-offset
    text: >-
      exporter 用 Prometheus 送的 scrape timeout header 減 --timeout-offset（預設 0.25s）當查詢期限；
      --timeout-offset 要小於 scrape_timeout，否則 exporter 不設期限，Prometheus 先逾時、所有 mysql_* 消失
    evidence: code
    refs: [my-offset, bl-my-offset-default]
  - id: exporter-lock-wait-timeout
    text: >-
      保留 --exporter.lock_wait_timeout（預設開、2 秒），exporter 的 session 不會被 metadata lock 卡住；
      --exporter.query_timeout 限制單一 collector，慢的那個失敗、其他照常
    evidence: code
    refs: [my-lock-wait-timeout, my-trace-ex-lockwait, my-querytimeout]
  - id: collectors-to-enable
    text: >-
      預設只開 global_status、global_variables、slave_status、innodb_cmp、innodb_cmpmem、query_response_time。
      要明確打開：info_schema.innodb_trx（長交易）、info_schema.innodb_metrics（MySQL 的 deadlock 與 history length 只在這裡）、
      info_schema.processlist（metadata lock 等待）、heartbeat、binlog_size；看 SQL 時加 perf_schema.eventsstatements 與 eventsstatementssum
    evidence: tested
    refs: [my-default-collectors, exp-mysql-ha, exp-mysql-perf, my-innodb-metrics-name]
  - id: connection-admin-tradeoff
    text: >-
      給 exporter CONNECTION_ADMIN 只換到 max_connections + 1 那一條保留連線；exporter 要兩條，打滿時第二條仍被拒、7 個 collector 失敗。
      要打滿時還看得到連線數，讓 query-exporter 走 admin port（admin_address／admin_port，帳號要 SERVICE_CONNECTION_ADMIN）
    evidence: tested
    refs: [exp-mysql-ha, mysql-conn-reserved, my-q-exp, my-q-my-admin-bypass, my-q-my-admin-priv, ver-my80-admin-port]
  - id: gr-offline-mode
    text: >-
      8.4 起 Group Replication 被踢出的成員預設進 offline_mode，沒有 CONNECTION_ADMIN 的 exporter 連不上那台；
      GR 節點要把「成員的 mysql_up 0」算進成員狀態，或給 exporter CONNECTION_ADMIN（8.0 的預設是 READ_ONLY）
    evidence: code
    refs: [ver-my80-gr-exit-readonly, ver-my84-gr-exit-offline]
  - id: replication-metric-names
    text: >-
      replication 規則同時寫 8.0 的 slave_*／seconds_behind_master 與 8.4 起的 replica_*／seconds_behind_source；
      exporter 依序試 SHOW SLAVE STATUS、SHOW REPLICA STATUS，名稱跟著伺服器版本換
    evidence: code
    refs: [ver-my80-old-names, ver-my84-sbs-col, ver-ex-slave-loop]
  - id: heartbeat-writer
    text: >-
      延遲用 heartbeat 表（--collect.heartbeat，pt-heartbeat 格式）；寫入程式要跟著 primary 角色走（例如由 HA 工具啟動 pt-heartbeat），
      primary 上的 EVENT 在 failover 後的新 primary 是 SLAVESIDE_DISABLED，heartbeat 停住
    evidence: tested
    refs: [exp-mysql-ha, my-heartbeat-query]
  - id: cluster-label
    text: 同一組 primary／replica 的 target 加同一個 cluster label；角色由 read_only 與 slave_status 推，不用靜態 role label
    evidence: tested
    refs: [exp-mysql-ha]
  - id: long-query-time
    text: >-
      Slow_queries 依 long_query_time（預設 10 秒）計數，不管 slow log 有沒有開；要讓 MySQLSlowQueries 有意義，
      long_query_time 要設成應用能接受的上限（實驗 0.5 秒時 30 秒 +38）
    evidence: tested
    refs: [exp-mysql-perf, my-trace-my-slow]
  - id: statements-digest-limit
    text: >-
      eventsstatements 只輸出依總耗時排序的前 --collect.perf_schema.eventsstatements.limit（預設 250）個 digest，
      每個 digest 19 條 series；用 limit 控制 cardinality（實驗 250 個 digest 是 4,771 條）。不受前 N 限制的總數用 eventsstatementssum
    evidence: tested
    refs: [exp-mysql-perf, my-perf-ex-stmt-topn, my-perf-ex-stmt-defaults, my-perf-ex-stmt-labels, my-perf-ex-stmtsum-query]
  - id: ddl-lock-wait-timeout
    text: >-
      跑 DDL 的 session 先 SET lock_wait_timeout（預設 31,536,000 秒，一年）。沒設時 ALTER 排在未 commit 的交易後面不放棄，
      之後用到這張表的語句全部排隊（實驗 commit 從 320/s 掉到 0）
    evidence: tested
    refs: [exp-mysql-perf, my-perf-my-lock-wait-timeout]
  - id: query-exporter-account
    text: >-
      query-exporter 帳號 MAX_USER_CONNECTIONS 2、GRANT PROCESS 與 SELECT ON performance_schema.*；
      connect-sql 設 lock_wait_timeout=2、max_execution_time=4000，每個查詢 timeout 5 秒
    evidence: tested
    refs: [my-q-exp]
  - id: query-exporter-expiration
    text: >-
      自訂 metric 都設 expiration：查詢失敗時 series 在 expiration 後消失，沒設時停在最後一個值；
      值規則要搭配 queries_total{status!="success"} 與 query_timestamp
    evidence: tested
    refs: [my-q-exp, my-q-qe-expiration, my-q-qe-query-timestamp]

contracts:
  - scrape-within-interval
  - lookback
  - exporter-deadline

signals:
  # ---------- Exporter：它真的在量嗎 ----------
  - id: exporter-up
    aspect: exporter
    section: observe
    tier: 1
    question: Exporter 抓得到嗎
    signal: up{job="mysql"} == 0，加上 absent(up{job="mysql"})；不能只靠 mysql_up
    metrics: [up]
    evaluate_on: self
    silent_failure: Exporter 停機時 mysql_up 消失，mixin 的 MySQLDown 不會響
    evidence: code
    source: mysqld-exporter-src
    refs: [my-trace-ex-up]
    upstream: { status: no, note: "mixin 與 awesome 都只看 mysql_up；kps 的 TargetDown 只在用 kps 時有" }
    rules: [rules/targets/mysql.yml#MySQLExporterDown, rules/targets/mysql.yml#MySQLExporterMissing]

  - id: db-up
    aspect: exporter
    section: observe
    tier: 1
    question: Exporter 連得到資料庫嗎
    signal: >-
      mysql_up == 0（只代表連線與 SELECT @@version 成功，不代表查詢或寫入可用）。實驗：kill -9 primary 時 up 1、mysql_up 0。
      8.0 升 8.4／9.7 時，用 mysql_native_password 的 exporter 帳號會登不進去，症狀也是 mysql_up 0
    metrics: [mysql_up]
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-ex-up, ver-my84-native-pw-cached, ver-my97-no-native-pw]
    upstream: { status: partial, note: "mixin 的 mysql_up != 1 與 awesome 的 mysql_up == 0 都有，但 exporter 停機時一起失效" }
    rules: [rules/targets/mysql.yml#MySQLNotReachable]

  - id: collectors-present
    aspect: exporter
    section: observe
    tier: 1
    question: Exporter 有回應，collector 的結果還在嗎
    signal: up == 1 但 mysql_exporter_collector_success 完全沒有 series
    metrics: [up, mysql_exporter_collector_success]
    evaluate_on: self
    silent_failure: 資料庫停機或連線打滿時 collector_success 整組消失（不是變 0），MySQLCollectorFailed（== 0）回傳空
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
    upstream: { status: no, note: "mixin 與 awesome 都沒有" }
    rules: [rules/targets/mysql.yml#MySQLCollectorsMissing]

  - id: collector-success
    aspect: exporter
    section: observe
    tier: 1
    question: 關鍵 collector 都成功嗎
    signal: >-
      mysql_exporter_collector_success == 0；權限不足、表不存在（例如 heartbeat）、第二條連線被拒時會變 0。
      實驗：給 exporter CONNECTION_ADMIN 後打滿連線，第二條連線被拒，global_variables 等 7 個 collector 是 0
    metrics: [mysql_exporter_collector_success]
    evaluate_on: self
    silent_failure: 資料庫停機時整組消失；被跳過的 collector 不會出現
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
    upstream: { status: no, note: "mixin 與 awesome 都沒有" }
    rules: [rules/targets/mysql.yml#MySQLCollectorFailed]

  - id: custom-queries
    aspect: exporter
    section: observe
    tier: 1
    question: 補盲點的自訂查詢（query-exporter）還在跑嗎
    signal: >-
      query-exporter 5.2.2 的內建 metric：up{job="query-exporter"}、queries_total{query=~"mysql_.*", status!="success"} 與 database_errors_total 的增加量
      （設定裡叫 queries、database_errors，輸出時 counter 加 _total）。查詢由排程執行，失敗時自訂 metric 不更新；設了 expiration 的 series
      在 expiration 後消失，所以 MySQLConnectionsExhausted、MySQLErrantGtid 這類規則在查詢失敗時回傳空，要靠這三條補位
    metrics: [up, queries_total, database_errors_total, query_timestamp, query_interval]
    evaluate_on: self
    applies_when: "有部署 queries/query-exporter/mysql.yaml"
    silent_failure: >-
      欄位名稱或數量和設定不符時查詢被永久移除（不重試），之後只剩停止更新的 query_timestamp；
      沒設 expiration 的 metric 在資料庫停機後一直停在最後一個值
    evidence: tested
    source: query-exporter
    refs: [my-q-exp, my-q-qe-fatal, my-q-qe-doomed, my-q-qe-expiration, my-q-qe-connect-error, my-q-qe-query-timestamp, my-q-qe-interval-labels]
    upstream: { status: no }
    rules:
      - rules/targets/mysql.yml#MySQLCustomQueryExporterDown
      - rules/targets/mysql.yml#MySQLCustomQueryFailing
      - rules/targets/mysql.yml#MySQLCustomQueryStale

  - id: probe-blast-radius
    aspect: exporter
    section: observe
    tier: 1
    question: 多 target 模式下是 exporter 壞還是資料庫壞
    signal: 同一個 job 超過一半的 up 同時是 0；另外用一個 job 抓 exporter 自己的 /metrics
    metrics: [up]
    evaluate_on: self
    applies_when: multi-target probe
    evidence: code
    source: mysqld-exporter-main
    upstream: { status: no }
    rules: [rules/targets/mysql.yml#MySQLProbeExporterDown]

  - id: exporter-grants
    aspect: exporter
    section: observe
    tier: 1
    question: Exporter 帳號的權限、認證方式與連線上限夠嗎
    signal: >-
      SHOW GRANTS 要有 PROCESS、REPLICATION CLIENT、SELECT（README 的建議）；
      SELECT plugin FROM mysql.user WHERE user='exporter' 不能是 mysql_native_password（8.4 預設停用、9.7 移除）；
      MAX_USER_CONNECTIONS ≥ max_open_connections ×（同時抓的 Prometheus 數 + /probe 併發數）。
      密碼輪替要包含 exporter 的 .my.cnf 或環境變數
    metrics: []
    evaluate_on: inventory
    evidence: code
    source: mysqld-exporter-readme
    refs: [ver-ex-readme-grants, ver-my84-native-pw-cached, ver-my97-no-native-pw, ver-ex-gsd-sha2]
    upstream: { status: partial, note: "README 列出權限與 MAX_USER_CONNECTIONS 建議，沒有對應的檢查或規則" }
    rules: []

  - id: exporter-query-timeout
    tier: 2
    aspect: exporter
    section: observe
    question: Exporter 的查詢會不會被鎖或連線上限卡住
    signal: "`--exporter.lock_wait_timeout`（預設開啟、2 秒）避免被 metadata lock 卡住；`--exporter.query_timeout` 限制單一 collector。連線打滿時 exporter 自己也被擋，`mysql_up` 變 0，要給 exporter 帳號保留連線（admin port，見 blind_spots）"
    metrics: [mysql_up, mysql_global_status_connection_errors_total]
    evaluate_on: self
    silent_failure: max_connections 打滿時 exporter 也收到 Error 1040，依連線比例寫的規則回傳空
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-lock-wait-timeout, my-querytimeout]
    upstream: { status: no }
    rules: []

