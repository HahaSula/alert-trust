  # ---------- protection ----------
  - id: checkpoint
    aspect: protection
    section: misuse
    tier: 2
    question: WiredTiger checkpoint 成功、來得及嗎
    signal: >-
      mongodb_ss_wt_checkpoint_most_recent_time_msecs 與 increase(mongodb_ss_wt_checkpoint_total_failed_number_of_checkpoints)。checkpoint 預設 60 秒一次（syncdelay），
      兩次之間靠 journal；checkpoint 一直很慢代表磁碟寫入跟不上。
      版本：8.0 起統計在 checkpoint 分類；6.0、7.0 的時間是 mongodb_ss_wt_txn_transaction_checkpoint_most_recent_time_msecs（推論），規則 or 上這個名稱。
      失敗次數（total_failed_number_of_checkpoints）只在 MongoDB 8.0 以上有，MongoDBCheckpointFailed 在 6.0、7.0 回傳空
    metrics: [mongodb_ss_wt_checkpoint_most_recent_time_msecs, mongodb_ss_wt_checkpoint_total_failed_number_of_checkpoints, mongodb_ss_wt_checkpoint_total_succeed_number_of_checkpoints]
    evaluate_on: self
    evidence: code
    source: mg-src
    refs: [mg-syncdelay, mg-exp, ver-mg60-wt-ckpt, ver-mg70-wt-ckpt, ver-mg80-wt-ckpt, ver-mg80-wt-ckpt-failed]
    upstream: { status: no }
    rules: [rules/targets/mongodb.yml#MongoDBCheckpointSlow, rules/targets/mongodb.yml#MongoDBCheckpointFailed]

  # ---------- capacity ----------
  - id: oplog-growth
    aspect: capacity
    section: misuse
    tier: 2
    question: oplog 有沒有長到超過設定大小
    signal: >-
      mongodb_oplog_stats_storageStats_size 對 mongodb_oplog_stats_storageStats_maxSize。oplog 只在超過上限、而且最舊那段沒被 stable timestamp（跟著 majority commit point）
      或 backup 釘住時才截斷；截斷是背景執行緒整段刪，不是即時
    metrics: [mongodb_oplog_stats_storageStats_size, mongodb_oplog_stats_storageStats_maxSize]
    evaluate_on: self
    silent_failure: 實測 2MB 的 oplog：寫 10MB 後 150 秒內沒有截斷；m2、m3 都卡住時長到 5.4MB，解鎖 20 秒後 6.7MB。截斷是背景、延後的，「size > maxSize」短時間成立是正常的，規則要 1.5 倍加 for
    evidence: tested
    source: mg-lab
    refs: [mg-exp, mg-oplog-capacity, mg-oplog-pinned, mg-pinned-rollback, mg-pinned-stable, mg-oplog-markers-min, mg-oplog-check-period]
    upstream: { status: no }
    rules: [rules/targets/mongodb.yml#MongoDBOplogOverMaxSize]

  - id: disk-usage
    aspect: capacity
    section: misuse
    tier: 2
    question: dbPath 所在的檔案系統快滿了嗎
    signal: >-
      --collector.dbstats 的 mongodb_dbstats_fsUsedSize / mongodb_dbstats_fsTotalSize（每個 database 一份，取 max）；預設不開，lab 只有 --collect-all 的 exporter 有。
      Atlas 建議 > 90% 低優先、> 95%（5 分鐘）高優先，PMM 預設 85%。沒開 dbstats 就用 node_exporter 的 node_filesystem_avail_bytes
    metrics: [mongodb_dbstats_fsUsedSize, mongodb_dbstats_fsTotalSize, mongodb_dbstats_dataSize, mongodb_dbstats_indexSize]
    evaluate_on: self
    evidence: tested
    source: mg-lab
    refs: [mg-exp, mx-flag-dbstats, pmm-disk]
    upstream: { status: partial, note: "PMM 有 fsUsedSize / fsTotalSize > 85%，前提是開了 dbstats" }
    rules: [rules/targets/mongodb.yml#MongoDBDiskSpaceLow]

# 不正確的請求：客戶端送了寫法不好的查詢時，看得到什麼、看不到什麼。
bad_queries:
  - case: collection scan、缺 index
    signals: [bad-queries, op-latency, wt-cache, tickets]
    visible: >-
      rate(mongodb_ss_metrics_queryExecutor_scannedObjects) 對 rate(mongodb_ss_metrics_document{doc_op_type="returned"}) 的比例變大、
      queryExecutor_collectionScans_total 增加；症狀是 opLatencies、ticket 排隊、應用執行緒做 eviction
    not_visible: 哪個 namespace、哪種 query shape、執行計畫（只在 profiler 與 slow query log）
    refs: [mg-exp-names, mg-curop-docs-examined, mg-curop-keys-examined, mg-curop-returned, mx-doc-label]
  - case: 不能用 index 排序（記憶體內排序）
    signals: [bad-queries]
    visible: mongodb_ss_metrics_operation_scanAndOrder 增加（計畫裡有 SORT stage）
    not_visible: 哪個查詢、排序用了多少記憶體
    refs: [mg-curop-scanandorder, mg-exp-names]
  - case: 沒有上限的查詢（大結果集、cursor 一直開著）
    signals: [bad-queries, cursors]
    visible: mongodb_ss_metrics_cursor_open 累積、getMore 次數、cursor 閒置 10 分鐘後的 timedOut
    not_visible: 單一查詢回傳多少位元組、是哪個應用
    refs: [mg-exp-names, mg-cursor-timeout, mg-cursor-timedout]
  - case: 長時間執行的操作或持有鎖
    signals: [bad-queries, tickets, exporter-query-timeout]
    visible: >-
      --collector.currentopmetrics 的 mongodb_currentop_query_uptime{ns,op}（超過 slow-time，預設 5m）；設了 maxTimeMS 時 killedDueToMaxTimeMSExpired；
      globalLock_currentQueue；持有 global 鎖時 exporter 只回 44 個 sample、mongodb_up 不存在（實測 sleep lock:w 12 秒）
    not_visible: currentopmetrics 沒開時執行中的操作；沒設 maxTimeMS 的長查詢沒有計數
    refs: [mx-flag-currentop, mx-flag-currentop-slow, mx-currentop-uptime, mg-curop-maxtimems, mg-exp, mg-sleep-global]
  - case: 大文件、接近 16MB 上限
    signals: [bad-queries]
    visible: 只有 collstats collector 的每個 collection 平均大小（lab 的 --collect-all 有 avgObjSize）
    not_visible: 文件大小的分布、哪一筆大；serverStatus 沒有這類計數
    refs: [mx-flag-collectall, mg-exp]

blind_spots:
  - what: 每個查詢的慢查詢、執行計畫、collection scan
    category: database
    why: serverStatus 只有總數（opLatencies、queryExecutor.scanned）；逐查詢資料在 profiler（system.profile）與 slow query log，profiler 預設關
    workaround: "`--collector.profile`（只算 system.profile 的筆數）、slow query log 進 log 管線，或 PMM Query Analytics"
    options: "建議：slow query log 進 log 管線；或 PMM Query Analytics；profiler 只在需要時短暫打開"
    section: targets/mongodb.md#blind-spots
  - what: collection 與 index 層級的大小、延遲與使用率
    category: exporter
    why: 要 --collector.collstats／indexstats 加 --discovering-mode 或列出 namespace，每次 scrape 對每個 collection 跑 $collStats／$indexStats，成本依 collection 數成長
    workaround: "只列重要的 namespace（`--mongodb.collstats-colls`），並用 `--collector.collstats-limit` 設上限；或另開一個長 scrape_interval 的 job"
    options: "建議：--mongodb.collstats-colls 只列重要的 namespace，設 --collector.collstats-limit，或長間隔的獨立 job"
    section: targets/mongodb.md#blind-spots
  - what: sharded cluster（mongos、config server、balancer、chunk 分布）
    category: other
    why: lab 只有 replica set；exporter 的 sharding metric 只在 mongos 上、compatible mode 才有，沒有驗證
    workaround: 每個 shard 的每個 member 各一個 exporter、每個 mongos 一個；balancer 的狀態另用 `sh.status()` 定期檢查
    options: "建議：每個 shard member 與 mongos 各一個 exporter；balancer 狀態用 sh.status() 定期檢查（未驗證）"
    section: targets/mongodb.md#cluster
  - what: FTDC（diagnostic.data）保留了多久、在不在持久磁碟
    category: database
    why: 目錄上限 250MB 循環覆寫，能涵蓋多久依負載；exporter 讀的是 getDiagnosticData 的最新樣本，不是檔案
    workaround: 盤點時確認 dbPath 在持久磁碟、`diagnosticDataCollectionDirectorySizeMB` 夠大；事件後先複製目錄
    options: "建議：盤點 dbPath 在持久磁碟、diagnosticDataCollectionDirectorySizeMB 夠大；事件後先複製目錄"
    section: targets/mongodb.md#protection
  - what: 備份有沒有成功
    category: other
    why: MongoDB 沒有內建排程備份；Percona Backup for MongoDB 要 `--collector.pbm`，mongodump／檔案快照要自己的 metric
    workaround: "`--collector.pbm`（PMM 的 PBM 範本）或備份工具的 textfile"
    options: "建議：--collector.pbm 或備份工具的 textfile metric"
    section: targets/mongodb.md#protection
  - what: 主機記憶體、swap、磁碟延遲、CPU、OOM kill
    category: other
    why: 不在 serverStatus 裡（`systemMetrics` 只在 Linux 的 FTDC 有一部分）；Atlas 的 IOPS、swap、steal 建議都是主機層
    workaround: node_exporter 與 cAdvisor。主機層規則只讀碼，host lab 之後排程
    options: "已補：node_exporter 與 cAdvisor 的記憶體、swap、磁碟延遲、CPU、OOM 規則（主機層只讀碼）"
    section: targets/mongodb.md#saturation
    covered_by:
      tool: "node_exporter v1.12.1（容器另加 cAdvisor／kube-state-metrics）"
      config: rules/host/meta.yml
      metrics: [node_memory_MemAvailable_bytes, node_pressure_memory_stalled_seconds_total, node_vmstat_pswpin, node_vmstat_pswpout, container_memory_working_set_bytes, container_spec_memory_limit_bytes, node_disk_write_time_seconds_total, node_disk_writes_completed_total, node_disk_read_time_seconds_total, node_disk_reads_completed_total, node_pressure_io_stalled_seconds_total, node_pressure_cpu_waiting_seconds_total, node_vmstat_oom_kill, container_oom_events_total]
      rules: [HostMemoryLow, HostMemoryPressure, HostSwapping, ContainerMemoryNearLimit, HostDiskWriteLatencyHigh, HostDiskReadLatencyHigh, HostIOPressure, HostCPUPressure, ContainerCPUThrottled, HostOOMKill, ContainerOOMEvent, ContainerOOMKilled]
      refs: [res-ne-mem-avail, res-ne-psi-mem, res-ne-vmstat-fields, res-cadv-wss, res-cadv-wss-calc, res-cadv-memlimit, res-ne-disk-writetime, res-ne-disk-writes, res-ne-disk-readtime, res-ne-disk-reads, res-ne-psi-io, res-ne-psi-cpu, res-cadv-throttled, res-cadv-periods, res-km-throttling, res-ne-vmstat-fields, res-cadv-oom, res-ksm-terminated, res-ksm-restarts]
  - what: 磁碟 IOPS 是否到雲端磁碟的配額、CPU steal
    category: other
    why: node_exporter 只看得到完成的 IO 數與時間，不知道雲端磁碟的 IOPS 上限；steal 有 node_cpu_seconds_total{mode="steal"}，主機層卡片沒有規則
    workaround: 雲端供應商的磁碟 metric；steal 用 rate(node_cpu_seconds_total{mode="steal"}) 畫圖
    options: "建議：雲端供應商的磁碟 metric；steal 用 node_cpu_seconds_total{mode=\"steal\"} 畫圖"
    section: targets/mongodb.md#saturation
  - what: 憑證到期、版本漏洞
    category: other
    why: TLS 沒開時 `security.SSLServerCertificateExpirationDate` 不存在；PMM 的 CVE 範本用 `mongodb_version_info`（compatible mode）
    workaround: blackbox 的 TLS 探測；版本另外盤點
    options: "建議：blackbox 的 TLS 探測；版本另外盤點"
    section: targets/mongodb.md#protection
  - what: 哪個 namespace、哪種查詢形狀造成 collection scan 或 scanned／returned 偏高
    category: database
    why: queryExecutor、document、scanAndOrder 都是全實例的計數器（bad-queries 訊號），沒有 namespace 或 query shape；逐查詢的 docsExamined、planSummary 只在 profiler 與 slow query log
    workaround: slow query log 進 log 管線；或 --collector.profile 只看 system.profile 的筆數
    options: "建議：slow query log 進 log 管線；--collector.profile 只算 system.profile 筆數"
    section: targets/mongodb.md#workload
  - what: 大文件（接近 16MB 上限）與過大的回應
    category: database
    why: serverStatus 沒有文件大小的分布；collstats collector 的 avgObjSize（lab 的 --collect-all 有）只是每個 collection 的平均
    workaround: slow query log 的回應大小；或應用端在寫入前檢查大小
    options: "建議：slow query log 的回應大小；應用端在寫入前檢查文件大小"
    section: targets/mongodb.md#workload
  - what: 執行中的長操作（currentopmetrics 沒開時）
    category: exporter
    why: 計數器在操作結束時才加；--collector.currentopmetrics 預設關，開了也只列超過 slow-time（預設 5m）的操作
    workaround: 開 --collector.currentopmetrics 並調短 slow-time；或定期 db.currentOp() 進 log 管線
    options: "建議：開 --collector.currentopmetrics 並調短 slow-time；或定期 db.currentOp() 進 log 管線"
    section: targets/mongodb.md#workload
