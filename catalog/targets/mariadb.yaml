id: mariadb
name: mysqld_exporter＋MariaDB
kind: target
model: exporter
exporter: mysqld_exporter
family: database
status: draft
stages: [source]
versions_checked: ["mysqld_exporter 0.21.0", "MariaDB 10.6.28", "MariaDB 10.11.19", "MariaDB 11.4.13（lab 與原始碼參考）", "MariaDB 11.8.9", "MariaDB 12.3.3"]
architecture: architecture/exporters.md
role: >-
  只寫 MariaDB。MySQL 的原始碼與行為不同，另有一張卡（[mysql](mysql.md)）；兩張卡共用的訊號 id 相同，
  但證據都引用各自的原始碼與 lab。mysqld_exporter 用同一個程式抓兩種資料庫，只有 eventsstatements 與 innodb_tablespaces 會依 @@version 是否含 mariadb 改查詢。
  Exporter 有三層「活著」：Prometheus 抓得到 exporter（up）、exporter 連得到資料庫（mysql_up）、
  每個 collector 的查詢成功（mysql_exporter_collector_success）。每一層壞掉時，下一層的 series 不是變 0，
  而是整組消失，所以用 != 1 或 == 0 寫的規則會回傳空。metric 前綴仍是 mysql_（exporter 決定的），規則的 job="mariadb" 是佔位符。
  版本差異（10.6、10.11、11.4、11.8、12.3 五條 LTS 線）從原始碼整理在[MariaDB 各版本的監控差異](../targets/versions/mariadb.md)；
  會隨版本變的訊號在 signal 或 applies_when 寫明。lab 跑的是 MariaDB 11.4.13，其他版本線只讀碼。
  規則範例在 rules/targets/mariadb.yml。
  訊號依九個面向分組（aspect 欄位）：exporter、availability、workload、saturation、replication、cluster（Galera）、
  maintenance（purge、救援模式、碎片）、protection（binlog、耐久性、備份）、capacity（磁碟、auto_increment、連線高水位）。
  資料庫本身該監控什麼、每個訊號由哪個 collector 提供、需要什麼權限，整理在 docs/targets/mariadb.md；查詢與 session 分析在 docs/targets/mariadb-ash.md。

silent_failures:
  - text: >-
      Exporter 停機時 mysql_up 這條 series 消失，mysql_up != 1（mixin MySQLDown）與 mysql_up == 0（awesome）
      都回傳空，不會觸發；只有 up{job="mariadb"} == 0 與 absent(mysql_up) 成立。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
  - text: >-
      資料庫停機時 up 仍是 1，mysql_up 變 0，但 mysql_exporter_collector_success 整組消失，
      所以 collector_success == 0 在這時也不會響；mysql_* 只剩 mysql_up。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
  - text: >-
      資料庫主機停機時連線會一直等到 context 取消，scrape 耗時約等於 scrape_timeout 減 --timeout-offset（預設 0.25s），
      實驗中 scrape_timeout 4s 時是 3.75s。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
  - text: >-
      --timeout-offset 大於等於 scrape_timeout 時 exporter 只記一行錯誤、不設期限；Prometheus 先逾時，up 變 0，
      所有 mysql_* 消失，症狀從「資料庫停機」變成「exporter 停機」。
    evidence: code
    source: mysqld-exporter-main
  - text: >-
      收回 PROCESS 後 innodb_cmp、innodb_cmpmem、innodb_metrics 的 collector_success 變 0，相關 metric 消失
      （實驗 1150 → 1060 條 series），awesome 的 history_len 規則回傳空；up 與 mysql_up 都是 1。
      processlist collector 仍回報成功，但沒有 PROCESS 只看得到自己的連線，數字偏低。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
  - text: >-
      SHOW SLAVE STATUS 要 SLAVE MONITOR（REPLICA MONITOR 同義）；REPLICATION CLIENT 在 MariaDB 只是 BINLOG MONITOR 的別名，
      照 exporter README 給 PROCESS、REPLICATION CLIENT、SELECT 時，replica 上的 slave_status collector_success 變 0，所有 mysql_slave_status_* 消失，
      replication 規則回傳空。10.6／10.11 的 SUPER 還涵蓋 SLAVE MONITOR、BINLOG MONITOR；11.0 起不涵蓋，
      在 11.x 新建、只給 SUPER 的帳號也一樣失敗（從 10.x 升上來的帳號載入 grant 表時會自動補上）。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, ver-mdb-repl-client-alias, ver-mdb-slave-monitor-kw, ver-ex-readme-grants, ver-mdb1011-slave-status-priv, ver-mdb114-slave-status-priv, ver-mdb114-super-upgrade]
  - text: >-
      SQL thread 停止或 IO thread 不是 Yes 時 Seconds_Behind_Master 是 NULL，exporter 解析失敗就不輸出，延遲規則回傳空；
      非 replica 的節點 slave_status 成功但沒有任何 series，和「權限不足被吃掉」從 metric 上很難區分。
    evidence: code
    source: mysqld-exporter-slave-status
    refs: [my-trace-mdb-sbm-null, my-slave-skip]
  - text: >-
      沒有啟用 Galera 的 MariaDB 也輸出 mysql_global_status_wsrep_ready=0，mixin 與 awesome 的
      wsrep_ready != 1 會對每台普通 MariaDB 誤報；被誤報洗過之後，真正的 Galera 告警容易被靜音。
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, my-trace-mdb-wsrep-ifdef]
  - text: >-
      exporter 的版本判斷把 @@version 的「主版號.次版號」轉成浮點數（10.6、10.11、11.4…），都大於所有 collector 的門檻（最高 8.0），
      所以 MySQL 專用的 collector 也不會被跳過：perf_schema.replication_applier_status_by_worker 開了一定失敗（MariaDB 的表沒有 exporter 要的欄位）。
      透過 collect[] 參數或改啟動旗標少掉的 collector 不會回報失敗。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, ver-ex-version-float, ver-ex-version-gate, ver-mdb-pfs-worker-cols, ver-ex-applier-version]
  - text: >-
      query_response_time collector 預設開；沒裝 plugin 時 @@query_response_time_stats 查不到，collector 回報成功、沒有 series，看不出來沒在量。
    evidence: code
    source: mysqld-exporter-src
    refs: [ver-ex-qrt-nil, my-default-collectors]
  - text: >-
      多 target 模式（/probe）下一台 exporter 掛掉，所有 target 的 up 同時變 0，看起來像所有資料庫一起壞；
      /probe 的輸出不含 exporter 自己的 process 與 go 指標，要另外一個 job 抓 /metrics。
    evidence: code
    source: mysqld-exporter-main
  - text: >-
      每次 scrape 開新連線（預設最多 2 條）。兩台 HA Prometheus 同時抓，或多 target 併發時，
      可能超過 README 建議的 MAX_USER_CONNECTIONS 3，mysql_up 間歇變 0，而且只在其中一台 Prometheus 上看得到。
    evidence: inferred
    source: mysqld-exporter-readme
  - text: >-
      連線數打滿 max_connections 時，exporter 一般帳號也收到 Error 1040，mysql_up 變 0、threads_connected 消失，
      「連線數 / max_connections > 0.8」這類規則在最需要時回傳空；只有 mysql_up 規則與事後的
      connection_errors_total{error="max_connections"} 看得到。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, mariadb-conn-errors]
  - text: >-
      max_connections 之外還有一條給 CONNECTION ADMIN 的連線；exporter 預設開兩條連線，給了 CONNECTION ADMIN 也只有一條進得去（讀碼；
      lab 這一段 MariaDB 的 32 條 app 連線沒有全部建立，不算數）。
    evidence: code
    source: mariadb-server-src
    refs: [my-q-mdb-ignore-maxconn, my-q-mdb-conn-check, my-trace-mdb-conn-check]
  - text: >-
      IO thread 停止時 Seconds_Behind_Master 是 NULL，exporter 不輸出；heartbeat 延遲同時持續變大。
      只看 Seconds_Behind 的延遲規則在 replica 斷線時安靜。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-mdb-sbm-null]
  - text: >-
      heartbeat 寫入程式若是 primary 上的 EVENT，failover 後在新 primary 上是 SLAVESIDE_DISABLED，heartbeat 停住；
      寫入程式要跟著 primary 角色走（例如 pt-heartbeat 由 HA 工具啟動）。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      靜態的 role="primary" label 在 failover 後指向舊節點，MariaDBPrimaryReadOnly 之類的規則查不到任何東西；
      舊 primary 回來時兩台都可寫，只有從 metric 推角色的規則（MariaDBMultipleWritable）看得到。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha]
  - text: >-
      gtid_binlog_pos、gtid_binlog_state 是字串，global_variables 解析失敗就跳過；在 replica 上誤寫造成的 errant GTID 沒有任何 metric 會變。
      replica 的 Gtid_Slave_Pos 會被拆成 mysql_slave_status_gtid_slave_pos{domain_id,server_id}，但 errant 交易在 gtid_binlog_pos，不在這裡。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-global-variables-parse, my-trace-ex-slave-gtid, my-trace-mdb-gtid-binlog-pos]
  - text: >-
      Semi-sync 是內建的，沒開時 rpl_semi_sync_master_status 也是 0，所以 status == 0 一定要和 enabled == 1 一起看；
      等 ACK 逾時後退回 async 時 commit 照常成功。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-mdb-semisync-status, ver-mdb123-semisync-master]
  - text: >-
      performance_schema 在五條線都預設 OFF（要重啟才能開），sys.user_summary 與 perf_schema.* collector 回報成功但沒有任何 series。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, ver-mdb-pfs-default-off, ver-mdb123-pfs-default-off]
  - text: >-
      innodb_trx collector 在沒有交易時不輸出任何 series（不是 0），沒開 collector 和「沒有長交易」看起來一樣；
      要靠 collector_success 確認它在跑。
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-innodb-trx-query]
  - text: >-
      11.8 起 replica 狀態的 Master_last_event_time、Slave_last_event_time 是沒有時區的 datetime，exporter 當 UTC 解析成 Unix 秒；
      伺服器時區不是 UTC 時兩個時間戳會差一個時區偏移（推論，未實測）。
    evidence: code
    source: mysqld-exporter-src
    refs: [ver-mdb118-last-event-time, ver-ex-parse-datetime]

contracts:
  - scrape-within-interval
  - lookback
  - exporter-deadline

signals:
  # ---------- Exporter：它真的在量嗎 ----------
  - id: exporter-up
    aspect: exporter
    tier: 1
    question: Exporter 抓得到嗎
    signal: up{job="mariadb"} == 0，加上 absent(up{job="mariadb"})；不能只靠 mysql_up
    metrics: [up]
    evaluate_on: self
    silent_failure: Exporter 停機時 mysql_up 消失，mixin 的 MySQLDown 不會響
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
    upstream: { status: no, note: "mixin 與 awesome 都只看 mysql_up；kps 的 TargetDown 只在用 kps 時有" }
    rules: [rules/targets/mariadb.yml#MariaDBExporterDown, rules/targets/mariadb.yml#MariaDBExporterMissing]

  - id: db-up
    aspect: exporter
    tier: 1
    question: Exporter 連得到資料庫嗎
    signal: mysql_up == 0（只代表連線與 SELECT @@version 成功，不代表查詢或寫入可用）
    metrics: [mysql_up]
    evaluate_on: self
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, exp-mysql-ha]
    upstream: { status: partial, note: "mixin 的 mysql_up != 1 與 awesome 的 mysql_up == 0 都有，但 exporter 停機時一起失效" }
    rules: [rules/targets/mariadb.yml#MariaDBNotReachable]

  - id: collectors-present
    aspect: exporter
    tier: 1
    question: Exporter 有回應，collector 的結果還在嗎
    signal: up == 1 但 mysql_exporter_collector_success 完全沒有 series
    metrics: [up, mysql_exporter_collector_success]
    evaluate_on: self
    silent_failure: 資料庫停機時 collector_success 整組消失（不是變 0），MariaDBCollectorFailed（== 0）回傳空
    evidence: tested
    source: art-mysql
    refs: [exp-mysql]
    upstream: { status: no, note: "mixin 與 awesome 都沒有" }
    rules: [rules/targets/mariadb.yml#MariaDBCollectorsMissing]

  - id: collector-success
    aspect: exporter
    tier: 1
    question: 關鍵 collector 都成功嗎
    signal: >-
      mysql_exporter_collector_success == 0；權限不足（SLAVE MONITOR、PROCESS）、表不存在（例如 heartbeat、MariaDB 沒有欄位的
      perf_schema.replication_applier_status_by_worker）時會變 0
    metrics: [mysql_exporter_collector_success]
    evaluate_on: self
    silent_failure: 資料庫停機時整組消失；被跳過的 collector 不會出現
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, exp-mysql-ha]
    upstream: { status: no, note: "mixin 與 awesome 都沒有" }
    rules: [rules/targets/mariadb.yml#MariaDBCollectorFailed]

  - id: custom-queries
    aspect: exporter
    tier: 1
    question: 補盲點的自訂查詢（query-exporter）還在跑嗎
    signal: >-
      query-exporter 5.2.2 的內建 metric：up{job="query-exporter"}、queries_total{query=~"mariadb_.*", status!="success"} 與 database_errors_total 的增加量
      （設定裡叫 queries、database_errors，輸出時 counter 加 _total）。查詢由排程執行，失敗時自訂 metric 不更新；設了 expiration 的 series
      在 expiration 後消失，所以 MariaDBConnectionsExhausted、MariaDBErrantGtid 這類規則在查詢失敗時回傳空，要靠這三條補位。
      實驗：mdb2 停機約 90 秒後自訂 series 全部消失，database_errors_total 2
    metrics: [up, queries_total, database_errors_total, query_timestamp, query_interval]
    evaluate_on: self
    applies_when: "有部署 queries/query-exporter/mysql.yaml"
    silent_failure: >-
      欄位名稱或數量和設定不符時查詢被永久移除（不重試），之後只剩停止更新的 query_timestamp；
      沒設 expiration 的 metric 在資料庫停機後一直停在最後一個值
    evidence: tested
    source: query-exporter
    refs: [my-q-exp, my-q-qe-fatal, my-q-qe-doomed, my-q-qe-expiration, my-q-qe-connect-error, my-q-qe-query-timestamp, my-q-qe-interval-labels]
    upstream: { status: no }
    rules:
      - rules/targets/mariadb.yml#MariaDBCustomQueryExporterDown
      - rules/targets/mariadb.yml#MariaDBCustomQueryFailing
      - rules/targets/mariadb.yml#MariaDBCustomQueryStale

  - id: probe-blast-radius
    aspect: exporter
    tier: 1
    question: 多 target 模式下是 exporter 壞還是資料庫壞
    signal: 同一個 job 超過一半的 up 同時是 0；另外用一個 job 抓 exporter 自己的 /metrics
    metrics: [up]
    evaluate_on: self
    applies_when: multi-target probe
    evidence: code
    source: mysqld-exporter-main
    upstream: { status: no }
    rules: [rules/targets/mariadb.yml#MariaDBProbeExporterDown]

  - id: exporter-grants
    aspect: exporter
    tier: 1
    question: Exporter 帳號的權限與連線上限夠嗎
    signal: >-
      GRANT PROCESS, BINLOG MONITOR, SLAVE MONITOR, SELECT（REPLICATION CLIENT 只等於 BINLOG MONITOR；要 --collect.slave_hosts 再加 REPLICATION MASTER ADMIN）。
      11.0 起 SUPER 不再涵蓋 SLAVE MONITOR、BINLOG MONITOR，11.x 新建的帳號要明寫；從 10.x 升上來的帳號會自動補上，所以同一份部署腳本在新舊環境結果不同。
      MAX_USER_CONNECTIONS ≥ max_open_connections ×（同時抓的 Prometheus 數 + /probe 併發數）。密碼輪替要包含 exporter 的 .my.cnf 或環境變數
    metrics: []
    evaluate_on: inventory
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, ver-mdb-repl-client-alias, ver-mdb-slave-monitor-kw, ver-mdb1011-slave-status-priv, ver-mdb114-slave-status-priv, ver-mdb1011-binlogs-priv, ver-mdb114-binlogs-priv, ver-mdb114-super-upgrade, ver-mdb114-slave-hosts-priv, ver-ex-readme-grants]
    upstream: { status: partial, note: "README 只列 PROCESS、REPLICATION CLIENT、SELECT，沒提 SLAVE MONITOR；沒有對應的檢查或規則" }
    rules: []

  - id: exporter-query-timeout
    tier: 2
    aspect: exporter
    question: Exporter 的查詢會不會被鎖或連線上限卡住
    signal: "`--exporter.lock_wait_timeout`（預設開啟、2 秒）避免被 metadata lock 卡住；`--exporter.query_timeout` 限制單一 collector。連線打滿時 exporter 自己也被擋，`mysql_up` 變 0，要讓查詢走 `extra_port`（見 blind_spots）"
    metrics: [mysql_up, mysql_global_status_connection_errors_total]
    evaluate_on: self
    silent_failure: max_connections 打滿時 exporter 也收到 Error 1040，依連線比例寫的規則回傳空
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-lock-wait-timeout, my-querytimeout]
    upstream: { status: no }
    rules: []

  - id: collector-set
    aspect: exporter
    tier: 2
    question: 回報的 collector 數量有沒有變少
    signal: >-
      count(mysql_exporter_collector_success) 比一小時前少；搭配盤點應有的 collector 清單。
      MariaDB 的版本號轉成浮點數後都大於門檻，collector 不會因版本被跳過，少掉的只會是參數或旗標
    metrics: [mysql_exporter_collector_success]
    evaluate_on: self
    evidence: code
    source: mysqld-exporter-src
    refs: [ver-ex-version-float, ver-ex-version-gate]
    upstream: { status: no }
    rules: [rules/targets/mariadb.yml#MariaDBCollectorSetShrunk]

  - id: scrape-budget
    aspect: exporter
    tier: 2
    question: Scrape 來得及在 timeout 內完成嗎
    signal: >-
      scrape_duration_seconds 接近 scrape_timeout；各 collector 的 collector_duration_seconds。
      exporter 用 X-Prometheus-Scrape-Timeout-Seconds 減 --timeout-offset 當期限；
      --exporter.query_timeout 讓單一慢 collector 失敗而不拖垮其他 collector；lock_wait_timeout 預設 2 秒。
      實驗：資料庫主機停機時 3.75 秒（scrape_timeout 4s）；CPU 限到 0.1 核時 0.97 秒
    metrics: [scrape_duration_seconds, mysql_exporter_collector_duration_seconds]
    evaluate_on: self
    evidence: tested
    source: art-mysql
    refs: [exp-mysql, exp-mysql-perf]
    upstream: { status: no }
    rules: [rules/targets/mariadb.yml#MariaDBScrapeNearTimeout, rules/targets/mariadb.yml#MariaDBCollectorSlow]
    contract: exporter-deadline

  - id: db-up-flapping
    aspect: exporter
    tier: 2
    question: mysql_up 有沒有間歇掉下來
    signal: changes(mysql_up[15m]) > 2；常見原因是連線數超過 MAX_USER_CONNECTIONS 或 max_connections
    metrics: [mysql_up]
    evaluate_on: self
    evidence: inferred
    source: mysqld-exporter-readme
    upstream: { status: no }
    rules: [rules/targets/mariadb.yml#MariaDBUpFlapping]

  # ---------- 穩定：資料庫自己會不會停、卡住、進救援模式 ----------
  - id: restarts
    aspect: availability
    tier: 3
    question: 資料庫重啟過或在救援模式嗎
    signal: >-
      uptime < 300（crash、OOM kill、手動重啟都會歸零）。救援模式（innodb_force_recovery）見 force-recovery。
      停機短於 MariaDBNotReachable 的 for 時只有 uptime 看得出來；OOM 的原因要看 kernel log 或容器事件，exporter 看不到
    metrics: [mysql_global_status_uptime]
    evaluate_on: self
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-trace-mdb-uptime]
    upstream: { status: yes, note: "awesome 用 uptime < 60，短於一個 scrape 週期加 for 時容易漏" }
    rules: [rules/targets/mariadb.yml#MariaDBRestarted]

  - id: crash-oom
    aspect: availability
    tier: 3
    question: 資料庫被 OOM kill 或 crash 後，看得出來嗎
    signal: >-
      單次 OOM kill：容器 3 秒內完成 recovery，scrape 5 秒時只抓到一次 mysql_up = 0，下一次 uptime 已是 7–8；
      用 resets(mysql_global_status_uptime[...]) 或 uptime < 300 看。一直被 kill 但每次都起得來：resets(uptime[1h]) > 1。
      每次啟動 2 秒就退出的 crash loop（實驗：tablespace 檔案不見時 crash recovery 失敗）：uptime 一次都沒被抓到，只有 mysql_up 規則看得到
    metrics: [mysql_global_status_uptime, mysql_up]
    evaluate_on: self
    silent_failure: >-
      MariaDBNotReachable（for 1m）在單次 OOM 時不會響；OOM 原因不在任何 mysql_* metric 裡，要看主機或容器層（host 卡的 oom-kills）。
      實驗中把 buffer pool 加到超過容器上限的那一刻就被 kill，不是慢慢長上去
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf]
    upstream: { status: partial, note: "awesome 有 uptime < 60；沒有重複重啟的規則" }
    rules: [rules/targets/mariadb.yml#MariaDBRestarted, rules/targets/mariadb.yml#MariaDBRestartedRepeatedly, rules/targets/mariadb.yml#MariaDBNotReachable]

  - id: disk-space
    aspect: capacity
    tier: 2
    question: 資料目錄與 binlog 的磁碟還夠嗎
    signal: >-
      node_exporter 看資料目錄所在的檔案系統剩餘比例；binlog 用量用 --collect.binlog_size，11.4 起也可以看 Binlog_disk_use（mysql_global_status_binlog_disk_use）。
      InnoDB 資料檔長不出去時是立刻回 ERROR 1114（實驗：24 MB tmpfs 上的表），其他表照常寫入；兩種情況 mysql_up 都仍是 1。
      11.8 起暫存空間有用量（Tmp_space_used）與上限（max_tmp_total_space_usage），超過時查詢被擋
    metrics: [node_filesystem_avail_bytes, node_filesystem_size_bytes, mysql_binlog_size_bytes]
    evaluate_on: self
    silent_failure: >-
      mysqld_exporter 沒有任何磁碟用量的 metric；1114 只出現在語句錯誤數（perf_schema.eventsstatementssum，要開 performance_schema）。
      tablespace 檔案不見時（實驗：tmpfs 上的 DATA DIRECTORY 在重啟後是空的）crash recovery 失敗、2 秒退出，進入重啟迴圈
    evidence: tested
    source: art-mysql-perf
    refs: [exp-mysql-perf, ver-mdb114-binlog-disk-use, ver-mdb118-tmp-space, ver-mdb118-max-tmp-total]
    upstream: { status: no, note: "mixin 與 awesome 都沒有；要靠 node_exporter 的通用磁碟規則，且要知道資料目錄在哪個掛載點" }
    rules: [rules/targets/mariadb.yml#MariaDBDataDiskFilling, rules/targets/mariadb.yml#MariaDBDataDiskFillingSoon]

  - id: long-transactions
    aspect: maintenance
    tier: 2
    question: 有沒有開太久的交易
    signal: >-
      max(mysql_info_schema_innodb_trx_oldest_transaction_age_seconds) > 300。
      要 --collect.info_schema.innodb_trx（預設關）與 PROCESS；沒有交易時這個 metric 整個不存在，不是 0
    metrics: [mysql_info_schema_innodb_trx_oldest_transaction_age_seconds, mysql_info_schema_innodb_trx_transactions]
    evaluate_on: self
    silent_failure: 沒有 PROCESS 時只看得到自己的交易；沒開 collector 時沒有任何訊號
    evidence: tested
    source: art-mysql-ha
    refs: [exp-mysql-ha, my-innodb-trx-query, my-trace-mdb-trx-started]
    upstream: { status: no, note: "mixin 與 awesome 都沒有長交易規則" }
