  - id: deadlocks
    aspect: workload
    tier: 3
    question: Deadlock 變多了嗎
    signal: >-
      mysql_global_status_innodb_deadlocks（預設就有，五條線都有）。innodb_metrics 也有 lock_deadlocks，但 MariaDB 的 type 是 value，
      名稱是 ..._lock_lock_deadlocks（沒有 _total）
