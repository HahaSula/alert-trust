# 信任契約。anchor 對應 docs/contracts.md 的段落，元件卡與規則用 id 引用。
contracts:
  scrape-within-interval:
    applies_to: [prometheus, vmagent]
    expr: "d ≤ S"
    violation: Tick 被丟掉，實際間隔 I 拉長，視窗內樣本變少
    evidence: code
    source: art-prom
    refs: [p-scrape-run, vmag-ticker, pqw-p3-scrape-run, pqw-p3-scrape-wait-tick, pqw-go-ticker-buffer]
  range-window:
    applies_to: [prometheus]
    expr: "R ≥ (2+k)·I + max(0, d − O)：沒有 offset 是 (2+k)·I + d，O ≥ d 是 (2+k)·I；適用要 2 個 sample 的函式（rate、increase、delta、irate、idelta、deriv、predict_linear、double_exponential_smoothing）"
    violation: 視窗內不足 2 個可見 sample，rate 回傳空，pending 被刪除，for 歸零
    evidence: tested
    source: art-prom
    refs: [exp-prom-range, exp-prom-silent, pqw-lab-promtool, pqw-p3-matrix-leftopen, pqw-p3-scrape-time, pqw-p3-alert-query, pqw-p3-extrap-min2, pqw-p3-instant-min2]
  group-within-interval:
    applies_to: [prometheus, vmalert]
    expr: "T ≤ E（預警門檻 0.8）"
    violation: 跳過 evaluation，同 group 的 alert 全部變慢，短暫事件可能漏掉
    evidence: tested
    source: art-prom
    refs: [exp-prom-cpu, p-group-missed, vma-missed]
  lookback:
    applies_to: [prometheus]
    expr: "I + max(0, d − O) < lookback（預設 5m，3.x 是嚴格小於）；只管 sample 晚到，scrape 失敗或 series 消失時 staleness marker 讓 selector 立刻變空"
    violation: 不用 range 的 selector（如 up == 0）間歇回傳空
    evidence: code
    source: art-prom
    refs: [exp-vm-faults, p-lookback, pqw-p3-lookback-open, pqw-p3-instant-stale, pqw-p3-failed-stale, pqw-lab-promtool]
  resend-endsat:
    applies_to: [prometheus, vmalert]
    expr: "續送中斷 < 4 × max(resend, E) − P，P = E × (⌊resend ÷ E⌋ + 1) 是實際續送週期（最差情況：中斷剛好從該續送的那一次開始）"
    violation: Alertmanager 在 EndsAt 自動 resolve，通知 firing／resolved 交替（假 resolved）
    evidence: tested
    source: art-vm
    refs: [p-alert-validuntil, exp-vm-resend, pqw-p3-validuntil, pqw-p3-needs-sending, pqw-vma-needs-sending, pqw-vma-resolve-duration]
  vm-range-window:
    applies_to: [vmalert]
    expr: "R ≥ (1+k)·I + max(0, L − D)：視窗前最後一個 sample 要在 step（-datasource.queryStep，預設 5m）內；不然，或用 rate_prometheus 這類函式，要 (2+k)·I + max(0, L − D)"
    violation: 視窗內沒有可見 sample，查詢回空，for 永遠歸零
    evidence: tested
    source: art-vm
    refs: [exp-vm-matrix, pqw-lab-server, pqw-vm-prev-value, pqw-vm-maxprev-step, pqw-vma-step-param, pqw-vm-rate-1sample]
  vl-log-delay:
    applies_to: [vmalert, victorialogs]
    expr: "L ≤ D 保證；L > D + E 必定漏"
    violation: Log 進來時視窗已過，事件永遠不觸發，事後卻查得到
    evidence: tested
    source: art-vm
    refs: [exp-vm-vl]
  range-window-1sample:
    applies_to: [prometheus]
    expr: "R ≥ (1+k)·I + max(0, d − O)：1 個 sample 就有值的函式（*_over_time、changes、resets、anchored）；absent_over_time 反過來，視窗太短會誤報消失"
    violation: 視窗內沒有可見 sample，結果是空；absent_over_time 在資料其實還在時回傳 1
    evidence: tested
    source: pqw-lab
    refs: [pqw-lab-promtool, pqw-lab-server, pqw-p3-aggr-over-time, pqw-p3-absent-over-time, pqw-p3-changes-first]
  am-failure-window:
    applies_to: [alertmanager]
    expr: "告警視窗 ≥ 2 × 最大 group_interval"
    violation: 失敗要整輪 flush 結束才計數，短視窗永遠抓不到單一 group 的持續失敗
    evidence: tested
    source: art-am
    refs: [exp-am-window]
  deadman-wait:
    applies_to: [observer, alertmanager]
    expr: "DMS 等待 > 4 × max(resend, E) + repeat_interval + group_interval"
    violation: 等待太短會誤報；ruler 停機後 Alertmanager 仍會重送到 EndsAt
    evidence: tested
    source: art-prom
    refs: [exp-prom-heartbeat]
  exporter-deadline:
    applies_to: [target]
    expr: "exporter 自己的查詢期限 < scrape_timeout < scrape_interval"
    violation: Prometheus 先放棄，up 變 0、所有 series 消失，看起來像 exporter 掛了；exporter 端的查詢還在跑
    evidence: tested
    source: pg-lab
    refs: [exp-pg, exp-mysql, pg-timeout, my-offset]
  thanos-partial-abort:
    applies_to: [thanos]
    expr: "abort 只對 querier 仍在查詢的 store 有效：store 斷線後一次健康檢查（endpoint.info-timeout，5s）就被移除"
    violation: 被移除的 store 不算錯誤，查詢回 success、沒有 warning，abort group 照樣用少掉的資料判斷 alert
    evidence: tested
    source: thanos-lab
    refs: [exp-thanos-store-loss, th-es-queryable, th-es-update, th-proxy-nomatch]
  thanos-upload-retention:
    applies_to: [thanos]
    expr: "上傳中斷 + 2h（block）+ store 同步（--sync-block-duration）< Prometheus 本地保留"
    violation: block 在上傳或被 store gateway 載入前就被 Prometheus 刪掉，那段時間查詢少資料、不報錯；沒上傳的部分永久遺失
    evidence: code
    source: thanos-src
    refs: [th-sc-ship, th-sc-maxt, th-store-sync]
  grafana-nodata-error:
    applies_to: [grafana_alerting]
    expr: "no_data_state、exec_err_state ≠ OK；選 NoData／Error 時，原 alert 在 missing_series_evals_to_resolve × E（預設 2E）後 resolved，DatasourceNoData／DatasourceError 要有路由"
    violation: 設成 OK 時資料消失或查詢失敗，alert 下一次評估就 resolved，沒有任何 alert；NoData 也沒有任何 counter
    evidence: tested
    source: graf-lab
    refs: [exp-graf-modes, graf-nodata-ok, graf-err-ok, graf-missing-series, graf-missing-default]
