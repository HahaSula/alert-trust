# 名詞表：每個「interval」「耗時」到底是哪個設定、哪個 metric。
# tokens：頁面裡用反引號寫出這些名稱時，hooks/refs.py 會自動連到這一筆。
# kind：config（設定項或 flag）、metric（可以查的 series）。
terms:
  # ---------- 設定 ----------
  scrape_interval:
    title: Scrape interval
    symbol: S
    kind: config
    systems: [prometheus, vmagent]
    tokens: [scrape_interval, global.scrape_interval, "scrape_configs[].scrape_interval"]
    where: "Prometheus：`global.scrape_interval`，每個 job 可在 `scrape_configs[].scrape_interval` 覆寫。vmagent：`-promscrape.config` 檔案裡同名的設定。"
    default: "1m（兩者相同）"
    observe:
      - "`/api/v1/targets` 的 `scrapeInterval`：這個 target 實際套用的設定值"
      - "`prometheus_target_interval_length_seconds`：實際的 scrape 間隔，和設定值比較就知道有沒有被拉長"
    note: "這是「設定值」。實際間隔 I 在 scrape 耗時超過它時會被拉長，見信任契約。"
    refs: [p-cfg-scrape-interval, vmag-default-interval]

  scrape_timeout:
    title: Scrape timeout
    kind: config
    systems: [prometheus, vmagent]
    tokens: [scrape_timeout, global.scrape_timeout]
    where: "`global.scrape_timeout`，可在 `scrape_configs[].scrape_timeout` 覆寫"
    default: "10s；不能大於 scrape_interval，否則設定檢查失敗"
    observe:
      - "`/api/v1/targets` 的 `scrapeTimeout`"
      - "Exporter 收到的 `X-Prometheus-Scrape-Timeout-Seconds` header"
    note: "只限制 HTTP 階段。`scrape_duration_seconds` 超過它卻成功時，多出來的時間花在 Prometheus 內部的 parse 與寫入。"
    refs: [p-cfg-scrape-timeout, p-cfg-timeout-check, p-scrape-report]

  evaluation_interval:
    title: Rule group 的 evaluation interval
    symbol: E
    kind: config
    systems: [prometheus, vmalert]
    tokens: [evaluation_interval, global.evaluation_interval, -evaluationInterval]
    where: "Prometheus：`global.evaluation_interval`，每個 group 可用 rule 檔的 `interval` 覆寫。vmalert：`-evaluationInterval`，group 的 `interval` 覆寫。"
    default: "1m（兩者相同）"
    observe:
      - "`prometheus_rule_group_interval_seconds`：每個 group 實際套用的值"
      - "`/api/v1/rules` 每個 group 的 `interval`"
    refs: [p-cfg-eval-interval, p-rulefmt-interval, vma-eval-interval, vma-cfg-interval, p-metric-group-interval]

  query_offset:
    title: Rule 的查詢 offset
    symbol: O
    kind: config
    systems: [prometheus]
    tokens: [query_offset, rule_query_offset]
    where: "2.53 起：rule group 的 `query_offset`，或全域 `global.rule_query_offset`。更舊的版本要在表達式的每個 selector 寫 `offset`。"
    default: "0"
    observe:
      - "`/api/v1/rules` 的 group `queryOffset`（2.53+）；API 不回傳表達式裡的 `offset`，要讀 rule 檔"
    note: "vmalert 對應的是 eval_delay。"
    refs: [p255-query-offset]

  for:
    title: Alert 的 for
    symbol: F
    kind: config
    systems: [prometheus, vmalert]
    tokens: [for]
    where: "Rule 定義的 `for`"
    default: "0"
    observe:
      - "`ALERTS_FOR_STATE`：pending 開始的時間；`changes(ALERTS_FOR_STATE[1h])` 看 for 有沒有被重置"
    note: "Prometheus 重啟後，for 小於 `--rules.alert.for-grace-period`（預設 10m）的 alert 會從零計時。"
    refs: [p-rulefmt-for, p-forgrace, p-alert-delete]

  lookback_delta:
    title: Lookback delta
    kind: config
    systems: [prometheus]
    tokens: [lookback_delta, --query.lookback-delta, lookback]
    where: "`--query.lookback-delta`"
    default: "5m"
    note: "沒寫 range 的 selector（如 `up == 0`）往回找最近一個點的上限。vmalert 對應的是 `-datasource.queryStep`。"
    refs: [p-lookback, p-lookback-default]

  resend_delay:
    title: Alert 續送間隔
    kind: config
    systems: [prometheus, vmalert]
    tokens: [resend_delay, --rules.alert.resend-delay, -rule.resendDelay, resendDelay]
    where: "Prometheus：`--rules.alert.resend-delay`。vmalert：`-rule.resendDelay`。"
    default: "Prometheus 1m；vmalert 0"
    note: "送給 Alertmanager 的 EndsAt = 評估時間 + 4 × max(resend, E)。續送中斷超過它，Alertmanager 會自動 resolve。"
    refs: [p-resenddelay, vma-resend, p-alert-validuntil]

  eval_delay:
    title: vmalert 的 eval_delay
    symbol: D
    kind: config
    systems: [vmalert]
    tokens: [eval_delay, -rule.evalDelay, eval_alignment]
    where: "`-rule.evalDelay`，group 的 `eval_delay` 覆寫；`eval_alignment`（預設 true）再按 interval 向下取整"
    default: "30s"
    note: "查詢時間 = 對齊(now − eval_delay)，實際延遲落在 eval_delay 到 eval_delay + E 之間。對應 Prometheus 的 query_offset。"
    refs: [vma-evaldelay, vma-evalalign]

  query_step:
    title: vmalert 的 queryStep
    kind: config
    systems: [vmalert]
    tokens: [-datasource.queryStep, queryStep]
    where: "`-datasource.queryStep`"
    default: "5m"
    note: "沒寫 range 的查詢最多往回找這麼久。資料停止後，`m > 0` 這類條件還會繼續成立約 6 分鐘。"
    refs: [vma-querystep]

  search_min_staleness_interval:
    title: VictoriaMetrics 的最小 staleness 間隔
    kind: config
    systems: [victoriametrics]
    tokens: [-search.minStalenessInterval]
    where: "vmselect（或 single-node）的 `-search.minStalenessInterval`"
    default: "0（不調整）"
    note: "MetricsQL 的 `rate`、`increase` 會用視窗前最後一個 sample，但那個 sample 要在 step 內（vmalert 送的 step 是 `-datasource.queryStep`）。這個 flag 把「step 內」的下限拉長，也會拉長省略視窗時的預設視窗。"
    refs: [pqw-vm-minstale-flag, pqw-vm-minstale-use, pqw-lab-server]

  search_latency_offset:
    title: VictoriaMetrics 的查詢延遲
    kind: config
    systems: [victoriametrics]
    tokens: [-search.latencyOffset, latency_offset]
    where: "vmselect（或 single-node）的 `-search.latencyOffset`，單次查詢可用 `latency_offset` 參數覆寫"
    default: "30s"
    note: "Instant query 的時間離現在不到這麼久、又沒帶 `nocache=1` 時，查詢時間改成 now − 30s。vmalert 的 `eval_delay` 設得比它小時，實際的查詢延遲至少是它。"
    refs: [pqw-vm-latency-offset, pqw-vm-latency-apply]

  query_max_concurrency:
    title: Prometheus 查詢併發上限
    kind: config
    systems: [prometheus]
    tokens: [--query.max-concurrency]
    where: "`--query.max-concurrency`"
    default: "20"
    observe:
      - "`prometheus_engine_queries` ÷ `prometheus_engine_queries_concurrent_max`"
    note: "Rule 與 API（Grafana）共用這組 slot。"
    refs: [p-maxconc, p-engine-queue]

  group_interval:
    title: Alertmanager 的 group_wait、group_interval、repeat_interval
    kind: config
    systems: [alertmanager]
    tokens: [group_interval, group_wait, repeat_interval]
    where: "`alertmanager.yml` 的 `route`，子路由可覆寫"
    default: "group_wait 30s、group_interval 5m、repeat_interval 4h"
    note: "失敗計數要等一輪 flush 結束才增加，所以通知失敗的告警視窗至少要 2 × 最大的 group_interval。"
    refs: [am-route-defaults, am-cfg-route, am-aggr-run]

  # ---------- Metric ----------
  scrape_duration_seconds:
    title: Scrape 耗時
    symbol: d
    kind: metric
    systems: [prometheus, vmagent]
    tokens: [scrape_duration_seconds]
    where: "由 scraper 自己寫入的 series，每個 target 一條，帶 `job`、`instance`"
    observe:
      - "尖峰：`max_over_time(scrape_duration_seconds[7d])`"
      - "比值：`scrape_duration_seconds` ÷ scrape_interval（`/api/v1/targets` 的 `scrapeInterval`）"
    note: "不含寫入（commit）時間，實際查得到的時間更晚。它不在 Prometheus 的 `/metrics` 裡，外部觀察者要用 `/federate` 拿。"
    refs: [p-metric-scrape-duration, vmag-scrape-duration, p-scrape-report]

  prometheus_target_interval_length_seconds:
    title: 實際 scrape 間隔
    symbol: I
    kind: metric
    systems: [prometheus]
    tokens: [prometheus_target_interval_length_seconds]
    where: "Prometheus 的 `/metrics`；summary，依設定的 `interval` label 分組"
    observe:
      - "`prometheus_target_interval_length_seconds{interval=\"30s\",quantile=\"0.9\"}` 明顯大於 30s，代表 tick 被丟掉"
    refs: [p-metric-interval-length]

  prometheus_rule_group_interval_seconds:
    title: Rule group 的設定 interval
    kind: metric
    systems: [prometheus]
    tokens: [prometheus_rule_group_interval_seconds]
    where: "Prometheus 的 `/metrics`，帶 `rule_group`"
    refs: [p-metric-group-interval]

  prometheus_rule_group_last_duration_seconds:
    title: Rule group 耗時
    symbol: T
    kind: metric
    systems: [prometheus]
    tokens: [prometheus_rule_group_last_duration_seconds]
    where: "Prometheus 的 `/metrics`，帶 `rule_group`；只有最近一次的值"
    observe:
      - "比值：`prometheus_rule_group_last_duration_seconds / prometheus_rule_group_interval_seconds`，超過 1 就開始跳過 evaluation"
      - "尖峰：`max_over_time(prometheus_rule_group_last_duration_seconds[7d])`"
    refs: [p-metric-group-duration, p-group-missed]

  prometheus_rule_group_iterations_missed_total:
    title: 跳過的 evaluation 次數
    kind: metric
    systems: [prometheus]
    tokens: [prometheus_rule_group_iterations_missed_total, iterations_missed_total]
    where: "Prometheus 的 `/metrics`，帶 `rule_group`"
    refs: [p-group-missed]

  vmalert_iteration_duration_seconds:
    title: vmalert group 耗時
    symbol: T
    kind: metric
    systems: [vmalert]
    tokens: [vmalert_iteration_duration_seconds]
    where: "vmalert 的 `/metrics`；summary，帶 `group`"
    observe:
      - "`vmalert_iteration_duration_seconds{quantile=\"0.9\"}` ÷ group interval"
    note: "每條 alerting rule 會同步等所有 Alertmanager 回應，Alertmanager 變慢也會拉長它。"
    refs: [vma-iter-duration, vma-exec-send]

  vmalert_iteration_missed_total:
    title: vmalert 跳過的 evaluation 次數
    kind: metric
    systems: [vmalert]
    tokens: [vmalert_iteration_missed_total, iteration_missed]
    where: "vmalert 的 `/metrics`，帶 `group`"
    note: "查詢飽和（429）時查詢失敗得很快，這個值可能一直是 0。"
    refs: [vma-missed, exp-vm-faults]

  # ---------- Grafana Alerting（Grafana-managed rule）----------
  grafana_rule_interval:
    title: Grafana rule group 的 evaluation interval 與 scheduler tick
    kind: config
    systems: [grafana_alerting]
    tokens: [scheduler_tick_interval, min_interval, unified_alerting.min_interval]
    where: "Rule group 的 `interval`（UI 的 evaluation group、provisioning 檔的 `groups[].interval`）。`[unified_alerting]` 的 `min_interval` 是下限，`scheduler_tick_interval` 是 scheduler 的 tick（base interval）。"
    default: "tick 10s；min_interval 等於 tick（10s）；新 group 預設 1m。Interval 必須是 tick 的整數倍。"
    observe:
      - "`/api/prometheus/grafana/api/v1/rules` 每個 group 的 `interval`"
      - "`grafana_alerting_ticker_interval_seconds`：實際的 tick"
    note: "Interval 小於 min_interval 時被悄悄調成 min_interval。每個 tick 都會先到資料庫讀 rule 版本。"
    refs: [graf-base-interval, graf-ready-to-run, graf-tick-fetch-rules]

  no_data_state:
    title: Grafana rule 的 no_data_state
    kind: config
    systems: [grafana_alerting]
    tokens: [no_data_state, noDataState]
    where: "每條 Grafana-managed rule 的「Alert state if no data」；provisioning 檔的 `noDataState`；API 的 `no_data_state`"
    default: "NoData（API 與 provisioning 沒寫時；UI 預設未核對）"
    observe:
      - "`/api/v1/provisioning/alert-rules` 每條 rule 的 `noDataState`"
      - "`grafana_alerting_alerts{state=\"nodata\"}`：只數 NoData 這一種；設成 OK 的 rule 會數在 normal"
    note: "選項：NoData（送 DatasourceNoData，原 alert 2 個 interval 後 resolved）、Alerting、OK（立刻 resolved）、KeepLast。見信任契約。"
    refs: [graf-nodata-all, graf-nodata-ok, graf-prov-nodata-default, graf-api-defaults, exp-graf-modes]

  exec_err_state:
    title: Grafana rule 的 exec_err_state
    kind: config
    systems: [grafana_alerting]
    tokens: [exec_err_state, execErrState]
    where: "每條 Grafana-managed rule 的「Alert state if execution error or timeout」；provisioning 檔的 `execErrState`；API 的 `exec_err_state`"
    default: "Alerting（API 與 provisioning 沒寫時；UI 預設未核對）"
    observe:
      - "`/api/v1/provisioning/alert-rules` 每條 rule 的 `execErrState`"
      - "`grafana_alerting_alerts{state=\"error\"}`：只數 Error 這一種"
    note: "選項：Error（送 DatasourceError，原 alert 2 個 interval 後 resolved）、Alerting、OK（立刻 resolved）、KeepLast。"
    refs: [graf-error-all, graf-err-ok, graf-prov-err-default, graf-api-defaults, exp-graf-modes]

  missing_series_evals_to_resolve:
    title: Grafana 的 missing_series_evals_to_resolve
    kind: config
    systems: [grafana_alerting]
    tokens: [missing_series_evals_to_resolve, missingSeriesEvalsToResolve]
    where: "每條 rule 的 `missing_series_evals_to_resolve`"
    default: "2；Error／NoData 狀態的 instance 固定 1"
    note: "某個 series 沒出現在這次結果裡，連續這麼多個 interval 後送 resolved。查詢失敗時結果只有一筆沒有 label 的 Error，原本每個 series 的 alert 都算「缺席」。"
    refs: [graf-missing-default, graf-missing-series, graf-missing-error-1]

  grafana_evaluation_timeout:
    title: Grafana 的 evaluation_timeout 與重試
    kind: config
    systems: [grafana_alerting]
    tokens: [evaluation_timeout, max_attempts, initial_retry_delay, max_retry_delay]
    where: "`[unified_alerting]` 的 `evaluation_timeout`、`max_attempts`、`initial_retry_delay`、`max_retry_delay`"
    default: "evaluation_timeout 30s；max_attempts 3；重試延遲 1s 起、最多 4s"
    note: "逾時是每次 attempt 各算一次；一次 evaluation 最長約 3 × 30s 加上重試延遲，期間同一條 rule 的下一個 tick 只能排隊、再被丟掉。資料來源自己的 HTTP 逾時（`[dataproxy] timeout`，預設 30s）另外生效。"
    refs: [graf-eval-timeout, graf-default-timeout, graf-default-attempts, graf-eval-retry, graf-ini-eval-timeout]

  grafana_resend:
    title: Grafana 的續送間隔與 EndsAt
    kind: config
    systems: [grafana_alerting]
    tokens: [ResendDelay, resolved_alert_retention]
    where: "續送間隔寫死在程式裡（`state.ResendDelay`），沒有設定項；`[unified_alerting]` 的 `resolved_alert_retention` 控制 resolved 要續送多久"
    default: "續送 30s；EndsAt = 排程時間 + 4 × max(30s, interval)；resolved_alert_retention 15m"
    note: "EndsAt 從排程時間（tick）算，不是送出時間。評估越慢、重試越多，Alertmanager 那邊剩下的寬限越短。"
    refs: [graf-resend-delay, graf-resend-fixed, graf-endsat, graf-eval-scheduledat, graf-resolved-retention, exp-graf-modes]

  grafana_ha:
    title: Grafana Alerting 的 HA 設定
    kind: config
    systems: [grafana_alerting]
    tokens: [ha_peers, ha_single_node_evaluation, ha_redis_address]
    where: "`[unified_alerting]` 的 `ha_peers`（gossip）或 `ha_redis_address`（Redis），以及 `ha_single_node_evaluation`"
    default: "ha_peers 空（不組叢集）；ha_single_node_evaluation false"
    note: "多台 Grafana 共用一個資料庫時，每台都評估全部 rule。沒設 ha_peers，內建 Alertmanager 之間不去重，每台各送一次通知。ha_single_node_evaluation 只讓叢集位置 0 的那台評估。"
    refs: [graf-ha-single-node, graf-ha-primary, graf-ha-single-init, graf-ini-ha-peers]

  alertmanagers_choice:
    title: Grafana 送到哪個 Alertmanager（alertmanagersChoice）
    kind: config
    systems: [grafana_alerting]
    tokens: [alertmanagersChoice, handleGrafanaManagedAlerts]
    where: "每個 org 的 admin config（`/api/v1/ngalert/admin_config` 的 `alertmanagersChoice`：all、internal、external），加上 Alertmanager 資料來源的 `handleGrafanaManagedAlerts`"
    default: "all；但 admin config 從沒設過時不會建立外部 sender"
    observe:
      - "`/api/v1/ngalert/alertmanagers` 的 `activeAlertManagers`"
      - "`grafana_alerting_sender_alertmanagers_discovered`：沒有外部 sender 時這個 series 不存在"
    refs: [graf-router-choice, graf-router-none, exp-graf-admin]

  grafana_alerting_schedule_rule_evaluations_missed_total:
    title: Grafana 丟掉的 evaluation 次數
    kind: metric
    systems: [grafana_alerting]
    tokens: [grafana_alerting_schedule_rule_evaluations_missed_total]
    where: "Grafana 的 `/metrics`，帶 `org`、`name`（rule 標題）、`reason`（slow_evaluation、state_not_warmed）"
    note: "第一次發生前這個 series 不存在。逾時與重試造成的延遲也算 slow_evaluation。"
    refs: [graf-metric-missed, graf-missed-slow, graf-missed-warm, exp-graf-slow]

  grafana_alerting_rule_evaluation_failures_total:
    title: Grafana rule 評估失敗次數
    kind: metric
    systems: [grafana_alerting]
    tokens: [grafana_alerting_rule_evaluation_failures_total, grafana_alerting_rule_evaluation_attempt_failures_total]
    where: "Grafana 的 `/metrics`，只帶 `org`，沒有 rule 或 group label"
    note: "重試用完（或不可重試）才加 1；每次 attempt 的失敗看 attempt_failures_total。"
    refs: [graf-metric-failures, graf-eval-failures, exp-graf-modes]

  grafana_alerting_alerts:
    title: Grafana 各狀態的 alert instance 數
    kind: metric
    systems: [grafana_alerting]
    tokens: [grafana_alerting_alerts]
    where: "Grafana 的 `/metrics`，`state` 是 normal、pending、alerting、recovering、nodata、error"
    note: "數的是 instance 的狀態，不是原因。no_data_state／exec_err_state 設成 OK 或 Alerting 的 rule，資料消失時算在 normal 或 alerting。"
    refs: [graf-metric-alerts, exp-graf-modes]

  partial_response_strategy:
    title: Thanos Ruler 的 partial response 策略
    kind: config
    systems: [thanos]
    tokens: [partial_response_strategy]
    where: "Thanos Ruler 的 rule 檔，每個 group 一個 `partial_response_strategy: warn | abort`"
    default: "abort（沒寫時）"
    observe:
      - "`thanos_rule_loaded_rules` 的 `strategy` label"
      - "`thanos_rule_evaluation_with_warnings_total{strategy=\"warn\"}`：warn group 帶 warning 的評估次數"
    note: "abort 只對 querier 名單上的 store 有效。斷線 5 秒後 store 被排除，查詢成功、沒有 warning。"
    refs: [th-prs-default, th-es-queryable, exp-thanos-store-loss]

  thanos_store_nodes_grpc_connections:
    title: Querier 連得到的 StoreAPI 數
    kind: metric
    systems: [thanos]
    tokens: [thanos_store_nodes_grpc_connections]
    where: "Thanos Querier（與用 gRPC endpoint 的 Ruler）的 `/metrics`，帶 `external_labels`、`store_type`"
    observe:
      - "依 querier 加總後和過去的最大值比較；一個 store 都沒有時整條消失，不是 0"
    refs: [th-es-conns, exp-thanos-store-loss]

  thanos_compact_halted:
    title: Compactor 是否已 halt
    kind: metric
    systems: [thanos]
    tokens: [thanos_compact_halted]
    where: "Thanos Compactor 的 `/metrics`"
    default: "0；遇到重疊 block 等嚴重錯誤時設 1，行程不結束"
    refs: [th-compact-halt, exp-thanos-compact-halt]

  # ---------- Valkey／Redis（redis_exporter 卡） ----------
  repl-backlog-size:
    title: Valkey／Redis 的複寫 backlog 大小
    kind: config
    systems: [valkey, redis]
    tokens: [repl-backlog-size]
    where: "valkey.conf／redis.conf 或 `CONFIG SET repl-backlog-size`"
    default: "Valkey 9.1.3 是 10MB；Redis 7.2.17、8.10.3 是 1MB"
    observe:
      - "`redis_replication_backlog_bytes`（INFO repl_backlog_size）；`redis_config_repl_backlog_size`（CONFIG GET，沒有權限時不存在）"
      - "撐得住多久的斷線：`redis_replication_backlog_bytes / rate(redis_master_repl_offset[15m])`"
    note: "斷線期間的寫入量超過它，重連就是 full resync（`redis_replica_resyncs_full` 增加）。"
    refs: [vk-cfg-backlog, r72-cfg-backlog, vk-exp]

  latency-monitor-threshold:
    title: Valkey／Redis latency monitor 的門檻
    kind: config
    systems: [valkey, redis]
    tokens: [latency-monitor-threshold]
    where: "valkey.conf／redis.conf 或 `CONFIG SET latency-monitor-threshold <毫秒>`"
    default: "0（關閉）"
    observe:
      - "`redis_latency_spike_duration_seconds{event_name}`、`redis_latency_spike_last`：門檻是 0 時完全沒有這兩組 series"
    note: "Valkey 用微秒和門檻 ×1000 比較、存成毫秒；Redis 7.2 直接用毫秒。"
    refs: [vk-cfg-latency-threshold, vk-lat-addsample, r72-lat-addsample, vdoc-latmon-enable]

  stop-writes-on-bgsave-error:
    title: BGSAVE 失敗時拒絕寫入
    kind: config
    systems: [valkey, redis]
    tokens: [stop-writes-on-bgsave-error]
    where: "valkey.conf／redis.conf 或 `CONFIG SET`"
    default: "yes；而且要有 save 設定才生效"
    observe:
      - "`redis_rdb_last_bgsave_status == 0` 時，寫入與 PING 回 MISCONF：`redis_errors_total{err=\"MISCONF\"}`"
    note: "exporter 不送 PING，所以這段期間 `redis_up` 仍是 1。"
    refs: [vk-cfg-stop-writes, vk-misconf-cond, vk-misconf-ping, vk-exp]

  redis-exporter-connection-timeout:
    title: redis_exporter 的連線與讀寫逾時
    kind: config
    systems: [redis_exporter]
    tokens: [--connection-timeout]
    where: "redis_exporter 的 `--connection-timeout` 或 `REDIS_EXPORTER_CONNECTION_TIMEOUT`"
    default: "15s（連線、讀、寫三個逾時都用它）"
    observe:
      - "`redis_exporter_last_scrape_duration_seconds`；比 scrape_timeout 長時，伺服器忙會讓 `up` 變 0、`redis_up` 消失"
    note: "設得比 scrape_timeout 短，exporter 會自己回 `redis_up=0` 與錯誤訊息。"
    refs: [rx-flag-timeout, rx-dial-timeouts, vk-exp]

  # ---------- etcd ----------
  etcd-quota-backend-bytes:
    title: etcd backend quota
    kind: config
    systems: [etcd]
    tokens: [--quota-backend-bytes, quota-backend-bytes]
    where: "etcd 的 `--quota-backend-bytes` 或設定檔 `quota-backend-bytes`"
    default: "0＝2GiB"
    observe:
      - "`etcd_server_quota_backend_bytes`；和 `etcd_mvcc_db_total_size_in_bytes`（檔案大小，不是使用中的大小）比"
    note: "超過時發 NOSPACE alarm、拒絕寫入；compact＋defrag 不會解除，要 `etcdctl alarm disarm`。"
    refs: [etcd-embed-quota-flag, etcd-quota-default, etcd-quota-available, etcd-exp]

  etcd-auto-compaction-retention:
    title: etcd 自動 compaction
    kind: config
    systems: [etcd]
    tokens: [--auto-compaction-retention, auto-compaction-retention]
    where: "etcd 的 `--auto-compaction-retention`（搭配 `--auto-compaction-mode` periodic／revision）"
    default: "0（關閉）"
    observe:
      - "`etcd_debugging_mvcc_compact_revision` 有沒有前進；`etcd_debugging_mvcc_db_compaction_last` 重啟歸 0，不要拿來算多久沒跑"
    refs: [etcd-embed-autocompact, etcd-compact-rev-restore, etcd-compaction-last]

  etcd-metrics-level:
    title: etcd metric 細節等級
    kind: config
    systems: [etcd]
    tokens: [--metrics=extensive, --metrics=basic]
    where: "etcd 的 `--metrics`"
    default: "basic"
    observe:
      - "`grpc_server_handling_seconds_bucket` 只在 extensive 存在；basic 下 mixin 的 etcdGRPCRequestsSlow 回傳空"
    note: "basic 也有 `etcd_server_request_duration_seconds`。"
    refs: [etcd-embed-metrics-flag, etcd-grpc-histogram-extensive, etcd-exp]

  etcd-listen-metrics-urls:
    title: etcd 獨立的 metrics listener
    kind: config
    systems: [etcd]
    tokens: [--listen-metrics-urls]
    where: "etcd 的 `--listen-metrics-urls`"
    default: "不設（/metrics 與健康端點只在 client port）"
    observe:
      - "這個 listener 也有 `/health`、`/livez`、`/readyz`，blackbox 可以探它"
    refs: [etcd-embed-metrics-mux, dbm-etcd-listen-metrics]

  etcd-warning-apply-duration:
    title: etcd 慢 apply 門檻
    kind: config
    systems: [etcd]
    tokens: [--warning-apply-duration]
    where: "etcd 的 `--warning-apply-duration`"
    default: "100ms"
    observe:
      - "超過時 `etcd_server_slow_apply_total` 加 1，並寫 warning log「apply request took too long」"
    refs: [etcd-embed-warn-apply, etcd-txn-slow-apply]

  tidb-max-store-down-time:
    title: PD 判定 store Down 的時間
    kind: config
    systems: [tidb]
    tokens: [max-store-down-time, schedule.max-store-down-time]
    where: "PD 設定 `schedule.max-store-down-time`（也可用 pd-ctl `config set max-store-down-time`）"
    default: "30m"
    observe:
      - "`pd_cluster_status{type=\"store_down_count\"}`：超過這個時間沒有 heartbeat 才變 1；之前依序是 Disconnected（20 秒）、Unhealthy（10 分鐘）"
    note: "官方 PD_cluster_down_tikv_nums 只看 store_down_count，store 停掉的前 30 分鐘不響；Down 之後 PD 才開始在別處補副本。"
    refs: [pd-store-down-default, pd-store-status-order, pd-store-disconnect, pd-store-unhealthy]

  tidb-max-peer-down-duration:
    title: TiKV 判定 down peer 的時間
    kind: config
    systems: [tidb]
    tokens: [max-peer-down-duration, raftstore.max-peer-down-duration]
    where: "TiKV 設定 `raftstore.max-peer-down-duration`"
    default: "10m；hibernate-regions 開著時至少 2 × peer-stale-state-check-interval"
    observe:
      - "`pd_regions_status{type=\"down-peer-region-count\"}`：region leader 回報超過這個時間沒回應的副本"
    refs: [tikv-max-peer-down, tikv-peer-down-hibernate]

  tidb-gc-life-time:
    title: TiDB GC 保留舊版本的時間
    kind: config
    systems: [tidb]
    tokens: [tidb_gc_life_time, tikv_gc_life_time]
    where: "系統變數 `tidb_gc_life_time`（舊版存在 mysql.tidb 的 `tikv_gc_life_time`）"
    default: "10m"
    observe:
      - "`tidb_tikvclient_gc_config{type=\"tikv_gc_life_time\"}`：目前的設定（秒）"
      - "`pd_gc_gc_safepoint{type=\"gc_safepoint\"}`：PD 收到的 safe point（TSO），右移 18 位是毫秒"
    note: "長交易、TiCDC 或 BR 的 service safe point 會擋住 safe point 前進，舊版本累積。"
    refs: [tidb-gc-lifetime-default, tidb-gc-config-gauge, pd-gc-safepoint]

  tidb-server-memory-limit:
    title: TiDB 整個 process 的記憶體上限
    kind: config
    systems: [tidb]
    tokens: [tidb_server_memory_limit, tidb_mem_oom_action, tidb_mem_quota_query]
    where: "系統變數 `tidb_server_memory_limit`（全域）；單條 SQL 的上限是 `tidb_mem_quota_query`，超過時依 `tidb_mem_oom_action` 處理"
    default: "tidb_server_memory_limit 80%；tidb_mem_quota_query 1GB；tidb_mem_oom_action CANCEL"
    observe:
      - "`tidb_server_memory_quota_bytes` 與 `process_resident_memory_bytes`；超過上限時 TiDB 取消最耗記憶體的 SQL，只寫 log（global memory controller killed the top1 memory consumer），沒有計數 metric"
    refs: [tidb-var-memlimit, tidb-var-oom-action, tidb-memlimit-kill, tidb-m-memquota]

  tidb-token-limit:
    title: TiDB 同時執行的語句上限
    kind: config
    systems: [tidb]
    tokens: [token-limit, max-server-connections]
    where: "TiDB 設定檔 `token-limit`；連線數上限是 `max-server-connections`"
    default: "token-limit 1000；max-server-connections 0（不限制）"
    observe:
      - "`tidb_server_tokens`：目前拿著 token 的語句數；`tidb_server_connections`：連線數"
    refs: [tidb-cfg-token-limit, tidb-cfg-max-conn, tidb-m-tokens, tidb-m-connections]

  # ---------- YugabyteDB ----------
  yb-tserver-unresponsive-timeout:
    title: master 判定 tserver dead 的時間
    kind: config
    systems: [yugabytedb]
    tokens: [tserver_unresponsive_timeout_ms]
    where: "yb-master 的 gflag `--tserver_unresponsive_timeout_ms`（runtime）；tserver 每 `heartbeat_interval_ms`（1 秒）送一次 heartbeat"
    default: "60000（60 秒）"
    observe:
      - "master leader 的 `num_tablet_servers_live`、`num_tablet_servers_dead`（follower 輸出 0）"
      - "master 的 `/api/v1/health-check` 的 `dead_nodes`"
    note: "這只是 master 的看法；tablet 的 Raft 設定要等 `follower_unavailable_considered_failed_sec` 才把那台踢掉。"
    refs: [yb-m-ts-unresponsive, yb-ts-heartbeat-interval, yb-m-num-live, yb-m-h-health-dead]

  yb-follower-unavailable-failed:
    title: tablet leader 把沒回應的 follower 踢出 Raft 設定的時間
    kind: config
    systems: [yugabytedb]
    tokens: [follower_unavailable_considered_failed_sec]
    where: "yb-tserver（與 yb-master）的 gflag `--follower_unavailable_considered_failed_sec`（runtime）"
    default: "900（15 分鐘）"
    observe:
      - "master 的 `/api/v1/tablet-under-replication`：被踢掉之後副本數才少於 RF"
    note: "踢掉之後 master 的 cluster balancer 在別台補副本（remote bootstrap）；只有 RF 台 tserver 時沒有地方補，tablet 一直 under-replicated。"
    refs: [yb-c-follower-failed, yb-m-h-underrep-running]

  yb-leaderless-delay:
    title: leaderless tablet 的判定延遲
    kind: config
    systems: [yugabytedb]
    tokens: [leaderless_tablet_alert_delay_secs]
    where: "yb-master 的 gflag `--leaderless_tablet_alert_delay_secs`（runtime）"
    default: "120"
    observe:
      - "master 的 `/api/v1/tablet-replication` 的 `leaderless_tablets`（/prometheus-metrics 沒有對應的 metric）"
    refs: [yb-m-leaderless-delay, yb-m-h-leaderless]

  yb-max-clock-skew:
    title: 允許的最大時鐘偏移
    kind: config
    systems: [yugabytedb]
    tokens: [max_clock_skew_usec, fail_on_out_of_range_clock_skew, clock_skew_force_crash_bound_usec]
    where: "所有 yb-master、yb-tserver 的 gflag `--max_clock_skew_usec`；超過時的行為由 `--fail_on_out_of_range_clock_skew` 與 `--clock_skew_force_crash_bound_usec` 決定"
    default: "max_clock_skew_usec 500000（500ms）；fail_on_out_of_range_clock_skew true；clock_skew_force_crash_bound_usec 60000000（60 秒）"
    observe:
      - "`hybrid_clock_skew`（微秒）：這台的 hybrid time 比本機實體時鐘快多少"
      - "log：`Too big clock skew is detected`（FATAL 時 process 結束）"
    note: "有交易表的 tablet 開啟後才會因 skew crash；lab 裡牆鐘往回跳 7 秒時三台 tserver 同時 FATAL。"
    refs: [yb-clk-max-skew, yb-clk-fail-flag, yb-clk-crash-bound, yb-clk-fatal, yb-clk-skew-metric, yb-clk-skew-def, yb-clk-enable, yb-exp-clock]

  yb-ysql-max-connections:
    title: YSQL 每台 tserver 的連線上限
    kind: config
    systems: [yugabytedb]
    tokens: [ysql_max_connections]
    where: "yb-tserver 的 gflag `--ysql_max_connections`（對應 PostgreSQL 的 max_connections；每台 tserver 各自計算）"
    default: "0（由 PostgreSQL 依平台決定）"
    observe:
      - "`yb_ysqlserver_max_connection_total`、`yb_ysqlserver_connection_total`、`yb_ysqlserver_connection_over_limit_total`（13000 port）"
    note: "superuser 也會被擋：superuser_reserved_connections 是保留給 superuser 的，連線全是 superuser 時一樣用完（lab）。"
    refs: [yb-ysql-maxconn, yb-ysql-m-conn, yb-ysql-m-overlimit, yb-ysql-m-max, yb-exp-raw]

  yb-memory-limit:
    title: yb-tserver／yb-master 的記憶體上限
    kind: config
    systems: [yugabytedb]
    tokens: [memory_limit_hard_bytes, memory_limit_soft_percentage, default_memory_limit_to_ram_ratio]
    where: "gflag `--memory_limit_hard_bytes`；0 時用 `--default_memory_limit_to_ram_ratio` × 主機記憶體；soft limit 是 hard 的 `--memory_limit_soft_percentage`"
    default: "memory_limit_hard_bytes 0；default_memory_limit_to_ram_ratio 0.85；memory_limit_soft_percentage 85"
    observe:
      - "`server_memory_hard_limit`、`server_memory_soft_limit`、`mem_tracker_server`"
      - "`leader_memory_pressure_rejections`、`follower_memory_pressure_rejections`、`operation_memory_pressure_rejections`、`rpc_inbound_calls_rejected_because_memory_pressure`"
    note: "YSQL 的 PostgreSQL backend 不在這個 tracker 裡。"
    refs: [yb-mem-hard, yb-mem-soft, yb-mem-leader-rej]

  yb-sst-files-limit:
    title: tablet 的 SST 檔數上限（寫入節流）
    kind: config
    systems: [yugabytedb]
    tokens: [sst_files_soft_limit, sst_files_hard_limit]
    where: "yb-tserver 的 gflag `--sst_files_soft_limit`、`--sst_files_hard_limit`（runtime）"
    default: "24、48"
    observe:
      - "`majority_sst_files_rejections`：過半副本超過上限而拒絕的寫入"
      - "`rocksdb_current_version_num_sst_files`（輸出時加總到表）"
    refs: [yb-sst-soft, yb-sst-hard, yb-sst-rej]

  ch-parts-to-insert:
    title: ClickHouse 的 part 數門檻（Too many parts）
    kind: config
    systems: [clickhouse]
    tokens: [parts_to_delay_insert, parts_to_throw_insert, max_parts_in_total]
    where: "MergeTree 設定：config.xml 的 `<merge_tree>`，或每張表的 `SETTINGS`；查詢層級也可覆寫 parts_to_delay_insert／parts_to_throw_insert"
    default: "parts_to_delay_insert 1000、parts_to_throw_insert 3000（單一 partition 的 active part 數）；max_parts_in_total 100000（整張表）"
    observe:
      - "`ClickHouseAsyncMetrics_MaxPartCountForPartition`：全伺服器單一 partition 的最大 part 數"
      - "`ClickHouseProfileEvents_DelayedInserts`、`ClickHouseProfileEvents_RejectedInserts`、`ClickHouseErrorMetric_TOO_MANY_PARTS`"
      - "`system.merge_tree_settings`（伺服器層級的值）；每張表的覆寫在 `SHOW CREATE TABLE`"
    note: "超過 parts_to_delay_insert 時 insert 被 sleep（最多 max_delay_to_insert 秒），超過 parts_to_throw_insert 時丟 TOO_MANY_PARTS。"
    refs: [ch-mt-delay, ch-mt-throw, ch-mt-max-total, ch-mtd-delay-fn, ch-mtd-rejected, ch-sam-maxparts]

  ch-delay-to-close:
    title: ClickHouse /replicas_status 的延遲門檻
    kind: config
    systems: [clickhouse]
    tokens: [min_relative_delay_to_close, min_absolute_delay_to_close]
    where: "MergeTree 設定（`<merge_tree>` 或 `<replicated_merge_tree>`）"
    default: "min_relative_delay_to_close 300 秒；min_absolute_delay_to_close 0（不看絕對延遲）"
    observe:
      - "blackbox 探 `/replicas_status`：超過門檻時 503"
    note: "和 `max_replica_delay_for_distributed_queries`（預設 300，Distributed 查詢挑 replica 用）是不同的設定。唯讀的表不會讓 /replicas_status 失敗。"
    refs: [ch-mt-min-rel-close, ch-mt-min-abs-close, ch-rs-close, ch-rs-readonly-skip, ch-set-max-replica-delay]

  ch-heavy-metrics:
    title: ClickHouse 的 heavy asynchronous metrics
    kind: config
    systems: [clickhouse]
    tokens: [asynchronous_metrics_enable_heavy_metrics, asynchronous_heavy_metrics_update_period_s]
    where: "伺服器設定（config.xml 頂層）"
    default: "asynchronous_metrics_enable_heavy_metrics false；asynchronous_heavy_metrics_update_period_s 120"
    observe:
      - "打開後才有 `ClickHouseAsyncMetrics_NumberOfDetachedParts`、`NumberOfDetachedByUserParts`、`NumberOfPendingMutations`、`NumberOfPendingMutationsOverExecutionTime`"
    refs: [ch-ss-heavy-enable, ch-ss-heavy-period, ch-sam-heavy-gate, ch-sam-detached, ch-sam-mutations]

  ch-async-kv-mode:
    title: ClickHouse async metric 的 key-value 形式
    kind: config
    systems: [clickhouse]
    tokens: [asynchronous_metrics_key_values_mode]
    where: "伺服器設定；SYSTEM RELOAD CONFIG 即生效"
    default: "key_values（26.8 起）：`DiskAvailable{disk=\"default\"}`；legacy_names 是 26.8 以前的 `DiskAvailable_default`；both 兩種都輸出"
    observe:
      - "`ClickHouseAsyncMetrics_DiskAvailable`、`DiskTotal`、`DiskUnreserved` 等帶 disk、device、cpu label 的 series"
    note: "照 26.8 以前寫的規則（`ClickHouseAsyncMetrics_DiskAvailable_default`）在預設設定下回傳空。"
    refs: [ch-ss-kv-mode, ch-prom-keyvalue-label, ch-sam-disk-available]

  ch-server-memory:
    title: ClickHouse 的記憶體上限
    kind: config
    systems: [clickhouse]
    tokens: [max_server_memory_usage, max_server_memory_usage_to_ram_ratio, max_memory_usage]
    where: "max_server_memory_usage、max_server_memory_usage_to_ram_ratio：伺服器設定；max_memory_usage：查詢設定（profile 或 SETTINGS）"
    default: "max_server_memory_usage 0（用 RAM × max_server_memory_usage_to_ram_ratio 0.9）；max_memory_usage 0（不限制單一查詢）"
    observe:
      - "`ClickHouseMetrics_MemoryTracking`；`ClickHouseAsyncMetrics_CGroupMemoryTotal`、`OSMemoryTotal`"
      - "`ClickHouseErrorMetric_MEMORY_LIMIT_EXCEEDED`、`ClickHouseProfileEvents_QueryMemoryLimitExceeded`"
    note: "/metrics 沒有「目前生效的上限」這個數字；設定值要查 system.server_settings。"
    refs: [ch-ss-max-mem, ch-ss-mem-ratio, ch-set-max-mem, ch-cm-memtracking, ch-mem-exceeded]

  ch-async-insert:
    title: ClickHouse 的非同步 insert
    kind: config
    systems: [clickhouse]
    tokens: [async_insert, wait_for_async_insert]
    where: "查詢設定（profile 或 SETTINGS）"
    default: "async_insert true（26.2 起）；wait_for_async_insert true"
    observe:
      - "`ClickHouseMetrics_PendingAsyncInsert`；`ClickHouseProfileEvents_AsyncInsertQuery`、`AsyncInsertFlush`、`FailedAsyncInsertQuery`"
    refs: [ch-set-async-insert, ch-cm-pendingasync]

  ch-system-events-zero:
    title: system.events 是否列出 0 的事件
    kind: config
    systems: [clickhouse]
    tokens: [system_events_show_zero_values]
    where: "查詢設定"
    default: "false：system.events 只列出發生過的事件"
    observe:
      - "原生 /metrics 不受影響：每個 ProfileEvent 都輸出，含 0"
    note: "用 SQL 讀 system.events 的 exporter（Altinity metrics-exporter）在事件第一次發生前沒有這條 series；increase() 抓不到第一次的增加。"
    refs: [ch-set-events-zero, ch-events-zero, ch-prom-events-all, alt-fetch-events]

  # ---------- MongoDB ----------
  mongodb-election-timeout:
    title: MongoDB replica set 的選舉逾時
    kind: config
    systems: [mongodb]
    tokens: [electionTimeoutMillis, heartbeatIntervalMillis]
    where: "replica set 設定 `settings.electionTimeoutMillis`（`rs.reconfig()`）；heartbeat 間隔在 8.0 是固定的 2 秒"
    default: "electionTimeoutMillis 10000（10 秒）；heartbeat 每 2 秒"
    observe:
      - "`mongodb_rs_electionCandidateMetrics_electionTimeoutMillis`；選舉次數看 `mongodb_rs_term` 的增加、`mongodb_ss_electionMetrics_electionTimeout_called`"
    note: "超過這段時間沒有收到某個 member 的消息就把它標成 DOWN；primary 看不到多數時自己降級。這台機器的容器單調時鐘比牆鐘慢，實際等待會比 10 秒長。"
    refs: [mg-election-timeout, mg-hb-interval, mg-member-timeout, mg-stepdown-majority, mg-exp]

  mongodb-oplog-size:
    title: MongoDB 的 oplog 大小與最短保留
    kind: config
    systems: [mongodb]
    tokens: [--oplogSize, oplogSizeMB, oplogMinRetentionHours]
    where: "`mongod --oplogSize`（MB）或設定檔 `replication.oplogSizeMB`；執行中用 `replSetResizeOplog`；`storage.oplogMinRetentionHours`"
    default: "可用磁碟的 5%，至少 990MB、最多 50GB；oplogMinRetentionHours 0（只看大小）"
    observe:
      - "`mongodb_mongod_replset_oplog_head_timestamp` − `mongodb_mongod_replset_oplog_tail_timestamp`（秒，要 `--compatible-mode`）"
      - "`mongodb_oplog_stats_storageStats_size` 與 `mongodb_oplog_stats_storageStats_maxSize`"
    note: "oplog 只在超過大小、而且最舊的那段沒有被 majority commit point 或 backup 釘住時才截斷；commit point 停住時 oplog 會超過設定值。"
    refs: [mg-oplog-user-size, mg-oplog-min, mg-oplog-5pct, mg-oplog-max, mg-oplog-capacity, mg-oplog-pinned, mg-oplog-min-retention, mg-exp]

  mongodb-wt-cache:
    title: WiredTiger cache 大小與 eviction 門檻
    kind: config
    systems: [mongodb]
    tokens: [wiredTigerCacheSizeGB, eviction_dirty_trigger, eviction_trigger]
    where: "`mongod --wiredTigerCacheSizeGB` 或 `storage.wiredTiger.engineConfig.cacheSizeGB`；eviction 門檻是 WiredTiger 的 `wiredtiger_open` 設定（MongoDB 不改）"
    default: "cache (RAM − 1GB) × 50%，至少 256MB；eviction_target 80%、eviction_trigger 95%、eviction_dirty_target 5%、eviction_dirty_trigger 20%"
    observe:
      - "`mongodb_ss_wt_cache_bytes_currently_in_the_cache`、`mongodb_ss_wt_cache_tracked_dirty_bytes_in_the_cache` 對 `mongodb_ss_wt_cache_maximum_bytes_configured`"
      - "`mongodb_ss_wt_cache_application_thread_time_evicting_usecs`（應用執行緒被迫做 eviction）"
    refs: [mg-wt-cache-default, wt-eviction-defaults, wt-stat-dirty, wt-stat-app-evict, mg-exp]

  mongodb-flow-control:
    title: MongoDB flow control
    kind: config
    systems: [mongodb]
    tokens: [enableFlowControl, flowControlTargetLagSeconds]
    where: "`setParameter`（啟動或執行中）"
    default: "enableFlowControl true；flowControlTargetLagSeconds 10；flowControlThresholdLagPercentage 0.5（落後 5 秒開始限制）"
    observe:
      - "`mongodb_ss_flowControl_isLagged`、`mongodb_ss_flowControl_targetRateLimit`、`mongodb_ss_flowControl_isLaggedCount`"
    note: "只在 primary 上作用。lab 兩個 secondary 都 fsyncLock 時 isLagged 1、targetRateLimit 降到下限 100（flowControlMinTicketsPerSecond）；每秒寫入少於 100 的應用不會被擋。"
    refs: [mg-fc-enabled, mg-fc-target-lag, mg-fc-threshold, mg-fc-primary-only, mg-fc-sustainer, mg-fc-min-tickets, mg-exp]

  mongodb-ticket-algorithm:
    title: MongoDB 8.0 的 storage engine ticket（並行交易數）
    kind: config
    systems: [mongodb]
    tokens: [storageEngineConcurrencyAdjustmentAlgorithm, throughputProbing]
    where: "`setParameter storageEngineConcurrencyAdjustmentAlgorithm`（啟動時）"
    default: "throughputProbing：初始值是 CPU 核心數，在 4～128 之間動態調整；fixedConcurrentTransactions 才是固定 128"
    observe:
      - "`mongodb_ss_wt_concurrentTransactions_available{txn_rw}`、`mongodb_ss_wt_concurrentTransactions_totalTickets`"
      - "排隊：`mongodb_ss_wt_concurrentTransactions_read_normalPriority_queueLength`、`..._write_normalPriority_queueLength`"
    note: "PMM 與 awesome 的「available < 50」規則是照固定 128 寫的；動態調整下 available 本來就可能小於 50。"
    refs: [mg-ticket-algo, mg-tp-initial, mg-tp-min, mg-tp-max, mg-queues-section, mg-exp]

  mongodb-ftdc:
    title: MongoDB FTDC（diagnostic.data）
    kind: config
    systems: [mongodb]
    tokens: [diagnosticDataCollectionDirectorySizeMB, diagnostic.data]
    where: "`setParameter diagnosticDataCollectionDirectorySizeMB`、`diagnosticDataCollectionPeriodMillis`；目錄在 dbPath 下的 diagnostic.data"
    default: "每 1000ms 取樣；目錄上限 250MB（shard server 在新的 log／FTDC 格式下自動加倍）"
    observe:
      - "exporter 的 `--collector.diagnosticdata` 讀的是同一份資料（`getDiagnosticData` 指令），不是 FTDC 檔案"
    note: "FTDC 檔案格式不公開，用途是事後交給 MongoDB 分析；不是告警來源。"
    refs: [mg-ftdc-period, mg-ftdc-dir-size, mg-ftdc-shard-double, mg-diag-auth]

  mongodb-exporter-collectors:
    title: mongodb_exporter 的 collector 旗標
    kind: config
    systems: [mongodb_exporter]
    tokens: [--collector.diagnosticdata, --collector.replicasetstatus, --compatible-mode, --collect-all, --discovering-mode]
    where: "mongodb_exporter 的命令列"
    default: "全部關閉：只輸出 `mongodb_up` 與 go_*／process_*"
    observe:
      - "`collector_scrape_time_ms{collector}`：有註冊的 collector 才有這條（失敗時也有，值接近 0）"
      - "`scrape_samples_scraped`：lab 預設 46、加三個旗標約 6100、`--collect-all` 約 6700"
    note: "`--compatible-mode` 才有 `mongodb_mongod_replset_member_replication_lag`、oplog head／tail、`mongodb_mongod_replset_my_state` 等舊名 metric；PMM 的規則用的是這些。"
    refs: [mx-flag-diag, mx-flag-rs, mx-flag-compat, mx-flag-collectall, mx-register-diag, mx-general-always, mg-exp]

  mongodb-exporter-timeout:
    title: mongodb_exporter 的查詢期限
    kind: config
    systems: [mongodb_exporter]
    tokens: [--web.timeout-offset, --mongodb.connect-timeout-ms]
    where: "mongodb_exporter 的命令列"
    default: "期限＝Prometheus 送來的 X-Prometheus-Scrape-Timeout-Seconds（沒有時 10 秒）減 `--web.timeout-offset`（1 秒）；連線逾時 5000ms"
    observe:
      - "`scrape_duration_seconds` 接近 scrape_timeout 減 1 秒；期限到了以後的 collector 整組不輸出，`up` 仍是 1"
    refs: [mx-handler-header, mx-handler-default10, mx-handler-offset, mx-flag-timeout-offset, mx-flag-connect-timeout, mx-describe-ctx, mg-exp]

  mongodb-up:
    title: mongodb_up
    kind: metric
    systems: [mongodb_exporter]
    tokens: [mongodb_up]
    where: "mongodb_exporter 的 general collector（一定開）"
    default: "一次 ping（read preference primaryPreferred、direct connection）成功就是 1"
    observe:
      - "label 只有 `cluster_role`，沒有 rs_nm；secondary 在沒有 primary 時 ping 照樣成功，值仍是 1"
    refs: [mx-up-ping, mx-up-desc, mx-general-always, mg-exp]

  mongodb-replication-lag-metric:
    title: mongodb_exporter 的複寫延遲
    kind: metric
    systems: [mongodb_exporter]
    tokens: [mongodb_mongod_replset_member_replication_lag]
    where: "`--compatible-mode`＋`--collector.diagnosticdata`；從每個 member 自己的 replSetGetStatus 算"
    default: "|member 的 optimeDate − PRIMARY 的 optimeDate|，秒；label name、state、self、set"
    observe:
      - "每個 secondary 會被每個 exporter 各報一次，用 `self=\"1\"` 取自己報的那條"
    note: "replSetGetStatus 裡沒有 PRIMARY（選舉中、失去多數）時整組不輸出；DOWN 的 member optime 被清成 0，也不輸出。"
    refs: [mx-compat-gotprimary, mx-compat-lag, mx-compat-abs, mx-compat-self, mg-set-down-optime, mg-exp]

  # ---------- 從觸發到通知（docs/architecture/alert-delivery.md） ----------
  group_by:
    title: Alertmanager 的 group_by
    kind: config
    systems: [alertmanager]
    tokens: [group_by]
    where: "`alertmanager.yml` 的 `route`，子路由沒寫就繼承父路由"
    default: "沒有設定：route 下所有 alert 同一個 group；`['...']`：每組不同的 label 各一個 group"
    note: "決定什麼算「新 group」。新 group 等 `group_wait`；已經送過通知的 group 要等下一個 `group_interval` tick。子路由的 `group_by: []` 在 0.31 起語意不同，見 Alertmanager 報告第 6 節。"
    refs: [ad-am-group-labels, ad-am-groupby-all, ad-am-route-inherit]

  resolve_timeout:
    title: Alertmanager 的 resolve_timeout
    kind: config
    systems: [alertmanager]
    tokens: [resolve_timeout]
    where: "`alertmanager.yml` 的 `global.resolve_timeout`"
    default: "5m"
    note: "只用在沒有帶 EndsAt 的 alert。Prometheus 與 vmalert 一定帶 EndsAt，所以對它們沒有作用；它們的自動 resolve 由 4 × max(resend, E) 決定。"
    refs: [ad-am-api-resolve-timeout, ad-am-resolve-default]

  send_resolved:
    title: Receiver 的 send_resolved
    kind: config
    systems: [alertmanager]
    tokens: [send_resolved]
    where: "`receivers[].<integration>_configs[].send_resolved`"
    default: "webhook 是 true；email 是 false（其他 integration 看各自的預設）"
    note: "關掉時 resolved 不會通知，但 group 全部 resolved 時仍會寫入通知紀錄（nflog）。resolved 和新 alert 一樣要等下一個 `group_interval` tick。"
    refs: [ad-am-send-resolved, ad-am-all-resolved, ad-am-webhook-resolved, ad-am-email-resolved]

  am_send_timeout:
    title: Ruler 送給 Alertmanager 的逾時
    kind: config
    systems: [prometheus, vmalert]
    tokens: ["alerting.alertmanagers[].timeout", -notifier.sendTimeout]
    where: "Prometheus：`alerting.alertmanagers[].timeout`。vmalert：`-notifier.sendTimeout`。"
    default: "兩者都是 10s"
    note: "Prometheus 逾時或失敗時整批丟棄、不重試，靠下一次續送補；vmalert 在 group 裡同步送，Alertmanager 慢會拉長評估時間。"
    refs: [ad-p-am-timeout, ad-p-drop, ad-vma-timeout]

  cluster_peer_timeout:
    title: Alertmanager HA 的 peer-timeout
    kind: config
    systems: [alertmanager]
    tokens: [--cluster.peer-timeout]
    where: "Alertmanager 啟動參數 `--cluster.peer-timeout`"
    default: "15s"
    note: "第 N 順位的實例先等 N × peer-timeout 再查通知紀錄，所以 HA 下第二台的通知最多晚 N × 15s；一次 flush 的逾時也加上這段。"
    refs: [ad-am-peer-timeout, ad-am-wait-stage, ad-am-timeout-func]
