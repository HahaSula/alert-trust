# 每張 target 卡（kind: target）都要回答的問題。validate.py 會檢查每個 id 都在卡片的 signals 裡，
# 或寫在卡片的 not_applicable（id: 理由）裡。
# 卡片的 model 決定用哪一組：exporter（預設，required_signals）或 native（資料庫自己提供 /metrics，required_signals_native）。
# 依據：mysqld_exporter 與 postgres_exporter 的實驗都踩到同樣的盲點。
required_signals:
  - id: exporter-up
    min_tier: 1
    question: Exporter 抓得到嗎
    why: Exporter 停機或卡住時，它自己輸出的 *_up 會整條消失，只看 *_up 的規則（上游 mixin 的 MySQLDown、PostgreSQLDown）回傳空，永遠不會響。要用 up == 0 加上 absent。
  - id: db-up
    min_tier: 1
    question: Exporter 連得到它監控的服務嗎
    why: up 只代表 Prometheus 抓得到 exporter；服務停機時 up 仍是 1。
  - id: collectors-present
    min_tier: 1
    question: Exporter 有回應，collector 的結果還在嗎
    why: 服務停機或帳號被鎖時，collector 的結果可能整組消失（不是變成 0），success == 0 的規則也回傳空。寫法是 up == 1 unless on(job, instance) <collector_success>。
  - id: collector-success
    min_tier: 1
    question: 每個 collector 都成功嗎
    why: 權限不足、表或 extension 不存在時，單一 collector 失敗，其他 metric 照常，依賴它的規則安靜地回傳空。
  - id: scrape-budget
    min_tier: 2
    question: Scrape 來得及在 timeout 內完成嗎
    why: Exporter 自己的查詢期限比 scrape_timeout 長時，Prometheus 先放棄，up 變 0、所有 series 消失，看起來像 exporter 掛了。
    contract: exporter-deadline
  - id: probe-blast-radius
    min_tier: 2
    question: 多 target 模式下，壞的是 exporter 還是服務
    why: 一台 multi-target exporter 掛掉，它背後所有 target 同時消失。
  - id: exporter-query-timeout
    aliases: [lock-blocks-exporter]
    min_tier: 2
    question: Exporter 的查詢會不會被鎖或連線上限卡住
    why: PostgreSQL 一張表被 ACCESS EXCLUSIVE 鎖住時，exporter 的查詢排隊等鎖，scrape 逾時、整個 target 消失；MySQL 連線打滿時 exporter 自己也連不進去，mysql_up 變 0、比例類規則回傳空。Exporter 帳號要有查詢逾時與保留連線。
  - id: replication-lag
    min_tier: 2
    question: Replication 延遲量的是真的嗎
    why: 資料庫自己算的延遲在斷線或沒有寫入時會顯示 0（MySQL 的 Seconds_Behind 變成 NULL 不輸出，PostgreSQL 的 pg_replication_lag_seconds 維持 0）。要用 heartbeat 表，或主庫端看得到每台複本。沒有 replication 的服務寫在 not_applicable。
  - id: role-detection
    aliases: [promotion]
    min_tier: 2
    question: 每個叢集剛好有一台可寫入的主節點嗎
    why: Failover 之後靜態的 role label 會指錯節點；舊主節點回來時可能兩邊都能寫。要用 cluster label 跨 instance 計數「可寫入的節點數」，0 或大於 1 都要告警。沒有 HA 的服務寫在 not_applicable。

# 資料庫自己提供 /metrics 時（etcd、TiDB、YugabyteDB、ClickHouse；見 docs/targets/models.md），卡片寫 model: native。
# 沒有 exporter 這一層：回應 /metrics 的就是資料庫 process 本身，所以 up 只代表「process 回應了 HTTP」。
# 依據：docs/targets/models.md 的調查；Thanos Compactor 停擺時 up 仍是 1（lab/thanos，實測）。
# 「資料庫不健康時 /metrics 照常回應」對每個資料庫要在各自的 lab 或原始碼驗證，寫在卡片的 health-second-path 訊號。
required_signals_native:
  - id: endpoint-up
    min_tier: 1
    question: 抓得到 /metrics 嗎
    why: Process 停機、port 不通或 scrape 失敗時 up 變 0；target 從 service discovery 消失時 up 整條不見，要 up == 0 加上 absent。
  - id: health-second-path
    min_tier: 1
    question: 抓得到 /metrics，就代表服務健康嗎
    why: 同一個 process 在失去 leader、quorum 或唯讀時仍可能照常回應 /metrics，up 維持 1。要看資料庫自己的健康 metric（例如 etcd_server_has_leader），並從不同路徑用 blackbox 探測健康端點（例如 /readyz、/ping）。三者交叉：up 0、探測 1 是 scrape 本身的問題；兩者都 0 是 process 或主機；up 1、健康 metric 異常是服務不健康。
  - id: metric-families-present
    min_tier: 1
    question: 該有的 metric 都還在嗎
    why: 沒有 collector 可看。版本升級改名、功能沒開或角色不同時，關鍵 metric 會整組不見，依賴它的規則安靜地回傳空。寫法是 up == 1 unless on(job, instance) <關鍵 metric>，再加 scrape_samples_scraped 突然下降。
  - id: scrape-budget
    min_tier: 2
    question: Scrape 來得及在期限內完成、內容沒有超過上限嗎
    why: 高基數的 endpoint 回應很大；scrape_duration_seconds 接近 scrape_timeout，或超過 sample_limit、body_size_limit 時，整次 scrape 失敗，所有 series 一起消失，看起來像 process 掛了。
  - id: component-count
    min_tier: 2
    question: 每種角色的節點數對嗎
    why: 一個 process 一個 endpoint，沒有 multi-target exporter 的連帶消失；風險變成某種角色少了（例如 TiDB 的 PD／TiKV／TiDB，YugabyteDB 的 master／tserver）。寫法是 count by (component) (up == 1) 和預期數量比。
  - id: endpoint-blocking
    min_tier: 2
    question: 產生 metric 時會不會被資料庫內部的鎖或忙碌卡住
    why: /metrics 的 handler 若要拿資料庫內部的鎖或排隊，資料庫忙碌時 scrape 逾時、整個 target 消失。依原始碼逐個回答；不會被卡住的寫在 not_applicable 並附原始碼行號。
  - id: replication-lag
    min_tier: 2
    question: Replication 延遲量的是真的嗎
    why: 同 exporter 型。沒有 replication 的服務寫在 not_applicable。
  - id: role-detection
    min_tier: 2
    question: 每個叢集剛好有一個 leader 或可寫入的主節點嗎
    why: 同 exporter 型；共識型的資料庫用 leader 數計數，0 或大於 1 都要告警。

# 每張 target 卡的訊號要涵蓋這些面向（signals[].aspect），
# 或在卡片的 not_applicable_aspects 寫明理由與依據（例如「PostgreSQL 核心沒有共識機制」並附 refs）。
required_aspects: [exporter, availability, workload, saturation, replication, cluster, maintenance, protection, capacity]
