# 產生的檔案，不要手改：由 tools/build_map.py（tools/build_pages.py 會呼叫）從 catalog/components、catalog/targets 產生。
# Skill 讀這份決定元件屬於哪個 plugin、每段有哪些項目；tools/validate.py 會檢查它是否過期。
# 卡片 id → 頁面 docs/components/<id>.md；每段的錨點見 sections[].anchor，訊號的錨點就是訊號 id。
sections:
- id: architecture
  title: 架構
  field: architecture
  anchor: architecture
- id: usage
  title: 正確使用
  field: usage
  anchor: usage
- id: observe
  title: 正確觀測
  field: signals[section=observe]
  anchor: observe
- id: misuse
  title: 不正確使用時的觀測
  field: signals[section=misuse], bad_queries
  anchor: misuse
- id: blind
  title: 目前無法觀測的痕跡
  field: blind_spots
  anchor: blind
plugins:
  alert-trust-core:
    title: 監控鏈
    dir: plugins/core
    cards:
    - prometheus
    - vmagent
    - victoriametrics
    - victorialogs
    - vmalert
    - alertmanager
    - thanos
    - grafana_alerting
    - observer
    skills:
    - alert-trust-core:selfcheck
    - alert-trust-core:env-profile
    - alert-trust-core:rule-review
    - alert-trust-core:prometheus
    - alert-trust-core:victoriametrics
    - alert-trust-core:alertmanager
    - alert-trust-core:policy-lint
  alert-trust-host:
    title: 主機與容器
    dir: plugins/host
    cards:
    - host
    skills:
    - alert-trust-host:host
    depends:
    - alert-trust-core
  alert-trust-mysql:
    title: MySQL
    dir: plugins/mysql
    cards:
    - mysql
    skills:
    - alert-trust-mysql:mysql
    depends:
    - alert-trust-core
  alert-trust-mariadb:
    title: MariaDB
    dir: plugins/mariadb
    cards:
    - mariadb
    skills:
    - alert-trust-mariadb:mariadb
    depends:
    - alert-trust-core
  alert-trust-postgresql:
    title: PostgreSQL
    dir: plugins/postgresql
    cards:
    - postgres_exporter
    skills:
    - alert-trust-postgresql:postgresql
    depends:
    - alert-trust-core
  alert-trust-valkey:
    title: Valkey／Redis
    dir: plugins/valkey
    cards:
    - redis_exporter
    skills:
    - alert-trust-valkey:valkey
    depends:
    - alert-trust-core
  alert-trust-mongodb:
    title: MongoDB
    dir: plugins/mongodb
    cards:
    - mongodb_exporter
    skills:
    - alert-trust-mongodb:mongodb
    depends:
    - alert-trust-core
  alert-trust-etcd:
    title: etcd
    dir: plugins/etcd
    cards:
    - etcd
    skills:
    - alert-trust-etcd:etcd
    depends:
    - alert-trust-core
  alert-trust-tidb:
    title: TiDB
    dir: plugins/tidb
    cards:
    - tidb
    skills:
    - alert-trust-tidb:tidb
    depends:
    - alert-trust-core
  alert-trust-yugabytedb:
    title: YugabyteDB
    dir: plugins/yugabytedb
    cards:
    - yugabytedb
    skills:
    - alert-trust-yugabytedb:yugabytedb
    depends:
    - alert-trust-core
  alert-trust-clickhouse:
    title: ClickHouse
    dir: plugins/clickhouse
    cards:
    - clickhouse
    skills:
    - alert-trust-clickhouse:clickhouse
    depends:
    - alert-trust-core
cards:
  prometheus:
    name: Prometheus
    kind: infra
    plugin: alert-trust-core
    page: components/prometheus.md
    architecture: architecture/prometheus.md
    usage:
    - scrape-timeout
    - scrape-within-interval
    - range-window
    - query-offset
    - lookback
    - group-layout
    - query-concurrency
    - query-timeout
    - resend-endsat
    - notifier-queue
    - retention-config
    - restart-gap
    - gomaxprocs-251
    - extra-scrape-metrics
    - k8s-selectors
    observe:
    - prometheus-down
    - watchdog
    - job-freshness
    - known-true-canary
    - rule-group-running
    - rule-failures
    - notify-to-alertmanager
    - crash-loop
    - config-reload
    misuse:
    - rule-group-ratio
    - notify-early-warning
    - wal-write-failed
    - for-reset
    - scrape-ratio
    - query-slots
    - tsdb-maintenance
    - size-retention
    - disk-free
    - memory-limit
    - root-cause
    bad_queries:
    - case: 昂貴的查詢（高基數或大量 regex 的 selector、長 range、subquery）
      signals:
      - query-slots
      - rule-group-ratio
      - memory-limit
    - case: 查詢排隊或執行超過 `--query.timeout`、撞到 `--query.max-samples`
      signals:
      - rule-failures
      - query-slots
    - case: 昂貴的 recording rule 和關鍵 alert 放在同一個 group
      signals:
      - rule-group-ratio
    - case: Recording rule 讓 series 暴增
      signals:
      - rule-group-ratio
      - memory-limit
    - case: Range 相對 `scrape_interval` 太短、或 selector 對不到
      signals:
      - for-reset
    - case: 長時間範圍的查詢佔住 block reader
      signals:
      - tsdb-maintenance
    blind:
    - 哪一條 rule 或哪一個查詢造成查詢負載
    - Recording rule 造成的 series 暴增來自哪一條
    - 永遠回空的 rule（視窗太短、selector 對不到）
    - 長查詢佔住 block reader 讓 reload 停住
    - OOM 或 crash loop 的原因
    - 查詢撞到 `--query.max-samples` 的是哪一條、撞的是哪一個上限
  thanos:
    name: Thanos
    kind: infra
    plugin: alert-trust-core
    page: components/thanos.md
    architecture: architecture/thanos.md
    usage:
    - strict-endpoints
    - partial-strategy
    - upload-retention
    - store-sync-delay
    - ruler-query-offset
    - ruler-resend
    - ruler-as-endpoint
    - receive-quorum
    observe:
    - components-up
    - store-endpoints
    - rule-eval-failures
    - rule-notify
    - data-watchdog
    - sidecar-prometheus
    - sidecar-upload
    - receive-replication
    - rule-partial-warnings
    - partial-response-strategy
    - shipper-failures
    - store-sync
    - query-dedup
    - query-strict-endpoints
    - ruler-own-data
    misuse:
    - compact-halted
    - rule-group-ratio
    - compact-singleton
    - receive-hashring
    - query-errors
    - compact-backlog
    - compact-has-run
    bad_queries:
    - case: Ruler 的查詢扇出到所有 store、時間範圍太長
      signals:
      - rule-group-ratio
      - rule-eval-failures
    - case: Rule group 用 warn 策略，store 回錯時用不完整的資料判斷
      signals:
      - rule-partial-warnings
      - partial-response-strategy
    blind:
    - Ruler 查詢失敗的原因（querier 停機還是 store 全部消失）
    - 哪一條查詢讓 querier 扇出變慢、哪個 store 拖慢
    - 上傳前就被 Prometheus 刪掉的 block
    - 不同 job 名稱的兩個 compactor 寫同一個 bucket
  vmagent:
    name: vmagent
    kind: infra
    plugin: alert-trust-core
    page: components/vmagent.md
    architecture: architecture/vmagent.md
    usage:
    - scrape-timeout-clamp
    - scrape-within-interval
    - max-scrape-size
    - disk-buffer-limit
    - keep-disk-queue
    - remote-write-queues
    observe:
    - vmagent-down
    - job-freshness
    - data-dropped
    - remote-write-retries
    - scrape-health
    misuse:
    - buffer-time-to-full
    - scrape-ratio
    bad_queries: []
    blind:
    - 補回的資料 rule 不會補判
    - Buffer 丟掉的是哪一段時間的資料
  victoriametrics:
    name: VictoriaMetrics single／cluster
    kind: infra
    plugin: alert-trust-core
    page: components/victoriametrics.md
    architecture: architecture/victoriametrics.md
    usage:
    - replication-factor
    - deny-partial-response
    - skip-slow-replicas
    - drop-on-overload
    - latency-offset
    - select-concurrency
    - min-free-disk
    observe:
    - components-up
    - partial-results
    - storage-reachable
    - restarts
    misuse:
    - read-only
    - disk-space
    - query-saturation
    - rows-dropped
    bad_queries:
    - case: 昂貴的查詢（高基數、長時間範圍）佔滿 vmselect 的併發
      signals:
      - query-saturation
    blind:
    - 哪一條查詢佔滿 vmselect 的併發、或觸發 -search.max* 上限
    - Partial response 少的是哪些 series
    must_ask:
    - id: dedup-interval
      question: VictoriaMetrics（vmstorage／vmselect／single）有沒有設 `-dedup.minScrapeInterval`？設多少？
      why: dedup 大於 scrape_interval 時實際資料間隔是 dedup，視窗要依它算；縮短 scrape_interval 也不會讓視窗變短
      refs:
      - bl-vm-dedup-flag
      - bl-vm-doc-dedup
      - bl-vm-doc-dedup-vmagent
      answer_key: dedup_interval
  victorialogs:
    name: VictoriaLogs＋vlagent
    kind: infra
    plugin: alert-trust-core
    page: components/victorialogs.md
    architecture: architecture/victorialogs.md
    usage:
    - log-rule-window
    - canary-filter
    - ingest-content-type
    - cluster-partial
    observe:
    - components-up
    - log-freshness
    - ingested
    - storage-reachable
    misuse:
    - read-only
    - vlagent-backlog
    - disk-space
    - query-load
    bad_queries:
    - case: 大時間範圍或沒有過濾條件的 LogsQL 佔滿 vlselect
      signals:
      - query-load
    - case: Canary 用 `* | stats count()` 沒加 `filter c:>0`
      signals:
      - log-freshness
    - case: Log rule 沒寫 `_time`，log 延遲超過 eval_delay + interval
      signals:
      - log-freshness
    blind:
    - 查詢故障期間進來的 log 事件
    - 全部 vlstorage 停時 vlinsert 記憶體裡的緩衝
    - 哪一條 LogsQL 查詢佔用了 vlselect 的併發
    - Log 延遲超過 eval_delay + interval 而漏掉的事件
  vmalert:
    name: vmalert
    kind: infra
    plugin: alert-trust-core
    page: components/vmalert.md
    architecture: architecture/vmalert.md
    usage:
    - eval-delay
    - range-window
    - query-step
    - watchdog-resend
    - notifier-timeout
    - group-concurrency
    - results-limit
    - state-restore
    - state-write-queue
    - operator-selector
    observe:
    - vmalert-down
    - watchdog
    - rule-errors
    - notifier-errors
    - rules-loaded
    - state-write
    - resolve-settings
    - config-reload
    misuse:
    - group-ratio
    - results-limit
    bad_queries:
    - case: Rule 回傳太多結果（高基數的 by、沒有聚合的 selector）
      signals:
      - results-limit
      - rule-errors
    - case: 昂貴的 MetricsQL 讓 vmselect 飽和或觸發 -search.max* 上限
      signals:
      - rule-errors
      - group-ratio
    - case: 昂貴的 recording rule 和關鍵 alert 放在同一個 group
      signals:
      - group-ratio
    - case: 視窗相對資料間隔與 eval_delay 太短，rule 永遠回空
      signals:
      - rules-loaded
    blind:
    - 哪一條 rule 的查詢讓 vmselect 飽和或觸發 -search.max* 上限
    - 重啟後 `for` 有沒有還原成功
    - 視窗太短而永遠回空的 rule
    must_ask:
    - id: data-latency
      question: 資料從 scrape 到 VictoriaMetrics 查得到，尖峰延遲 L 多久？（例如 vmagent remote write 的佇列延遲；不知道就說不知道，工具會用 L = S）
      why: vm-range-window 與通知時間都用 max(L, D)：L 大於 eval_delay D 時視窗要更長、偵測更晚；用假設值 L = S 算出的時間可能少算
      refs:
      - exp-vm-matrix
      - vma-evaldelay
      - vms-latency
      answer_key: latency
  grafana_alerting:
    name: Grafana Alerting
    kind: infra
    plugin: alert-trust-core
    page: components/grafana_alerting.md
    architecture: architecture/grafana-alerting.md
    usage:
    - nodata-error-state
    - provisioning-defaults
    - datasource-alert-route
    - external-alertmanager
    - evaluation-timeout
    - interval-vs-tick
    - endsat-dms
    - ha-peers
    - persistent-database
    observe:
    - grafana-down
    - watchdog
    - evaluations-running
    - evaluation-failures
    - state-settings
    - error-nodata-states
    - datasource-alert-routing
    - alertmanager-choice
    - external-send
    - embedded-notify
    - endsat-grace
    - state-restore
    - rule-store-db
    misuse:
    - eval-within-interval
    - scheduler-behind
    - ha-mode
    bad_queries:
    - case: Rule 的查詢比 interval 慢、但在 `evaluation_timeout` 內
      signals:
      - eval-within-interval
    - case: Rule 的查詢比 `evaluation_timeout`（預設 30s）慢
      signals:
      - eval-within-interval
      - evaluation-failures
    - case: 大量短 interval 的 rule 讓 scheduler 落後
      signals:
      - scheduler-behind
    - case: 查詢回空或失敗時設成 OK、KeepLast
      signals:
      - state-settings
      - error-nodata-states
    blind:
    - 設成 OK、Alerting、KeepLast 的 rule 遇到資料消失（NoData）
    - 哪一條 rule 的查詢慢或失敗
    - Grafana 資料庫讀不到或寫不進去
    - 內建與外部 Alertmanager 都送不到
    - 啟動時沒讀回 alert state
  alertmanager:
    name: Alertmanager
    kind: infra
    plugin: alert-trust-core
    page: components/alertmanager.md
    architecture: architecture/alertmanager.md
    usage:
    - failure-window
    - watchdog-route
    - repeat-on-tick
    - group-by
    - empty-group-by
    - resolve-timeout
    - failure-reason
    - smtp-version
    - ha-peer-timeout
    - gomaxprocs-flag
    observe:
    - alertmanager-down
    - delivery-failing
    - end-to-end
    - config-reload
    - crash-loop
    misuse:
    - attempts-failing
    - cluster-health
    - state-persistence
    bad_queries: []
    blind:
    - SMTP 不回應時卡住的 aggregation group
    - Alert store 往 dispatcher 的 channel 佔用率
    - 存活探測看不出通知已經送不出去
    - 單機當機時最後一次快照之後的 silence 變更
  observer:
    name: 外部觀察者與 dead man's switch
    kind: architecture
    plugin: alert-trust-core
    page: components/observer.md
    architecture: null
    usage:
    - federate-series
    - deadman-wait
    - probe-content
    - k8s-from-outside
    observe:
    - failure-domain
    - separate-alert-path
    - own-deadman
    - scrapes-all-infra
    - deadman-wait
    - federation
    - k8s-sources
    misuse: []
    bad_queries: []
    blind:
    - Meta 與被監控對象是否真的在不同故障域
    - 外部 dead man's switch 服務本身停機
  host:
    name: 主機與容器資源
    kind: infra
    plugin: alert-trust-host
    page: components/host.md
    architecture: architecture/db-resources.md#host-layer
    usage:
    - node-mixin-selector
    - cadvisor-labels
    - cadvisor-process-metrics
    - psi-sources
    - memory-limit-source
    - readonly-rule
    - memory-limit-threshold
    observe:
    - exporter-up
    - collector-success
    misuse:
    - disk-space
    - filesystem-readonly
    - oom-kills
    - container-memory-limit
    - memory-available
    - swap-activity
    - cpu-saturation
    - container-cpu-throttling
    - disk-latency
    - disk-busy
    - fd-headroom
    - clock-sync
    - network-errors
    - process-threads-cpu
    bad_queries: []
    blind:
    - 容器的 OOM kill 次數（cgroup 路徑不一致時）
    - 被 OOM kill 後沒有重啟的容器
    - 單次 IO 的延遲尖峰（fsync 慢）
    - 哪個行程在用 IO 或 page cache
  clickhouse:
    name: ClickHouse（server 與 ClickHouse Keeper；內建 <prometheus> /metrics＋SQL 查 system 表）
    kind: target
    plugin: alert-trust-clickhouse
    page: components/clickhouse.md
    guide: targets/clickhouse.md
    architecture: architecture/db-olap.md
    usage:
    - enable-prometheus
    - prometheus-subitems
    - heavy-metrics
    - kv-metric-names
    - replicas-status-verbose
    - keeper-ready-probe
    - native-events
    - qe-dsn-per-server
    - qe-account
    - qe-no-zookeeper-connection
    - qe-stagger-interval
    - qe-expiration-freshness
    - parts-threshold-from-sql
    - memory-settings
    - thread-pool-params
    - insert-batching
    - max-concurrent-queries
    - backups-after-restart
    observe:
    - endpoint-up
    - health-second-path
    - metric-families-present
    - scrape-budget
    - endpoint-blocking
    - sql-path
    - role-detection
    - component-count
    - replication-semantics
    misuse:
    - keeper-quorum
    - keeper-session
    - keeper-latency
    - replica-readonly
    - replication-lag
    - replication-queue
    - distributed-queue
    - writes-rejected
    - query-admission
    - parts-pressure
    - memory
    - global-thread-pool
    - failed-queries
    - error-counters
    - merge-pool
    - mutations
    - detached-parts
    - backups
    - data-integrity
    - disk-space
    bad_queries:
    - case: 大量小 insert（每次幾列）或 partition key 太細，part 數暴增
      signals:
      - parts-pressure
      - writes-rejected
      - merge-pool
    - case: 對大表頻繁 ALTER UPDATE／DELETE（mutation）
      signals:
      - mutations
      - merge-pool
    - case: 撞到 max_memory_usage 的查詢（大 GROUP BY、JOIN、排序）
      signals:
      - memory
      - failed-queries
    - case: 沒有條件或 LIMIT 的大 SELECT
      signals:
      - memory
      - query-admission
      - global-thread-pool
    - case: 查詢風暴（並行查詢超過 max_concurrent_queries）
      signals:
      - query-admission
    - case: 透過 Distributed 表非同步寫入，目的 shard 收不下
      signals:
      - distributed-queue
    - case: ON CLUSTER DDL 在 Keeper 排隊
      signals:
      - keeper-latency
    blind:
    - 每張表的唯讀、延遲、佇列、active replica 數（system.replicas）
    - mutation 失敗與卡住（system.mutations）
    - 被伺服器移走的 part（system.detached_parts 的 reason）
    - 哪一張表的 part 太多、目前的 parts_to_delay_insert
    - Distributed 送出失敗的原因與哪一張表
    - 原生 BACKUP 的結果與新鮮度
    - 端到端能不能寫入（真的 insert 一列）
    - 哪一條查詢造成負載、是哪一種壞查詢（沒有條件的大 SELECT、撞到 max_memory_usage 的查詢、對大表的 mutation）
    - TLS 憑證到期
    - 慢磁碟、磁碟滿、檔案系統唯讀
    - Keeper 慢、ON CLUSTER DDL 佇列卡住
  etcd:
    name: etcd（內建 /metrics）
    kind: target
    plugin: alert-trust-etcd
    page: components/etcd.md
    guide: targets/etcd.md
    architecture: architecture/db-raft.md
    usage:
    - probe-readyz
    - probe-health
    - probe-exclude-learner
    - metrics-listener
    - metrics-level
    - sample-limit
    - one-job-per-cluster
    - auto-compaction
    - quota-and-disarm
    - corruption-check
    - request-size-limits
    observe:
    - endpoint-up
    - health-second-path
    - metric-families-present
    - scrape-budget
    - endpoint-blocking
    - alarm-visibility
    - component-count
    - replication-semantics
    - corruption-check
    misuse:
    - has-leader
    - alarms
    - quorum
    - role-detection
    - leader-changes
    - peer-network
    - learner
    - replication-lag
    - snapshot-transfer
    - wal-fsync
    - backend-commit
    - slow-apply
    - proposals-pending
    - fd-headroom
    - grpc-errors
    - proposals-failed
    - request-latency
    - bad-requests
    - compaction
    - defrag
    - db-quota
    - db-growth
    bad_queries:
    - case: 大範圍 range request（讀整個 prefix）
      signals:
      - bad-requests
      - request-latency
      - endpoint-blocking
    - case: 大量 watch，或 client 讀 watch 太慢
      signals:
      - bad-requests
    - case: 過大的值或 op 太多的 txn
      signals:
      - bad-requests
      - grpc-errors
      - db-quota
      - db-growth
    - case: lease 大量建立或過期（lease storm）
      signals:
      - bad-requests
    - case: 持續寫入但沒有 compaction，把 DB 撐到 quota
      signals:
      - compaction
      - db-quota
      - alarms
    blind:
    - 備份（etcdctl snapshot save）的新鮮度與可還原性
    - TLS 憑證到期（client、peer、metrics listener）
    - 每個 follower 的 raft 進度（match index、inflight）
    - alarm 在 member 重啟後的狀態
    - 慢請求與大請求的內容（哪個 key、哪個 client）
    - 磁碟剩餘空間、檔案系統唯讀
    - 資料損毀
    - 哪個 client 開了大量 watch、lease 或送大範圍讀取
    - 單一 key 的值有多大、哪些 key 最大
