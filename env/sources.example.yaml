# metric 來源確認（rule-review 第 2 步的產出；使用者回答 check_metric_sources.py 的問題後填寫）。
# 複製成 env/<名稱>.sources.yaml；env/*.yaml 已在 .gitignore，不要 commit。下面的 job 名稱都是虛構的。

# relabel_configs 或 honor_labels 會改寫 job 時：改寫之後實際存在的 job 名稱（完整列出）。
job_names: [order-api, payment-api]

# 一次回答一整個 exporter：目錄卡片 id → 產生它的 scrape job。
producers:
  mysqld_exporter: [mysql]
  node_exporter: [node]

# 個別 metric，例如應用程式自己的 metric 或卡片沒有列的 metric。
metrics:
  order_latency_seconds_bucket: { jobs: [order-api], note: "order-api 自己的 /metrics" }

# rule 要的非 job label（例如 role="primary"、cluster="…"），config 的 static_configs labels 與 relabel_configs 都沒有加時，
# check_metric_sources.py 會問它從哪裡來。exporter 自己輸出就寫 exporter（或其他說明）；根本沒有就寫 none，
# 報告會把用到它的 rule 標成 label_mismatch（回傳空、不會響）。
labels:
  role: none
  cluster: "static_configs labels（在另一份 scrape_config_files 裡）"

# 資料庫版本（決定哪些訊號適用；卡片訊號的 versions 欄位）：job → 版本字串。
target_versions:
  mysql: "8.4.13"

# 每個 job 有哪些功能（決定哪些 rule 適用這個部署；詞彙見 env/env.example.yaml 的 features）。
features:
  mysql: [replication-primary]

# 以下是 rule-review 其他輪的回答（tools/inventory.py、fit_contracts.py、review.py 都讀同一份 answers）。數字都是例子。

# 「這類故障要在幾分鐘內通知到人？」：有 critical rule 而沒有這一項時，盤點把它列為必問。
notify_within: 5m

# scrape 耗時（7 天）。k 的來源要分清楚：max_consecutive_failures 是量到的最長連續失敗（報告標「觀察到的連續失敗」）；
# 只有 up0_count 或 failures_per_window（例如「任 5 分鐘最多 3 次」）時，k 只標「上限／假設」，盤點會問「最長連續失敗幾次？」。
measured:
  mysql: { d_p99: 4s, d_max: 7s, up0_count: 2, max_consecutive_failures: 1, tau: 10s }

# 元件卡 must_ask 的回答（facts.<卡片>.<id>）。巢狀和扁平兩種寫法相同：
#   facts: { etcd.metrics-level: basic }
# 卡片的 must_ask[].effects 寫了回答會改變什麼（例如 basic 時讀 grpc_server_handling_seconds_bucket 的 rule「這個設定下沒有資料」）。
facts:
  etcd:
    metrics-level: basic

# 卡片 must_ask 有 default（例如 etcd --metrics 預設 basic）時，回答前工具就用預設值，標「假設：預設值」。

# 使用者答「不知道／沒權限」的題目（題目 id 或 answer key）：不再問，摘要寫出改用的假設。也可以把值寫成 unknown。
unknown: [external_observer]

# 這輪延後的題目：下一輪排第 1 題，直到回答或寫進 answered／unknown（上一輪在前 3 題、沒回答的 must_ask 會自動記進來）。
deferred: []

# 使用者同意的提案方向（不是 keep_range；keep_range 只記「這個視窗是刻意的嗎？」的直接回答）。
approved:
  - { rule: ExampleRule, change: "改成 last_over_time", round: 2 }
