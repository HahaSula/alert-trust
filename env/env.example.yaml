# 環境描述檔範例（檢查流程階段 1 的產出）。
# 複製成 env/<名稱>.yaml 後填入你的環境；env/*.yaml 已在 .gitignore，不要 commit 到公開 repo。
# 下面的名稱、版本與數字都是虛構的。
name: example
components:
  - { id: prom-a,      type: prometheus,   version: "3.13.5", url: http://localhost:9090 }
  - { id: am,          type: alertmanager, version: "0.34.2", url: http://localhost:9093, replicas: 2 }
  - { id: vmalert-biz, type: vmalert,      version: v1.155.0, datasource: vm, notifiers: [am], resend_delay: 3m }
  - { id: vmalert-wd,  type: vmalert,      version: v1.155.0, datasource: vm, notifiers: [am], role: watchdog }
  - { id: vm,          type: victoriametrics, mode: cluster, replication_factor: 2 }
observers:
  - id: meta
    type: prometheus
    failure_domain: other-cluster      # 和被監控對象不同的節點、儲存、叢集
    notify_via: am-meta                # 不經過被監控的 Alertmanager
    scrapes: [prom-a, am, vm, vmalert-biz, vmalert-wd]
    federates_from: [prom-a]           # up、scrape_duration_seconds、ALERTS_FOR_STATE
# deadman：Watchdog 送到的外部 dead man's switch。沒有就整段不寫；不要寫 unknown（unknown、不知道、空白都不算回答）。
deadman:
  receiver: external-webhook
  max_silence: 10m
critical:
  alerts: [OrderLatencyHigh, DiskAlmostFull]
  jobs: [order-api, mysql]
  notify_within: 5m
# targets[]：被 scrape 的資料庫與 exporter。
#   job：config 裡「實際」的 scrape job 名稱（prometheus.yml 的 job_name，或 relabel 之後的值），不是 rule 裡寫的。
#        check_coverage.py 用它檢查 rule 的 job 條件：名稱和範本一樣、job 卻選不到時標 rule_job_mismatch。
#   features：這台「有」的功能，要列完整；有列 features 時，沒列的功能就當成沒有，
#        卡片 applies_when 需要它的訊號標 not_applicable。沒有 features 這個欄位時，這些訊號照常檢查，
#        說明欄寫「需要回答：有沒有 X」。components[] 也可以寫 features（例如 retention-size、results-limit）。
#   features 可用的詞（tools/check_coverage.py 的 FEATURES）：
#     複寫        replication（不分主從）、replication-primary（有複本的主庫）、replication-replica（複本／standby）
#     MySQL／MariaDB gtid、semi-sync、galera（MariaDB Galera）、group-replication（MySQL Group Replication／InnoDB Cluster）、
#                 heartbeat（pt-heartbeat 之類的 heartbeat 表）
#     exporter    multi-target-probe（一個 exporter 帶多個 target：/probe、/scrape、多個 --mongodb.uri）、
#                 query-exporter（有部署 query-exporter 補自訂查詢）、node-exporter（同一台主機有 node_exporter）
#     PostgreSQL  patroni、replication-slot、sync-replication（synchronous_standby_names）、archive-mode、
#                 pgbackrest、pg-stat-statements
#     MongoDB     replica-set、sharded　　Redis：sentinel、redis-cluster、rdb（有設 save）、aof、check-keys
#     元件        retention-size（Prometheus retention.size）、results-limit（vmalert group limit／-rule.resultsLimit）
#     主機        container（跑在容器裡）、cpu-limit（容器有 CPU limit）、process-exporter（有 process-exporter）
#   replication 的訊號大多只在一邊有意義（例如 replication-running 只看 replica、primary-writable 只看 primary）：
#   知道是哪一邊就寫 replication-primary 或 replication-replica；只寫 replication 時，這些訊號會問「是 primary 還是 replica」。
#   version：資料庫（或伺服器）本身的版本，不是 exporter 的版本；寫法照 SELECT VERSION() 之類的原樣即可
#        （"8.4.13"、"v3.6.16"、"2024.2.3.0"、"26.8.3.1"、"11.4.13-MariaDB"）。components[].version 同理。
#        卡片訊號有 versions（min 含、max 不含）時：版本在範圍外標 not_applicable「版本 X 沒有這個 metric（需要 ≥ Y）」；
#        沒寫版本時照常檢查，說明欄寫「需要回答：版本」。規則有 annotations.alert_trust_min_version 時，
#        版本低於它的那條規則不算涵蓋。也可以在 answers 檔寫 target_versions.<job>，經 inventory 帶進來（env.yaml 優先）。
targets:
  - { id: db-1, type: mysql, version: "8.4.13", scraped_by: prom-a, job: mysql, features: [replication-primary, gtid] }
  - { id: db-2, type: mysql, version: "8.4.13", scraped_by: prom-a, job: mysql, features: [replication-replica, gtid, heartbeat] }
