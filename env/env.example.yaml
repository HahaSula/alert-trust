# 環境描述檔範例（檢查流程階段 1 的產出）。
# 複製成 env/<名稱>.yaml 後填入你的環境；env/*.yaml 已在 .gitignore，不要 commit 到公開 repo。
# 下面的名稱、版本與數字都是虛構的。
name: example
components:
  - { id: prom-a,      type: prometheus,   version: "3.13.5", url: http://localhost:9090 }
  - { id: am,          type: alertmanager, version: "0.34.2", url: http://localhost:9093, replicas: 2 }
  - { id: vmalert-biz, type: vmalert,      version: v1.155.0, datasource: vm, notifiers: [am], resend_delay: 3m }
  - { id: vmalert-wd,  type: vmalert,      version: v1.155.0, datasource: vm, notifiers: [am], role: watchdog }
  - { id: vm,          type: victoriametrics, mode: cluster, replication_factor: 2 }
observers:
  - id: meta
    type: prometheus
    failure_domain: other-cluster      # 和被監控對象不同的節點、儲存、叢集
    notify_via: am-meta                # 不經過被監控的 Alertmanager
    scrapes: [prom-a, am, vm, vmalert-biz, vmalert-wd]
    federates_from: [prom-a]           # up、scrape_duration_seconds、ALERTS_FOR_STATE
deadman:
  receiver: external-webhook
  max_silence: 10m
critical:
  alerts: [OrderLatencyHigh, DiskAlmostFull]
  jobs: [order-api, mysql]
  notify_within: 5m
targets:
  - { id: db-1, type: mysqld_exporter, scraped_by: prom-a, job: mysql }
